          release-train's fr-gate reason.
          WAS `required` until .github#335, and the caller's absence is DELIBERATE, not a
          discovery. claude-skills#38 removed `fr-gate-caller.yml` on purpose (+0/-15) as the
          remainder of backend#2347: this repo does not ride the train, so it was carrying a
          train caller it cannot use. The audit reporting "MISSING required caller" mid-review
          was that removal surfacing, not a caller going astray.
          DO NOT RESTORE IT. An earlier revision of this reason ended "if the caller was removed
          by mistake, restore it and flip this back", which reads as an open question and invites
          undoing a deliberate change; the remedy does NOT run both ways here (saadqbal via
          saadqbal via Bugbot on the .github#334 staging hop). Restoring it would require a context nothing produces, which is
          the client#665 defect this file warns about two entries up.
      stale-backlog.yml: required   # stale-backlog-caller.yml
      fr-pass-comment.yml:
        exempt: *fr_pass_comment_caller_missing
      kanban-closure-router.yml: required   # kanban-closure-routing.yml
      set-pr-status.yml: required   # set-pr-status.yml
      wip-limit-check.yml:
        exempt: *wip_limit_check_has_no_callers
      blocked-gate.yml:
        exempt: *blocked_gate_rollout_pending
      bugbot-gate.yml: required   # bugbot-gate-caller.yml
    copies:
      add-to-kanban.yml: required
    quality_files:
      CLAUDE.md: required
      ".cursor/BUGBOT.md": required

