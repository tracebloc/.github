          # branch, and this is the file that says so out loud. Consistent with
          # `enforce_admins: false` above and decided for the same reason: this
          # repo is the tool used to REPAIR the pipeline, so a broken train must
          # not also be unfixable. It is the widest allowance in the fleet, which
          # is exactly why it is written down as an EXACT list - a third name
          # appearing here is a finding, not a shrug. Measured 2026-08-15.
          bypass_reviews: ['LukasWodka', 'saadqbal']
          # The fleet baseline names `gate / gate` -- the fr-gate, which only
          # exists on a promotion pipeline. This repo has none, so the baseline
          # cannot apply; the narrower set is stated rather than left implicit.
          # The same is true of the three `quality / *` contexts, including
          # `quality / action-pins` added to the baseline by backend#1976: they
          # are reported by the code-quality caller, which this repo records as
          # `exempt: *code_quality_caller_missing` above. Requiring a context
          # nothing reports leaves every PR pending forever (client#665), so
          # this cell drops them BECAUSE the producer is absent, not because the
          # rule was judged not to matter here.
          # Stated as its REAL set rather than [] - this repo is the tool that
          # performs every promotion, so its own gates are worth guarding.
          required_checks:
            - actionlint
            - mutation
            - shell
