    visibility: public
    # Enrolled 2026-08-04 (backend#1420, D1 5-of-5). staging created from main
    # (256fa3e4); docs#80 backmerged main into develop and added the fr-gate
    # caller; release-train#30 added the repos.yml entry (that side lands first,
    # per the two-file coupling this guard audits).
    release_train: true
    protection:
      develop: required
      staging:
        divergent:
          reason: *docs_no_required_review
          min_reviews: 0
          # docs requires NO status check on staging or prod - the 2026-06-04
          # exemption is broader than review alone. Stated as [] so the gap is a
          # sentence here rather than a silence.
          required_checks: []
      prod:
        divergent:
          reason: *docs_no_required_review
          min_reviews: 0
          required_checks: []          # as staging, above
    callers:
      version-bump-gate.yml:
        exempt: *version_gate_not_applicable
      # Flipped exempt -> required 2026-08-04: the caller was added on MAIN only
      # (docs#70, a docs-exception direct merge) where the develop-first audit
      # could not see it. docs#80's backmerge brought it onto develop.
      advance-deploy-env.yml: required   # advance-deploy-env.yml
      # Remediated 2026-08-04 (backend#1420): docs is public, so code-quality is
      # its ONLY content gate. Called with python:false / shell:false
      # (measured: 0 .py, 0 .sh), leaving gitleaks + house-rules as the real checks.
      # soft-fail is left at its advisory default until a first green run is observed
      # on this repo; arming it required on `main` is the follow-up, not this line —
      # and it must wait until the caller has PROMOTED to main, or every
      # direct-to-main docs-exception PR deadlocks on a check that cannot report.
      code-quality.yml: required   # code-quality-caller.yml
      customer-priority-bump.yml: required   # customer-priority-bump.yml
      # Flipped exempt -> required 2026-08-04: staging now exists and docs is on
      # the train, whose settle/release poll "gate / gate" fail-closed (docs#80).
