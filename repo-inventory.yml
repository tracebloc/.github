      fr-gate.yml:
        exempt: >-
          release-train drives the train and is exempt from riding it (RFC-BACKEND-1405 D1), so
          it has no staging branch and no staging -> prod hop. Structural.
      fr-pass-comment.yml: required   # fr-pass-comment-caller.yml
      kanban-closure-router.yml: required   # kanban-closure-routing.yml
