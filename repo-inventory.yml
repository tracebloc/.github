        exempt: *wip_limit_check_has_no_callers
    copies:
      add-to-kanban.yml:
        divergent: >-
          release-train's copy adds a header explaining why the repo is exempt from riding the
          train, and pins actions/add-to-project@v2.0.0 rather than v1.0.2. The comment is
          wanted; the version pin is drift. Divergent until the pin is realigned.
      stale-backlog.yml:
        exempt: >-
          release-train has add-to-kanban.yml but no stale-backlog.yml. Auto-closing backlog
          items in the repo that drives promotions is a deliberate omission - stale-backlog.yml
          is column-blind and would close live pipeline work (backend#1408 P3).

  rfcs:
    visibility: private
    release_train: false
    callers:
      # Per-caller reasons, not one blanket text (Bugbot, .github#138). The first
      # version of this block asserted "no hop to gate" for all nine, which is only
      # true for some of them and silently overwrote reasons that were already
      # accurate. An exemption whose stated reason does not describe the caller is
      # worse than no exemption: it reads as decided when it is unexamined.
      advance-deploy-env.yml:
        exempt: >-
          this repo has no `develop` and no deploy stages -- it is `main`-only by decision
          (README: "no artifact, no deploy stages"), so there is no dev stage for a card to
          advance INTO. Structural, not a gap.
      code-quality.yml:
        exempt: *code_quality_caller_missing
      customer-priority-bump.yml:
        exempt: *customer_priority_bump_caller_missing
      fr-gate.yml:
        exempt: *no_staging_branch_no_hop_to_gate
      fr-pass-comment.yml:
        exempt: >-
          fr-pass advances a card out of `FR on staging`. This repo has no `staging` branch
          and is not on the train, so that column is unreachable for it. Structural, not a
          gap -- and distinct from the fr_pass_comment_caller_missing repos, which DO have
          the stage and lack the valve.
      kanban-closure-router.yml:
        exempt: *kanban_closure_router_caller_missing
      public-pii-gate.yml:
        exempt: *private_repo_no_public_exposure
      set-pr-status.yml: required   # set-pr-status.yml
      wip-limit-check.yml:
        exempt: *wip_limit_check_has_no_callers
    copies:
      add-to-kanban.yml: required
      stale-backlog.yml:
        exempt: >-
          no stale-backlog copy: this repo holds decision documents, not a backlog. An RFC
          that has sat untouched is not stale in the sense the sweep measures -- it is a
          decision nobody has taken, which is what the board card is now for (.github#138).
