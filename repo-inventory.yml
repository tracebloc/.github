  # ADDED 2026-08-25 (.github#332). `design-system-v2` was created at 11:35 that day,
  # WHILE this PR was in review, and the audit went red on `active in tracebloc but
  # absent from repo-inventory.yml`. That is backend#2498's second half in one sentence:
  # `caller-drift` audits the LIVE FLEET rather than the diff, so `.github` can only
  # merge at an instant when every repo in the org is conformant.
  #
  # IT COULD NOT BE ENTERED WHEN IT FIRST APPEARED, and that is worth recording. While
  # the repo was empty the guard refused to audit it at all -- "An empty repo is a
  # legitimate state, but it is not one this guard can audit" -- so an entry only moved
  # the finding from `absent from repo-inventory.yml` to `repo has no branches`. Neither
  # is fixable from this file. The entry became possible only once the repo got its
  # first branch, which is the correct order: the inventory records measured reality,
  # and there was nothing to measure.
  #
  # ON THE TRAIN SINCE 2026-08-26T12:12:21Z -- release-train/repos.yml commit
  # 8330f408, "feat(train): design-system-v2 joins the train", onboarded under
  # backend#2547. `release_train: false` survived that hop by one day, and that
  # single cell failed the repo-conformance audit -> the required `gate` context
  # -> `.github`'s OWN promotion to staging (backend#2653). The guard was right
  # to refuse: it cannot tell a bookkeeping disagreement from a repo that joined
  # the train with no fr-gate caller, and must not guess. (The caller is present
  # here -- `fr-gate-caller.yml`, measured on develop 2026-08-27 -- so nothing
  # was ever actually ungated.)
  #
  # THE ONE-BRANCH MEASUREMENT THIS BLOCK WAS WRITTEN ON IS GONE. Joining the
  # train created the promotion lane: re-measured 2026-08-27, the repo has
  # `develop` (default), `staging` and `main`. Every cell below is measured on
  # `develop`, which is now the develop-first audit branch BECAUSE the repo is
  # on the train (caller-drift.py:1216), not because it is the only branch.
  design-system-v2:
    visibility: private
    release_train: true
    protection:
      # ALL THREE ROLES NOW EXIST AND NOT ONE OF THEM IS PROTECTED. Measured
      # 2026-08-27: `develop`, `staging` and `main` each return "Branch not
      # protected" from the classic endpoint AND the repo has ZERO rulesets, so
      # neither protection system covers any of them. Joining the train created
      # the branches; it did not arm them.
      #
      # WHY THESE STAY `exempt` RATHER THAN FLIPPING TO `required` WITH THE FLAG
      # ABOVE: `required` over an unarmed branch is a RED gate on merge, and
      # nothing in this file may land red (CLAUDE.md rule 4 -- arm while green).
      # The order is branch first, cell after, the same order the callers block
      # below states for exemptions. Arming is the open half of backend#2547.
      #
      # STALENESS STILL BITES, which is what keeps these honest: the moment any
      # of the three gains protection of either kind, caller-drift flags the
      # exemption as stale (caller-drift.py evaluate_protection) and the cell
      # must be promoted. An unprotected branch is the ONE state these rows can
      # describe without the guard objecting -- see `no_develop_branch_single_branch_repo`.
      develop:
        exempt: "`develop` exists and carries NO protection of either kind (classic endpoint 404s `Branch not protected`; repo has zero rulesets - measured 2026-08-27). This repo is ON the train since 2026-08-26, so protection_policy.develop DOES apply here: this is a real, UNREMEDIATED gap rather than a structural one, and arming it is the open half of backend#2547. Deliberately not `required` yet - see the block comment above on arming before asserting."
      staging:
        exempt: "`staging` was created by the train onboarding and carries NO protection of either kind (measured 2026-08-27). Same case as `develop` above: on-train policy applies, nothing is armed, UNREMEDIATED under backend#2547. Recorded rather than aliased to `no_staging_branch_not_on_train`, whose premise - no train, no staging branch - is false here in both halves as of 2026-08-26."
      prod:
        exempt: "`main` exists (measured 2026-08-27) and carries NO protection of either kind, so the fleet's strictest role - enforce_admins closed, fr-gate required - is enforced by nothing. Same case as the two rows above: on-train policy applies, arming is UNREMEDIATED under backend#2547. This row previously read \"No prod branch exists ... structural, not a gap\"; the branch now exists, so that reading is retired."
    rulesets:
      promotion_merge_commit_only:
        exempt: "The repo has ZERO rulesets of any kind (measured 2026-08-27) while `staging` and `main` now exist and the train promotes through them - so nothing stops a promotion PR being squash-merged, which collapses the merge-commit ancestry promote-repo.sh reads and jams the next prepare. UNREMEDIATED, tracked with the protection arming in backend#2547. Not `required`, for the same arm-before-asserting reason as the protection rows above."
      tag_trust_root:
        exempt: "The repo has ZERO rulesets (measured 2026-08-27). The previous reason here - \"publishes nothing from a `v*` tag today - no tag-triggered workflow and no v* tags cut\" - is now false in BOTH halves: `publish.yml` triggers on `push: tags: ['v*']` and publishes to GitHub Packages, and `v0.1.0-rc.1` is cut. So the trust root is MISSING rather than inapplicable. UNREMEDIATED, tracked in backend#2547."
    callers:
      # THE QUESTION THIS NOTE ANSWERED HAS EXPIRED, and the answer is kept
      # because the measurements in it are the record. It asked why an OFF-TRAIN
      # repo carried on-train promotion cells (Bugbot Medium, backend#2512,
      # deferred from the .github#334 hop): this block was created 2026-08-25 by
      # copying ON-TRAIN `design-system`, so all three promotion-shaped rows
      # arrived `required` while `claude-skills`, `release-train` and `rfcs`
      # exempt version-bump and fr-gate. Since 2026-08-26 this repo IS on the
      # train, so `design-system` is simply the right template and the three
      # non-train repos are no longer the comparison class.
      # RE-MEASURED 2026-08-27, AFTER THE REPO JOINED THE TRAIN (backend#2653).
      # The 2026-08-26 measurement this note was written on said "ONE branch,
      # `develop`", and the whole dormancy argument below rested on it. The
      # onboarding created `staging` and `main`, so it no longer holds:
      #
      #   version-bump-gate  fires on `branches: [develop]` -- ACTIVE on every PR
      #                      here, and now applicable through the train too: the
      #                      repo declares `version_file: package.json`.
      #   fr-gate            fires on `branches: [staging, main, master]`. `staging`
      #                      and `main` NOW EXIST, so this is LIVE, not dormant --
      #                      it is the gate on every promotion into them.
      #   fr-pass-comment    fires on `issue_comment` with NO branch filter, so it
      #                      CAN fire. See its own note.
      #
      # WHY ALL THREE STAY `required`: they are what an on-train repo is meant to
      # carry, and independently all three callers EXIST here -- an `exempt` row
      # whose caller is present is the stale-exemption finding
      # (caller-drift.py:2309). Exempting anything here would mean DELETING the
      # caller first -- caller first, entry after -- and there is now no reason
      # to want that. backend#2512's open half was whether a component library
      # nobody promotes should carry them; the train answered it by promoting one.
      version-bump-gate.yml: required   # version-bump-gate-caller.yml
      advance-deploy-env.yml: required   # advance-deploy-env.yml
      code-quality.yml: required   # code-quality-caller.yml
      customer-priority-bump.yml: required   # customer-priority-bump.yml
      # LIVE AS OF 2026-08-26, and it was DORMANT when this row was written --
      # the note here said so, on the then-true measurement that staging/main
      # did not exist. Joining the train created both, so the caller's
      # `branches: [staging, main, master]` now matches real promotion PRs and
      # this row asserts an enforcing gate, not merely a present file.
      fr-gate.yml: required   # fr-gate-caller.yml
      stale-backlog.yml: required   # stale-backlog-caller.yml
      # THE MISFIRE THIS NOTE DESCRIBED IS GONE, and the reason is worth keeping:
      # its caller triggers on `issue_comment` with no branch filter, so a
      # `/fr-pass` typed here always reached the reusable -- which, in a repo with
      # no `staging`, had no `FR on staging` card to advance. Since 2026-08-26 the
      # repo is on the train and HAS a `staging`, so the comment now means exactly
      # what it means everywhere else. `release-train` also keeps this `required` while
      # exempting the other two, which is the sibling split Bugbot flagged; that
      # is deliberate there, because the train's own cards do get functionally
      # reviewed. Whether the reasoning transfers to a component library nobody
      # promotes is the open half of backend#2512 and is NOT settled here.
      fr-pass-comment.yml: required   # fr-pass-comment-caller.yml
      kanban-closure-router.yml: required   # kanban-closure-routing.yml
      set-pr-status.yml: required   # set-pr-status.yml
      wip-limit-check.yml:
        exempt: *wip_limit_check_has_no_callers
      blocked-gate.yml:
        exempt: *blocked_gate_rollout_pending
      bugbot-gate.yml: required   # bugbot-gate-caller.yml
    copies:
      add-to-kanban.yml: required
    quality_files:
      CLAUDE.md: required
      ".cursor/BUGBOT.md": required

  claude-skills:
    visibility: private
    release_train: false
    protection:
      develop:
        exempt: *develop_unprotected_non_train
      staging:
        exempt: *no_staging_branch_not_on_train
      prod:
        divergent:
          reason: *not_a_pipeline_prod_branch
          enforce_admins: false
          bypass_reviews: []      # nothing promotes here; see the reason above
          # The fleet baseline names `gate / gate` -- the fr-gate, which only
          # exists on a promotion pipeline. This repo has none, so the baseline
          # cannot apply; the narrower set is stated rather than left implicit.
          # The three `quality / *` contexts are a DIFFERENT case, and this comment
          # stated it wrongly until .github#335 (Bugbot). It said they are dropped
          # "BECAUSE the producer is absent", citing
          # `exempt: *code_quality_caller_missing`. That reason dies with the row
          # above: this repo's `code-quality.yml` is now `required` because
          # `code-quality-caller.yml` exists, so the contexts ARE produced here.
          #
          # The accurate reason is narrower, and measured: `claude-skills/main` carries
          # NO required status checks at all (classic protection, empty `contexts`,
          # measured 2026-08-25). This is non-train infra whose `main` is a working
          # branch, so nothing is required there by decision -- the same decision as
          # `enforce_admins: false` above, not a gap.
          #
          # The client#665 lesson still holds, but about ORDER rather than this cell:
          # requiring a context nothing reports leaves every PR pending forever, so a
          # caller becomes `required` BEFORE its contexts do, never the reverse.
          # (`release-train` still carries the original wording, correctly -- it has no
          # code-quality caller, so its producer really is absent.)
          required_checks: []
    rulesets:
      promotion_merge_commit_only:
        exempt: "Not on the release train: no staging branch and no promotion PRs, so there are no promotion branches for a merge-method rule to protect."
      tag_trust_root:
        exempt: "Publishes nothing from a `v*` tag - no tag-triggered workflow and no v* tags cut (measured 2026-08-11)."
    callers:
      version-bump-gate.yml:
        exempt: *version_gate_not_applicable
      advance-deploy-env.yml: required   # advance-deploy-env.yml
      code-quality.yml: required   # code-quality-caller.yml
      customer-priority-bump.yml: required   # customer-priority-bump.yml
      fr-gate.yml:
        exempt: >-
          no fr-gate caller, and none is applicable: this repo has no staging branch and no
          promotion PRs, which the `rulesets.promotion_merge_commit_only` reason in this same
          entry already asserts. The fr-gate only reports on a PR targeting staging/main/master
