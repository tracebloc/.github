# repo-inventory.yml - the per-repo CONTRACT every active repo must meet. THE
# single source of truth; `.github/workflows/caller-drift.yml` fails when reality
# diverges from it.
#
# The property families (backend#1608 - one checker, one contract, one report,
# deliberately NOT a separate audit per family to keep in step):
#   callers / copies   which tracebloc/.github reusable workflows a repo must call,
#                      and which duplicated files must match the canonical copy
#   protection         branch protection per branch ROLE (develop/staging/prod),
#                      holding the backend#1276 decisions of record
#   rulesets           GitHub's SECOND protection system (backend#1681)
#   quality_files      files every repo must CARRY at a fixed path, asserted by
#                      presence because their content is per-repo by design
#
# Adding a property means adding a row for ALL 20 repos. That is the point: it is
# the forcing function that stops a new repo arriving with a gap nobody notices.
#
# EDITING THIS FILE IS GATED (tracebloc/backend#1608). caller-drift.yml has always
# RUN on PRs that touch this file, but it was not a required check - so a PR that
# put the inventory out of step with reality went red and could still merge.
# `.github/workflows/conformance-gate.yml` is the required check that closes that:
# it reports on every PR, is green in seconds when this file is untouched, and
# when it IS touched it refuses unless the audit passed on that exact head sha.
#
# WHY THIS FILE EXISTS (tracebloc/backend#1415)
# Nothing in the org detected a missing caller. merge-settings-drift.yml reads
# three booleans; kanban-reconcile.yml probes one filename to decide board scope.
# That is how eight repos drifted unnoticed and how e2e-test-agent#1 closed
# without routing - at the time that repo had no closure caller to route it.
# e2e-test-agent#13 added one on 2026-08-05, which is why its entry below now
# reads `required`: the motivating gap is closed, the detection gap is why this
# file exists.
#
# THE SCHEMA DECISION: ABSENCE IS NEVER IMPLICIT.
# Every repo carries an entry for EVERY reusable, EVERY copy and EVERY quality
# file. Each entry is exactly one of:
#
#   required            the caller must be present (copies: content must match)
#   exempt: "<reason>"  the caller must be absent, and WHY is written down
#   divergent: "<reason>"  copies only: present, content knowingly differs
#
# A missing key is a GUARD FAILURE, not a default. An `exempt` with an empty or
# absent reason is a guard failure. A repo present in the org but absent from this
# file is a guard failure, and vice versa. There is no way to make the guard
# quiet by leaving something out - only by writing down why.
#
# An exemption is a finding with a name on it, not permission. Several below say
# UNREMEDIATED in so many words: that is the audit trail backend#1415 asked for.
#
# MATCHING IS ON `uses:` CONTENT, NEVER ON FILENAME.
# Two filename conventions are mixed within nearly every repo, per-reusable:
# fr-gate, fr-pass-comment and code-quality use `<name>-caller.yml`
# everywhere; customer-priority-bump uses the reusable's own name everywhere;
# advance-deploy-env, set-pr-status and kanban-closure-router use `-caller.yml` in
# .github and the plain name in all 14-16 others; kanban-closure-router's callers
# (`kanban-closure-caller.yml` / `kanban-closure-routing.yml`) match NEITHER
# pattern. A filename audit cannot tell a caller from a local copy, so the guard
# parses each workflow as YAML and reads the resolved `uses:` values. Parsing also
# means a commented-out example line - code-quality.yml:60 - is not counted as a
# caller. Renaming is safe: required checks reference job IDs (`gate / gate`),
# never filenames.
#
# MEASURED, DEVELOP-FIRST, 2026-08-03: 110 caller references across 17 repos, all
# pinned @main. Twelve of the twenty repos default to main/master while work lands
# on develop, so a default-branch enumeration under-reports anything in flight.
# `audit_branch: develop-first-on-train` below is that correction, encoded -- and the
# `-on-train` half is the backend#2214 fix: develop-first is right for a repo the
# TRAIN promotes and wrong for one that ships from its default branch, which is how
# `rfcs` came to be audited on a `develop` nobody merges to.

schema_version: 2
org: tracebloc

# Every caller must pin this ref. Any other ref is drift.
pinned_ref: main

# Which branch the guard reads, per repo. `develop-first-on-train` = `develop` for a
# repo the TRAIN promotes (where that branch exists), and the repo's DEFAULT branch
# for one it does not. Anything else is rejected by the guard rather than silently
# treated as the default branch.
#
# The `release_train` flag on each repo below is the discriminator, so there is no
# second list to keep in step -- and `load_release_train` already verifies that flag
# against release-train/repos.yml, so the ref this guard reads is derived from a
# fact it independently checks.
audit_branch: develop-first-on-train

# The repo that hosts the reusables and the canonical copies. Its `copies` entries
# are checked for presence only - comparing its audit branch against the checkout
# would flag every PR that edits a copy.
#
# Note for whoever closes one of the UNREMEDIATED gaps below in .github itself: this
# file is read from the checkout, but .github's caller state is read from its audit
# branch over the API. Adding a caller and flipping its entry to `required` in the
# same PR therefore fails, because the caller is not on develop yet. Land the caller
# first, flip the entry after.
source_repo: .github

# Reusables: workflows in .github/workflows declaring `on: workflow_call`. A repo
# calls one when any workflow of any filename resolves to
#   uses: tracebloc/.github/.github/workflows/<name>@<pinned_ref>
reusables:
  - advance-deploy-env.yml
  - code-quality.yml
  - customer-priority-bump.yml
  - fr-gate.yml
  - fr-pass-comment.yml
  - kanban-closure-router.yml
  - set-pr-status.yml
  - wip-limit-check.yml
  - blocked-gate.yml
  - version-bump-gate.yml
  - stale-backlog.yml
  - bugbot-gate.yml

# Copies, not callers: these are duplicated into each repo, so the guard compares
# content (git blob sha against the checked-out source) instead of looking for a
# `uses:` reference. A copy that has silently drifted is the failure mode here.
copies:
  - add-to-kanban.yml

# QUALITY FILES (backend#1608 increment 5): files every repo must CARRY, asserted
# by presence at a fixed repo-relative path.
#
# NOT copies. A copy is compared byte for byte against the canonical original; both
# files below are per-repo BY DESIGN - backend's BUGBOT.md is about Django and
# Celery, cli's about Go - so there is nothing to compare and presence is the whole
# assertion. Presence, a regular file, and non-empty: a zero-byte CLAUDE.md would
# satisfy a bare existence check while carrying nothing, and so would a symlink.
#
# WHY THESE TWO ARE WORTH A FAMILY. Both are read by a TOOL rather than by a
# reviewer who would notice them missing. CLAUDE.md is what an AI session is
# instructed to follow; .cursor/BUGBOT.md is what Bugbot reads before reviewing a
# diff. A repo lacking either does not go red - it quietly gets worse review than
# its peers, and nothing in the org reports that today. Measured 2026-08-12,
# develop-first: CLAUDE.md 19/20, .cursor/BUGBOT.md 17/20.
#
# The org-standards block INSIDE CLAUDE.md is not asserted here: standards-sync.py
# owns it, and a second mechanism for one property is how the two drift apart.
#
# `.gitleaks.toml` is DELIBERATELY NOT MODELLED. It is 7/20 and that is correct -
# it is a per-repo allowlist you add when you hit a false positive, not a control.
# The control is `quality / gitleaks` being a REQUIRED status check, and
# protection_policy.required_checks below already asserts exactly that on all 16
# train repos (verified live 2026-08-12: 16/16 armed, 16/16 asserted). Modelling
# the file would add nine exemption rows for zero security value and make a tuning
# file read as a security gap - inert verification, the pattern backend#1729
# exists to catch.
quality_files:
  - CLAUDE.md
  - .cursor/BUGBOT.md

# BRANCH PROTECTION, BY BRANCH ROLE (backend#1608 increment 2).
#
# The three roles every repo is measured against. `prod` resolves per repo to
# whichever of main/master is IN THE BRANCH LIST -- never by probing
# `branches/master`, which follows rename redirects and returns 200 for a branch
# that does not exist (measured 2026-08-10: all 16 train repos reported a
# `master`; only 3 have one).
#
# Values are the decisions of record from backend#1276, so that the two ways a
# protection setting can be wrong -- someone changes it, or someone "fixes" a
# deliberate choice back to the default -- both become findings.
#
#   null  =  NOT ASSERTED, which is different from asserting false. `enforce_admins`
#            on develop/staging is null because #1276 deliberately leaves the cheap
#            escape hatch open there; a repo that chooses to harden its own develop
#            must not be reported as drift for doing something stricter.
#
# PROTECTION IS READ FROM BOTH OF GITHUB'S SYSTEMS. A ruleset-only branch 404s on
# `branches/{b}/protection` while `GET /branches` says `protected: true`; reading
# only the classic endpoint reports it as unprotected. That mistake produced a
# wrong finding on backend#1276 before it was caught. See the header comment on
# `read_protection()` in scripts/caller-drift.py for how the merge works and why
# it is per-property rather than per-system.
# CALLER INPUTS (backend#1977). Which inputs a REQUIRED caller must pass, and
# with what value.
#
# WHY THIS FAMILY EXISTS. Everything above proves a caller is PRESENT -- that the
# reusable runs. It says nothing about whether the check can FAIL, which is
# decided by the inputs the caller passes. That has been wrong twice, silently,
# on checks that were required:
#
#   .github#207     an OR-precedence bug made `action-pins-soft-fail: false` a
#                   NO-OP in four repos that believed it was armed.
#   backend#1681    `soft-fail` sat at its default of true on model-zoo,
#                   start-training and docs, so `quality / gitleaks` and
#                   `quality / house-rules` reported findings and exited 0 --
#                   required status checks, on PUBLIC repos, that could not fail.
#
# Both were found by a human reading YAML. Nothing detected either, and nothing
# would have detected the third.
#
# A FLOOR, NOT THE WHOLE SET: a caller may pass any number of other inputs. Only
# the ones that decide whether the check can fail are asserted here.
#
# A MISSING KEY IS A FINDING, NOT A PASS. `soft-fail` defaults to true, so a
# caller that simply omits it is in precisely the state this exists to catch --
# "absence means the permissive default" is the whole failure mode.
#
# Measured 2026-08-14, all 16 train repos: soft-fail=false and
# action-pins-soft-fail=false. This states the status quo so a regression is a
# finding, and it lands green rather than importing a backlog.
caller_inputs:
  code-quality.yml:
    soft-fail: false
    action-pins-soft-fail: false

protection_policy:
  develop:
    classic_protection: true
    min_reviews: 1
    # WHO MAY SKIP THE REVIEW (backend#1978). An EXACT allowlist, in the same
    # style as ruleset_policy.bypass_actors and for the same reason: min_reviews
    # asserts HOW MANY reviews are required and nothing asserted WHO may skip
    # them, so a second app or a user added tomorrow read identically to today.
    # Empty is the measured fleet state on develop (2026-08-15, all 16).
    bypass_reviews: []
    enforce_admins: null            # deliberate escape hatch (backend#1276 D1)
    block_force_pushes: true
    block_deletions: true
    require_conversation_resolution: true
    strict: false                   # backend#1276 D2 - the train solves stale bases better
    # The floor, not the whole set: repos add their own suites on top and that is
    # not drift. Measured 2026-08-11 - these three are required on develop in all
    # 16 train repos, so this states the status quo and catches a regression.
    # ruff/shellcheck are deliberately absent: they are language-scoped (9/16).
    required_checks:
      - quality / gitleaks
      - quality / house-rules
      - quality / action-pins
  staging:
    classic_protection: true
    min_reviews: 1
    # The release train merges promotion PRs via this app's review-bypass
    # (RFC-BACKEND-0008 D9/D14). It never bypasses `fr-gate`, which stays a
    # required check. EXACT: measured 2026-08-15 as the ONLY bypass actor on
    # every staging and prod branch in the fleet, so a second one is a finding.
    bypass_reviews: ['App:tracebloc-release-train']
    enforce_admins: null
    block_force_pushes: true
    block_deletions: true
    require_conversation_resolution: true
    strict: false
    # fr-gate is the promotion gate; gitleaks/house-rules are the content gates.
    # `quality / action-pins` JOINED THEM on 2026-08-16 (backend#1976). It was
    # required on 16/16 develops and 1/16 prods, and this file recorded that
    # asymmetry as "unexplained rather than decided". Decided now, and armed on
    # all 30 unarmed branches before this entry landed. The reason it is not
    # sufficient to gate only develop:
    #
    #   The promotion lane is covered - nothing reaches staging or prod through it
    #   without having been on develop, where the check is required. The HOTFIX
    #   lane is not: it merges straight to a prod branch, skipping develop
    #   entirely. `hotfix-repo.sh` does refuse a hotfix whose non-`gate / gate`
    #   checks are not green, but that is a property of a SCRIPT, and nothing
    #   compels anyone to use it -- a hotfix PR with a red action-pins could be
    #   merged from the UI by any writer with one approval, because the context
    #   was not required on the branch. Under time pressure, during an incident,
    #   is exactly when the merge button gets used instead of the script.
    #
    # Armed while green: `quality / action-pins` already reported SUCCESS on
    # promotion PRs to staging and main across the fleet before arming (.github#276,
    # backend#2054, cli#514), so no branch gained a context that had never reported.
    required_checks:
      - gate / gate
      - quality / gitleaks
      - quality / house-rules
      - quality / action-pins
  prod:
    classic_protection: true
    min_reviews: 1
    # The release train merges promotion PRs via this app's review-bypass
    # (RFC-BACKEND-0008 D9/D14). It never bypasses `fr-gate`, which stays a
    # required check. EXACT: measured 2026-08-15 as the ONLY bypass actor on
    # every staging and prod branch in the fleet, so a second one is a finding.
    bypass_reviews: ['App:tracebloc-release-train']
    enforce_admins: true            # backend#1276 D1 - closed on every train prod branch
    block_force_pushes: true
    block_deletions: true
    require_conversation_resolution: true
    strict: false
    # fr-gate is the promotion gate; gitleaks/house-rules are the content gates.
    # `quality / action-pins` joined them on 2026-08-16 (backend#1976) - see the
    # staging entry above for the decision and the hotfix-lane reasoning behind it.
    # This is the branch role that reasoning is actually about: prod is where the
    # hotfix lane lands.
    required_checks:
      - gate / gate
      - quality / gitleaks
      - quality / house-rules
      - quality / action-pins

# The ruleset contract (backend#1681). GitHub's second protection system, which
# nothing audited until now - so the merge-method restriction on every promotion
# branch and the v* tag trust root were both enforced by artifacts no check read.
#
# Matched on TARGET + RULES, never on name: client's tag ruleset is named
# "R8 trust root - protect v* release tags" while its five peers use
# "Protect v* release tags (supply-chain trust root)", so a name-keyed check
# reports client as missing its trust root.
ruleset_policy:
  promotion_merge_commit_only:
    target: branch
    require_rule_types: [pull_request]
    # NOT expressible in classic protection at all. This is the whole reason the
    # ruleset layer matters: it is what stops a promotion PR being squash-merged,
    # which would collapse the merge-commit ancestry promote-repo.sh's squash
    # guard reads and jam the NEXT prepare.
    allowed_merge_methods: [merge]
    must_cover_roles: [staging, prod]
    # EXACT allowlist, not a floor. Empty is the measured fleet state
    # (2026-08-11, all 16); any actor appearing here later is the finding.
    bypass_actors: []
  tag_trust_root:
    target: tag
    require_rule_types: [creation, update, deletion]
    include_refs: ['refs/tags/v*']
    # backend#1681 removed `release-python` (Team:18689454) from three of these:
    # four engineers held `always` bypass on backend, data-ingestors and
    # tracebloc-py-package, two of which publish ON the tag (PyPI, GHCR) - an
    # undocumented publish path that contradicted PUBLISH-PATHS.md and the
    # operator instruction in token-check.yml. Team:18304481 is release-managers.
    bypass_actors:
      - OrganizationAdmin
      - Team:18304481

# Reasons cited by more than one repo, as YAML anchors: one edit updates every
# citation. An alias is still a written reason - the guard resolves it and
# rejects an empty one exactly as it would an inline string. This block holds
# no policy; deleting an entry that is still aliased is a YAML error.
shared_reasons:
  version_gate_not_applicable: &version_gate_not_applicable >-
    This repo has no version_file in release-train/repos.yml, so it publishes
    no tag-versioned artifact through the train and the version-bump gate does
    not apply. The five version-published repos declare it required.

  wip_limit_check_has_no_callers: &wip_limit_check_has_no_callers >-
    wip-limit-check has ZERO callers anywhere in the org (measured 2026-08-03, all 20 active
    repos, develop-first). Its own header says to delete the reusable once nothing references
    it. Requiring it in any repo would land this guard red on day one; the decision to wire it
    up or delete it is backend#1415 follow-up work. Exempt everywhere, deliberately and in
    writing.
  blocked_gate_rollout_pending: &blocked_gate_rollout_pending >-
    blocked-gate has ZERO callers so far, deliberately and for exactly one PR. The
    reusable and its selftest land first so the MATCHING can be reviewed on its own -
    that is the whole risk surface; the rest of the gate is four lines of YAML. The
    callers follow in the rollout PR (backend#1729).
    The two-step is forced by this file's own header: .github's caller state is read
    from its audit branch over the API, so adding a caller and flipping its entry to
    `required` in one PR fails on a caller that is not on the audit branch yet.
    STAGED, NOT PARKED. If this anchor is still here once the rollout PR has merged,
    it has become the same finding as wip_limit_check_has_no_callers: a reusable that
    shipped, was never wired up, and had a written excuse for it. Treat it as a defect
    then, not a justification. That comparison used to name version_bump_pr_never_wired
    too; version-bump-pr.yml was DELETED under backend#1563 rather than wired, which is
    the other way this ends and the better one when nothing is calling it.
    Arming is a briefing decision rather than a silent flip because two live PRs go red
    the moment it is on - client#490 ("HOLD until v0.8.0 image") and client-runtime#192
    ("DO NOT MERGE") - which is the gate working as intended (backend#1752,
    data-ingestors#468).

  bugbot_gate_rollout_pending: &bugbot_gate_rollout_pending >-
    bugbot-gate has ZERO callers anywhere in the org (measured 2026-08-23, immediately after
    .github#305 landed the reusable). The reusable, its selftest and its mutation suite land
    first so the DERIVATION can be reviewed on its own - deriving the verdict from Bugbot's
    FINDINGS rather than trusting a status we do not control is the whole risk surface
    (backend#2284). The callers follow in the rollout PR.
    Same two-step blocked-gate was forced into, for the reason this file's header states:
    .github's caller state is read from its audit branch over the API, so adding a caller and
    flipping its entry to `required` in one PR fails on a caller not yet on the audit branch.
    STAGED, NOT PARKED. If this anchor is still here once the rollout PR has merged, it has
    become the same finding as wip_limit_check_has_no_callers: a reusable that shipped, was
    never wired up, and had a written excuse for it. Treat it as a defect then, not a
    justification.
    Recorded because the omission was not free: with bugbot-gate.yml present as a reusable and
    absent from this list, the org audit on develop went red at 2026-08-23T12:06Z with exit 2
    and "Refusing to report on caller drift from an incomplete read" - failing closed before it
    evaluated ANY per-repo state, including the stale-sweep flip that had merged 26 seconds
    earlier. A reusable checked against no repo is reported by nothing, and the harness treats
    that as a finding rather than a silence. It was right to.

  no_staging_branch_no_hop_to_gate: &no_staging_branch_no_hop_to_gate >-
    fr-gate gates the staging -> prod hop. This repo has no `staging` branch, so there is no hop
    for it to gate. Structural, not a gap.
  code_quality_caller_missing: &code_quality_caller_missing >-
    no code-quality caller. One of the nine missing callers named in backend#1415 and confirmed
    by measurement. UNREMEDIATED - this exemption is the finding, not a justification.
    Down to THREE citations (claude-skills, release-train, rfcs): model-zoo and start-training
    were remediated 2026-08-04 under backend#1420 (model-zoo#115, start-training#32), and docs
    the same day (docs code-quality-caller.yml), so all three are now `required`. Their
    exemptions going stale is what the drift guard caught -- adding a caller without flipping
    its entry is the same two-file coupling as repos.yml vs release_train.
    The previous revision of this text also said THREE and named claude-skills, docs and
    release-train while FOUR entries pointed at the anchor: `rfcs` was added later in the same
    session and never listed. A hand-maintained citation list drifts from its own aliases, so
    trust `grep -n '\*code_quality_caller_missing'` over this sentence.
  customer_priority_bump_caller_missing: &customer_priority_bump_caller_missing >-
    no customer-priority-bump caller. Measured absent 2026-08-03. The reusable also has three
    dead inputs and hard-codes the `priority` label (backend#1408 P3), so wiring more repos to
    it is sequenced behind that cleanup. UNREMEDIATED.
  fr_pass_comment_caller_missing: &fr_pass_comment_caller_missing >-
    no fr-pass-comment caller, so a kanban card in this repo can only be advanced by hand.
    ONE citation, claude-skills. Re-measured on it 2026-08-21 --
    `gh api repos/tracebloc/claude-skills/contents/.github/workflows` lists no fr-pass-comment
    caller -- so the claim still holds everywhere it is still made. UNREMEDIATED.
    The previous revision read "Measured absent 2026-08-03 (5 repos, not the 7 backend#1415
    claims)", which read as this anchor's reach but was the ORG-WIDE sweep's count: 5 is what
    that sweep found absent across the org, while the anchor has only ever been aliased TWICE,
    and backend#2243 flipped release-train to `required` (.github#298) leaving one. Same lesson
    as `code_quality_caller_missing` above -- an anchor cannot state its own reach -- so trust
    `grep -n '\*fr_pass_comment_caller_missing'` over this sentence.
  kanban_closure_router_caller_missing: &kanban_closure_router_caller_missing >-
    no kanban-closure-router caller, so closing an issue here files nothing. UNREMEDIATED.
  docs_no_required_review: &docs_no_required_review >-
    docs is exempt from required review on `staging` and `main` (Lukas, 2026-06-04): docs are
    content-only and low-risk, exempt from both the develop-only rule and the FR-gate. Every OTHER
    protection assertion still applies here - this divergence names `min_reviews` and
    `bypass_reviews` and nothing else, so a regression in force-push, deletion or admin posture is
    still caught. `bypass_reviews` is EMPTY here for the reason `min_reviews` is 0: with no
    required review there is nothing to bypass, so granting the train an allowance would assert a
    permission that cannot be exercised. Measured `required_pull_request_reviews: null` on both
    branches, 2026-08-15. `docs/staging` got its classic-protection layer on 2026-08-10
    (backend#1276), mirroring `docs/main` rather than the fleet shape, which is why one reason
    covers both branches.
  not_a_pipeline_prod_branch: &not_a_pipeline_prod_branch >-
    not on the release train, so this `main` is a WORKING branch, not a pipeline prod branch, and
    backend#1276's `enforce_admins: true` decision does not reach it. Deliberate for release-train
    specifically: it is the tool used to REPAIR the pipeline, so locking it hardest is
    self-defeating. Measured false on claude-skills, release-train and rfcs, 2026-08-10.
    The same "no pipeline here" fact governs `bypass_reviews`: the fleet `prod` policy grants
    `App:tracebloc-release-train` a review bypass because the train merges promotion PRs on that
    branch. It promotes nothing into these three, so it holds no allowance and the policy's
    entry cannot apply. Each repo states its own `bypass_reviews` beside `enforce_admins` rather
    than inheriting - an EXACT allowlist inherited from a role whose premise is false is how a
    bypass gets granted by accident. Measured 2026-08-15.
  stale_backlog_exemption_needs_redeciding: &stale_backlog_exemption_needs_redeciding >-
    EXEMPT, BUT THE ORIGINAL REASON NO LONGER HOLDS, and that is the point of this note.
    It read: "stale-backlog.yml is column-blind and would close live pipeline work (backend#1408
    P3)." backend#1979 removed the column-blindness -- eligibility is now exactly `Backlog` -- so
    the stated basis is gone. The exemption is RETAINED rather than dropped because enrolling the
    repo that drives promotions into an unattended closing sweep is a decision somebody should
    take deliberately, not a side effect of fixing an unrelated bug. UNDECIDED, recorded as such:
    either enroll it or state a basis that is still true, but do not leave this citing a defect
    that has been fixed.
  stale_backlog_not_a_backlog: &stale_backlog_not_a_backlog >-
    this repo holds decision documents, not a backlog. An RFC that has sat untouched is not stale
    in the sense the sweep measures -- it is a decision nobody has taken, which is what the board
    card is for (.github#138). Unaffected by backend#1979: the reason was never about which
    columns the sweep could see.
  no_develop_branch_single_branch_repo: &no_develop_branch_single_branch_repo >-
    single-branch repo: `main` is the only integration branch, so there is no `develop` to protect.
    Structural, not a gap. Precise staleness rule, because an earlier draft of this note overstated
    it (Bugbot, .github#196): the guard flags an exemption when the role's branch appears AND
    carries protection. A `develop` created and left UNPROTECTED is not flagged - the checker
    cannot distinguish that from `develop_unprotected_non_train` below, which is an exemption
    written precisely about an existing unprotected branch. The case this reason is about is still
    covered: enrolling in the train means a protected `develop`, which does trip the check.
  no_staging_branch_not_on_train: &no_staging_branch_not_on_train >-
    not on the release train, so there is no develop -> staging -> prod lane and no `staging`
    branch to hold to a policy. Distinct from `no_staging_branch_no_hop_to_gate`, which is about
    the fr-gate caller rather than protection.
  develop_unprotected_non_train: &develop_unprotected_non_train >-
    `develop` exists but carries no branch protection, and the repo is not on the train so nothing
    promotes out of it. UNREMEDIATED - recorded as an exemption with a name on it rather than
    quietly dropped, per this file's schema decision. Protecting it is cheap; the reason it has not
    happened is that nothing depends on it.
repos:
  .github:
    visibility: public
    release_train: true
    protection:
      # WIDER than the fleet baseline on develop and staging: `selftests` is
      # armed on top of it, and stating it is the point (backend#1680).
      #
      # selftests.yml was added to be a required check -- its own header says so
      # and cites the org rule it turns on itself: a guard in a non-required job
      # is advice, not a gate (backend#1729). Nothing made it required, so the
      # eight suites guarding the reusables every other repo's CI depends on
      # could go red and block no merge. The workflow said "required" and the
      # protection said nothing, which is the gap this cell closes: a later
      # removal is now drift rather than silence.
      develop:
        divergent:
          reason: >-
            Requires MORE than the fleet baseline: the `selftests` job is armed
            here on top of the develop baseline, so a red selftest blocks the
            merge (backend#1680). MORE, never fewer - an override REPLACES the
            baseline list rather than extending it, so every baseline context is
            restated here deliberately. See the staging cell below for the defect
            that rule exists to prevent.
          required_checks:
            - quality / gitleaks
            - quality / house-rules
            - quality / action-pins
            - selftests
      staging:
        divergent:
          reason: >-
            Requires MORE than the fleet baseline: the `selftests` job is armed
            here on top of the staging baseline, so a red selftest blocks the
            develop -> staging hop (backend#1680). MORE, never fewer - an
            override REPLACES the baseline list (`want.update(overrides)` in
            evaluate_protection), so every baseline context has to be restated
            here or it stops being asserted on this branch. That is how
            `quality / action-pins` went missing when the staging baseline was
            raised in backend#1976 (Bugbot, #277): the fleet gained a context and
            this cell silently kept asserting the old set.
          required_checks:
            - gate / gate
            - quality / gitleaks
            - quality / house-rules
            - quality / action-pins
            - selftests
      # NOT YET on prod, deliberately, and this is a sequencing fact rather than
      # a decision against it. `selftests.yml` reaches `staging` only when the
      # promotion carrying it merges; until then a staging -> main PR's head
      # cannot report the context, and a required check that never reports
      # leaves the PR waiting forever (client#665, `pii-gate/pii-check`). Arm it
      # here once staging carries the workflow -- backend#1680 carries the step.
      prod: required
    rulesets:
      promotion_merge_commit_only: required
      tag_trust_root:
        exempt: "Publishes nothing from a `v*` tag - no tag-triggered workflow and no v* tags cut (measured 2026-08-11)."
    callers:
      version-bump-gate.yml:
        exempt: *version_gate_not_applicable
      advance-deploy-env.yml: required   # advance-deploy-env-caller.yml
      # Remediated 2026-08-06 (.github#171, backend#1603). The repo that HOSTS
      # code-quality.yml was the only repo not running it, so the action-pins job
      # it publishes to 19 others did not apply here - and that is how .github#168
      # reverted actions/checkout from a pinned SHA to the mutable @v4 tag with
      # nothing in CI to object. Armed soft-fail:false against a measured-clean
      # tree; ruff, gitleaks, shellcheck and house-rules were all green on the
      # first run.
      #
      # action-pins was armed here on 2026-08-06 (backend#1603 step 2) once #159
      # reached main: this repo's own caller passes `action-pins: true` +
      # `action-pins-soft-fail: false`, and `quality / action-pins` is a REQUIRED
      # check on develop. The line that used to sit here said it "stays unarmed
      # until #159 reaches main" and was never updated when that happened, so the
      # contract denied a control it actually has (backend#1668).
      #
      # The original caveat still holds and is worth keeping: a caller may only
      # pass inputs the @main callee declares, or the whole call dies with
      # startup_failure. That is why arming had to wait for the callee to land.
      code-quality.yml: required   # code-quality-caller.yml
      customer-priority-bump.yml:
        exempt: *customer_priority_bump_caller_missing
      fr-gate.yml: required   # fr-gate-caller.yml
