name: Route kanban Status on closure

# Reusable workflow. Called on PR closed + issue closed events.
# Sets the correct Status based on what actually happened:
#   - PR merged to develop           → FR on dev      (functional review on dev environment)
#   - PR merged to staging           → FR on staging  (functional review on staging environment)
#   - PR merged to main/master       → Prod           (shipped to prod)
#   - PR closed without merging      → Cancelled
#   - Issue closed as completed:
#       · by a PR (any base)         → mirror the PR's resulting Status
#       · manually (no closing PR)   → no change (see the note in the step below)
#   - Issue closed as not_planned    → Cancelled
#   - Issue closed (no state_reason) → Cancelled (default to abandoned)
#
# NOTE: For PR merges, advance-deploy-env.yml also fires on the resulting branch
# push and sets the same Status. Both workflows are idempotent and converge on
# the same value; this one fires faster (PR close event) and serves as the
# primary signal, while advance-deploy-env covers the case of pushes that
# weren't a PR merge (e.g. fast-forward of develop → staging).

on:
  workflow_call:
    inputs:
      project-number:
        type: number
        default: 2
      org:
        type: string
        default: tracebloc

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target Status
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ISSUE_REASON: ${{ github.event.issue.state_reason }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # ORG + REPO_FULL needed by the "issue closed as completed" branch when
          # it does the closing-PR-base lookup. Without these, `set -u` aborted
          # the script before any status= output was written, leaving the
          # built-in "Item closed" project workflow to set Status=Cancelled.
          ORG: ${{ inputs.org }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail

          # STATUS="" means "make no change": the update step below is guarded on
          # a non-empty status and skips entirely. Every branch here either sets
          # a real column or deliberately leaves STATUS empty.
          STATUS=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_MERGED" = "true" ]; then
              case "$BASE_REF" in
                main|master) STATUS="Prod" ;;
                staging)     STATUS="FR on staging" ;;
                develop)     STATUS="FR on dev" ;;
                *)           STATUS="FR on dev" ;;
              esac
            else
              STATUS="Cancelled"
            fi
          elif [ "$EVENT_NAME" = "issues" ]; then
            if [ "$ISSUE_REASON" = "completed" ]; then
              # If a linked PR closed this issue, mirror that PR's resulting Status.
              REPO_NAME="${REPO_FULL#*/}"
              # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
              CLOSING_PR_BASE=$(gh api graphql -f query='
                query($org: String!, $repo: String!, $num: Int!) {
                  repository(owner: $org, name: $repo) {
                    issue(number: $num) {
                      closedByPullRequestsReferences(first: 5) { nodes { baseRefName } }
                    }
                  }
                }' -F org="$ORG" -F repo="$REPO_NAME" -F num="$ISSUE_NUMBER" \
                --jq '.data.repository.issue.closedByPullRequestsReferences.nodes[0].baseRefName // ""' 2>/dev/null) || CLOSING_PR_BASE=""

              if [ -z "$CLOSING_PR_BASE" ]; then
                # Closed by hand, with no PR to mirror.
                #
                # THERE IS DELIBERATELY NO DEFAULT HERE — do not add one.
                # Ticking an issue off by hand says nothing about where its code
                # is deployed, so this workflow must not invent a deploy state.
                # Leave Status where it is; the develop → staging → prod
                # automation (advance-deploy-env.yml) moves the card when the
                # code actually ships, and kanban-reconcile.yml catches drift.
                #
                # This branch used to default to "Prod". That silently parked
                # unreviewed work in the Prod column, which SATISFIES the
                # required fr-gate.yml check — the gate whose whole job is to
                # hold a promotion PR until every contained item has passed
                # functional review. A wrong default here defeats that gate.
                #
                # "No change" is only truly no change while the project's
                # built-in "Item closed" workflow stays disabled (verified
                # disabled on project #2). If it is ever re-enabled it will set
                # its own column here and this branch will need revisiting.
                echo "Issue #$ISSUE_NUMBER closed as completed with no closing PR — leaving Status unchanged."
              else
                case "$CLOSING_PR_BASE" in
                  main|master) STATUS="Prod" ;;
                  staging)     STATUS="FR on staging" ;;
                  develop)     STATUS="FR on dev" ;;
                  # Unrecognised base: mirror what the pull_request branch above
                  # does for the same base, so the issue and its PR agree.
                  *)           STATUS="FR on dev" ;;
                esac
              fi
            else
              # not_planned, or closed with no state_reason at all → abandoned.
              STATUS="Cancelled"
            fi
          else
            echo "Unexpected event '$EVENT_NAME' — skipping"
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Routing decision: status=${STATUS:-(unchanged)}"

      - name: Update Status on the kanban
        if: steps.target.outputs.status != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_KANBAN_TOKEN }}
          ORG: ${{ inputs.org }}
          PROJECT_NUMBER: ${{ inputs.project-number }}
          STATUS_NAME: ${{ steps.target.outputs.status }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO_NAME="${REPO_FULL#*/}"

          # Look up project ID + Status field/option IDs
          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          PROJ=$(gh api graphql -f query='
            query($org: String!, $num: Int!) {
              organization(login: $org) {
                projectV2(number: $num) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2SingleSelectField { id name options { id name } }
                    }
                  }
                }
              }
            }' -F org="$ORG" -F num="$PROJECT_NUMBER")

          PROJECT_ID=$(echo "$PROJ" | jq -r '.data.organization.projectV2.id')
          STATUS_FIELD=$(echo "$PROJ" | jq -r '.data.organization.projectV2.fields.nodes[]
            | select(.name=="Status") | .id')
          STATUS_OPT=$(echo "$PROJ" | jq -r --arg s "$STATUS_NAME" '.data.organization.projectV2.fields.nodes[]
            | select(.name=="Status") | .options[] | select(.name==$s) | .id')

          if [ -z "$STATUS_OPT" ] || [ "$STATUS_OPT" = "null" ]; then
            echo "Could not resolve Status option '$STATUS_NAME' — aborting"
            exit 1
          fi

          # Find item ID for this PR or issue
          if [ "$IS_PR" = "true" ]; then
            # shellcheck disable=SC2016  # $num is a GraphQL variable - must not expand in shell
            FIELD_QUERY='pullRequest(number: $num) { projectItems(first: 10) { nodes { id project { number } } } }'
          else
            # shellcheck disable=SC2016  # $num is a GraphQL variable - must not expand in shell
            FIELD_QUERY='issue(number: $num) { projectItems(first: 10) { nodes { id project { number } } } }'
          fi

          # Retry briefly to let auto-add fire if needed
          for i in 1 2 3 4 5; do
            RESP=$(gh api graphql -f query="
              query(\$org: String!, \$repo: String!, \$num: Int!) {
                repository(owner: \$org, name: \$repo) {
                  $FIELD_QUERY
                }
              }" -F org="$ORG" -F repo="$REPO_NAME" -F num="$NUMBER" 2>/dev/null) || RESP='{}'

            ITEM_ID=$(echo "$RESP" | jq -r --arg n "$PROJECT_NUMBER" '
              ([.. | objects | select(has("projectItems"))] | first).projectItems.nodes[]?
              | select(.project.number == ($n | tonumber)) | .id' | head -1)
            if [ -n "$ITEM_ID" ] && [ "$ITEM_ID" != "null" ]; then break; fi
            echo "Item not yet on project, retry $i/5..."
            sleep 5
          done

          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
            echo "Item #$NUMBER not on project after 5 retries — skipping."
            exit 0
          fi

          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          gh api graphql -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $p, itemId: $i, fieldId: $f,
                value: {singleSelectOptionId: $o}
              }) { projectV2Item { id } }
            }' -f p="$PROJECT_ID" -f i="$ITEM_ID" -f f="$STATUS_FIELD" -f o="$STATUS_OPT" > /dev/null

          echo "→ #$NUMBER → Status=$STATUS_NAME"
