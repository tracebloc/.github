name: Route kanban Status on closure

# Reusable workflow. Called on PR closed + issue closed events.
# Sets the correct Status based on what actually happened:
#   - PR merged to develop           → On dev         (automatic; no dev-side review — D6)
#   - PR merged to staging           → FR on staging  (functional review on staging environment)
#   - PR merged to main/master       → Prod           (shipped to prod)
#   - PR closed without merging      → Cancelled
#   - Issue closed as completed  → Done (terminal; how it was closed is irrelevant)
#       (was: mirror the closing PR's Status, which put finished issues in deploy
#        columns — see the branch below and backend#2722)
#   - Issue closed as not_planned    → Cancelled
#   - Issue closed (no state_reason) → Cancelled (default to abandoned)
#
# NOTE: For PR merges, advance-deploy-env.yml also fires on the resulting branch
# push and sets the same Status. Both workflows are idempotent and converge on
# the same value; this one fires faster (PR close event) and serves as the
# primary signal, while advance-deploy-env covers the case of pushes that
# weren't a PR merge (e.g. fast-forward of develop → staging).

on:
  workflow_call:
    inputs:
      project-number:
        type: number
        default: 2
      org:
        type: string
        default: tracebloc

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      # The mapping comes from .github, not from a copy in this file: one
      # definition of branch -> Status (backend#2243).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/.github
          ref: main
          path: .kanban-map
          persist-credentials: false

      # Authenticates as the tracebloc-release-train App (backend#2036) instead of
      # one human's PAT. Needs both grants: `organization_projects: write` for the
      # card, `issues: write` for the sibling-merge label and the closure comment.
      # `owner:` makes the token ORG-scoped -- a repo-scoped one cannot reach an org
      # ProjectV2, and the closer lookup below is cross-repo besides.
      #
      # No fallback to the old PAT: a fallback would let a broken App path look like
      # a working migration, which is the defect class backend#1680 exists to remove.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # LEAST PRIVILEGE, DERIVED FROM THIS JOB'S OWN CALLS (backend#2157).
          # Four steps share this token; this is the union of what they call:
          #
          #   organization().projectV2 fields/options             projects read
          #   repository.pullRequest|issue(n).projectItems        PRs+issues read
          #   updateProjectV2ItemFieldValue                       projects WRITE
          #   gh issue comment (the D8 parked-card note)          Issues  WRITE
          #   GET repos/{r}/labels/{name} (does it exist?)        Issues  read
          #   POST repos/{r}/labels (create it)                   Issues  WRITE
          #   POST repos/{r}/issues/{n}/labels                    Issues  write
          #
          # The last one lands on a PULL REQUEST in the sibling-merge case, and it
          # still only needs `issues: write`: GitHub documents the label endpoints
          # as "at least one of" Issues write / Pull requests write, and every
          # shared action on a PR -- labels, assignees, milestones -- is served by
          # the Issues endpoints. So `pull-requests` stays at READ, which is all the
          # `projectItems` lookup on a PR needs.
          #
          # `contents: READ` IS REQUIRED, and the previous revision of this comment
          # got it wrong in a way worth recording. It proved contents:WRITE could
          # drop and then concluded nothing reads content either -- in the same
          # sentence that names the read. `branch_status_map.py` fetches the
          # `.kanban.yml` override over the API (`FETCHED, NOT READ OFF DISK,
          # because the router never checks the repo out`) and is passed
          # `$REPO_FULL` -- the CALLER's repo, not this one -- with
          # `GH_TOKEN: steps.app-token.outputs.token`. `persist-credentials: false`
          # applies to the `.github` checkout, which is not the repo being read.
          #
          # AND IT WOULD NOT HAVE FAILED LOUDLY. The mapper's own contract treats
          # 404 as "no override" but REFUSES on any other fetch failure, and the
          # call sites below wrap it in `if ! STATUS=$(...)` which falls to the
          # holding state by design. So a 403 parks EVERY merged PR at
          # `override-unusable` with a green job -- silent mis-routing fleet-wide.
          # Found by Bugbot and confirmed by saadqbal on .github#324.
          #
          # contents:write still drops, as do administration/actions/checks read.
          #
          # `repositories:` STAYS UNNARROWED -- the cross-repo callers are the
          # projectItems reads and the issue comment/label writes listed above (a
          # client or website PR routinely closes a `backend` issue), and
          # `organization-projects` is an org-level grant regardless. The closer
          # lookup used to be cited here too; it was removed with the routing change
          # (backend#2722) and is no longer a reason for anything.
          #
          # NOT PROVEN BY READING. An under-scoped token fails at the call site, and
          # this workflow's failure mode is a card the built-in "Item closed"
          # automation then sets to `Cancelled` (.github#157). The next closed PR or
          # issue in any repo is the real test; read the failing call before
          # widening this list.
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read
          permission-organization-projects: write

      - name: Determine target Status
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ISSUE_REASON: ${{ github.event.issue.state_reason }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # ORG + REPO_FULL are read by the project lookups, the .kanban.yml
          # override mapper and the D8 parked-card comment. Keep them exported:
          # without them `set -u` aborts the script before any status= output is
          # written, leaving the built-in "Item closed" project workflow to set
          # Status=Cancelled. (They were originally added for the closing-PR-base
          # lookup, which backend#2722 removed; the other consumers remain.)
          ORG: ${{ inputs.org }}
          REPO_FULL: ${{ github.repository }}
          # The PAT rather than the caller's GITHUB_TOKEN: this step's project reads
          # and the override mapper are cross-repo. (This comment used to explain a
          # closer lookup that ran tokenless and therefore never worked -- .github#126.
          # backend#2722 removed the lookup entirely, so that history now describes no
          # code and is dropped rather than left to mislead.)
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # STATUS="" means "make no change": the update step below is guarded on
          # a non-empty status and skips entirely. Every branch here either sets
          # a real column or deliberately leaves STATUS empty.
          STATUS=""

          SIBLING="false"
          # SET WHEN THE OVERRIDE COULD NOT BE USED (saadqbal on .github#295). Drives
          # the same visibility mechanism as SIBLING: a card the weekly pass must
          # disposition, marked so a human can see why.
          #
          # UNUSABLE, NOT UNREADABLE (backend#2324). Two causes reach this holding
          # state now -- a `.kanban.yml` that cannot be fetched or parsed, and one
          # that reads fine but names a Status the mapping does not declare -- and
          # the second sends an operator hunting a read failure that never happened.
          # The mapper says which on stderr; this flag only says "we could not tell".
          UNUSABLE_OVERRIDE="false"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_MERGED" = "true" ]; then
              # ONE SHARED MAPPING (backend#2243) -- and this site is why the fix
              # is a shared script rather than a second `yq` read: this workflow
              # never checks the caller out, so the per-repo `.kanban.yml` override
              # it was silently ignoring has to be FETCHED, not read off disk.
              # A REFUSED OVERRIDE MUST NOT COST THE WRITE (Bugbot, .github#295).
              # `read_override` refuses on an unreadable `.kanban.yml`, and a bare
              # command substitution under `set -euo pipefail` then exits this step
              # before any Status is published -- so the update step's non-empty
              # guard skips and the project's built-in "Item closed" automation sets
              # `Cancelled`, archiving shipped-via-parent work (.github#157). That is
              # the no-write path this file already documents, reached by a new
              # door -- and the door opens on any repo whose override cannot be
              # read, which is not a hypothetical population.
              #
              # `resolve` REFUSES HERE TOO NOW (backend#2324), on an override naming
              # a Status the mapping does not declare. That case used to succeed and hand
              # this arm a name the update step below cannot resolve to an option id
              # -- so it aborted mid-write and reached the same "Item closed" branch
              # anyway, having skipped the holding state entirely. One exit code, one
              # policy: whatever the mapper could not answer, the card gets parked.
              #
              # STDERR IS KEPT. It was discarded, which cost nothing while the only
              # refusal was "could not fetch" -- the flag said that much. The
              # unknown-Status refusal names the branch, the bad value and the
              # accepted vocabulary, and that message IS the fix for the operator.
              if ! STATUS=$(python3 .kanban-map/scripts/branch_status_map.py \
                              "$BASE_REF" "$REPO_FULL" "$BASE_REF" \
                              | jq -r '.status'); then
                # THE HOLDING STATE, NOT THE DEFAULT MAPPING (saadqbal on
                # .github#295, correcting my own first fix). Writing the default
                # would be "silently apply the mapping we could not confirm" -- it
                # claims a promotion happened on a read that failed. The holding
                # state claims nothing: it is an explicit WE COULD NOT TELL, exactly
                # what the sibling arm below writes for its own reason.
                #
                # And it must be a WRITE rather than an exit, because the built-in
                # "Item closed" automation acts on the close INDEPENDENTLY of this
                # workflow. A loud red run does not protect the card; the automation
                # still wins the race and sets `Cancelled`. So "refuse rather than
                # guess" has to be expressed AS A WRITE here -- refusing by doing
                # nothing delegates the decision to something that decides wrongly.
                echo "::warning::the .kanban.yml override for $REPO_FULL could not be used (see the error above: unreadable, or it names a Status the mapping does not declare), so the Status for $BASE_REF is UNKNOWN. Writing the non-terminal holding state and labelling the card for the weekly pass -- publishing nothing would let the built-in Item-closed automation set Cancelled (.github#157)."
                STATUS="On dev"
                UNUSABLE_OVERRIDE="true"
              fi
              # KEYED ON WHETHER THE MAPPER ANSWERED, not on a list of branch names
              # (Bugbot, .github#295). A `case` over the four stock branches
              # overwrote ANY other result with the floor below -- so a
              # `.kanban.yml` key for, say, `release/*` was computed and then
              # discarded on the same run, including the `rfcs` override this
              # change exists to unblock. The last branch-name list in this
              # workflow is gone with it.
              if [ -z "$STATUS" ]; then
                  # A PR merged into a SIBLING feature branch deploys nothing by
                  # itself — its content travels onward inside the parent PR
                  # (this fallthrough silently stranded 6 such cards;
                  # backend#1437 mechanism 1). The sibling-merge label below
                  # makes the condition VISIBLE for the weekly board pass. The
                  # Status write is deliberately KEPT: skipping it lets the
                  # project's built-in "Item closed" automation set closed items
                  # to Cancelled, archiving shipped-via-parent work as abandoned
                  # (Bugbot, .github#157). On dev + label is the non-terminal
                  # holding state the weekly pass dispositions.
                  STATUS="On dev"
                  SIBLING="true"
              fi
            else
              STATUS="Cancelled"
            fi
          elif [ "$EVENT_NAME" = "issues" ]; then
            if [ "$ISSUE_REASON" = "completed" ]; then
              # A COMPLETED ISSUE IS TERMINAL. It goes to Done, and nothing about how it
              # was closed changes that (backend#2722).
              #
              # This used to mirror the closing PR's Status, so a PR-closed issue landed
              # in `On dev` / `FR on staging` / `Prod`. That contradicted the board model
              # -- deploy state is a property of a PR; an issue is either finished or it
              # is not (RFC-BACKEND-1405 D8) -- and it cost real accuracy: on 2026-08-27
              # one session cleared 117 closed issues out of deploy columns by hand
              # (18 + 55 from `FR on staging`, 44 from `On dev`). Two of those passes
              # were functional-review batches, so the next prod payload would have read
              # 73 items larger than the work it actually contained.
              #
              # WHY THIS RETIRES backend#1600 RATHER THAN FIGHTING IT. #1600 found that
              # issues parked here by the old mirroring NEVER advanced when the code
              # shipped, and drifted permanently (2026-08-06: all 20 drifted cards were
              # closed issues, 0 PRs). It fixed the stranding by teaching
              # advance-deploy-env to march them onward. It was right that a closed issue
              # must not be stranded, and wrong about where to put it: `Done` is terminal,
              # so there is nothing left to drift, and kanban-archive sweeps it off the
              # board daily instead of it being carried by every hop. The matching
              # closing-issue block in advance-deploy-env.yml is removed in the same
              # change -- left in place it drags these cards straight back into the deploy
              # columns, and a half-fix here would look fixed while doing nothing.
              #
              # THE CLOSER LOOKUP GOES WITH IT, which is a second win rather than
              # collateral. It existed only to tell a hand-close from a PR-close so the
              # two could route differently; with one destination there is nothing to
              # tell apart. It was also the source of two fail-wrong defects -- a
              # transient GraphQL error reading as a hand-close (.github#126), and five
              # distinct situations collapsing into one "NONE" token (.github#127) -- and
              # a call that is never made cannot fail. Verified before removing:
              # CLOSER_TYPE and CLOSING_PR_BASE were read nowhere outside this branch.
              #
              # SAFE AGAINST THE FR GATE, checked rather than assumed: fr-gate ranks
              # `Done` 11 against `On dev` 6, so a terminal card satisfies both the
              # staging and the prod gate instead of blocking them. Its own comment
              # records that being learned the hard way, when strict equality meant "a
              # single Done card blocked every prod" promotion.
              STATUS="Done"
            else
              # not_planned, or closed with no state_reason at all → abandoned.
              STATUS="Cancelled"
            fi
          else
            echo "Unexpected event '$EVENT_NAME' — skipping"
          fi

          # Grouped: three consecutive individual redirects trip SC2129, and
          # actionlint is a required check here.
          {
            echo "status=$STATUS"
            echo "sibling=$SIBLING"
            echo "unusable_override=$UNUSABLE_OVERRIDE"
          } >> "$GITHUB_OUTPUT"
          echo "Routing decision: status=${STATUS:-(unchanged)} sibling=$SIBLING unusable-override=$UNUSABLE_OVERRIDE"

      # Visibility for backend#1437 mechanism 1. Runs AFTER the Status update
      # so a label failure can never suppress the column write - with the label
      # first, its hard-fail skipped the update via the implicit success()
      # condition and left the card wherever the built-in automation put it
      # (Bugbot, .github#157). PAT rather than the caller's GITHUB_TOKEN:
      # caller permission sets vary per repo.
      - name: Update Status on the kanban
        if: steps.target.outputs.status != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ inputs.org }}
          PROJECT_NUMBER: ${{ inputs.project-number }}
          STATUS_NAME: ${{ steps.target.outputs.status }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO_NAME="${REPO_FULL#*/}"

          # Look up project ID + Status field/option IDs
          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          PROJ=$(gh api graphql -f query='
            query($org: String!, $num: Int!) {
              organization(login: $org) {
                projectV2(number: $num) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2SingleSelectField { id name options { id name } }
                    }
                  }
                }
              }
            }' -F org="$ORG" -F num="$PROJECT_NUMBER")

          PROJECT_ID=$(echo "$PROJ" | jq -r '.data.organization.projectV2.id')
          STATUS_FIELD=$(echo "$PROJ" | jq -r '.data.organization.projectV2.fields.nodes[]
            | select(.name=="Status") | .id')
          STATUS_OPT=$(echo "$PROJ" | jq -r --arg s "$STATUS_NAME" '.data.organization.projectV2.fields.nodes[]
            | select(.name=="Status") | .options[] | select(.name==$s) | .id')
          if [ -z "$STATUS_OPT" ] || [ "$STATUS_OPT" = "null" ]; then
            echo "Could not resolve Status option '$STATUS_NAME' — aborting"
            exit 1
          fi

          # Find item ID for this PR or issue
          if [ "$IS_PR" = "true" ]; then
            # shellcheck disable=SC2016  # $num is a GraphQL variable - must not expand in shell
            FIELD_QUERY='pullRequest(number: $num) { projectItems(first: 10) { nodes { id project { number } fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } } } } }'
          else
            # shellcheck disable=SC2016  # $num is a GraphQL variable - must not expand in shell
            FIELD_QUERY='issue(number: $num) { projectItems(first: 10) { nodes { id project { number } fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } } } } }'
          fi

          # Retry briefly to let auto-add fire if needed
          for i in 1 2 3 4 5; do
            RESP=$(gh api graphql -f query="
              query(\$org: String!, \$repo: String!, \$num: Int!) {
                repository(owner: \$org, name: \$repo) {
                  $FIELD_QUERY
                }
              }" -F org="$ORG" -F repo="$REPO_NAME" -F num="$NUMBER" 2>/dev/null) || RESP='{}'

            ITEM_ID=$(echo "$RESP" | jq -r --arg n "$PROJECT_NUMBER" '
              ([.. | objects | select(has("projectItems"))] | first).projectItems.nodes[]?
              | select(.project.number == ($n | tonumber)) | .id' | head -1)
            CURRENT_COL=$(echo "$RESP" | jq -r --arg n "$PROJECT_NUMBER" '
              ([.. | objects | select(has("projectItems"))] | first).projectItems.nodes[]?
              | select(.project.number == ($n | tonumber)) | .fieldValueByName.name // ""' | head -1)
            if [ -n "$ITEM_ID" ] && [ "$ITEM_ID" != "null" ]; then break; fi
            echo "Item not yet on project, retry $i/5..."
            sleep 5
          done

          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
            echo "Item #$NUMBER not on project after 5 retries — skipping."
            exit 0
          fi

          # Done means "completed, nothing deployed" (D8), so it must never overwrite a
          # column that records a deployment. kanban-reconcile.yml refuses this and the
          # router did not, which is an asymmetry with a real path: reopen, then
          # hand-close an issue sitting in On dev / FR on staging / Ready for prod, and
          # the deploy state is gone -- after which kanban-archive.yml, which now
          # archives Done, hides the card entirely (Bugbot, .github#126).
          #
          # Only Done is guarded. A PR-derived Status is a deploy fact and may advance a
          # card normally.
          # WHICH COLUMNS ARE DEPLOY STATES, ASKED OF THE BOARD (backend#1846).
          #
          # This was a hand-maintained list of six names, duplicated in
          # kanban-reconcile.yml -- and it had already rotted once: it carried the
          # pre-rename "Staging (human review)" and not the board's actual
          # "Staging (agent review)", so a card hand-closed in that column lost its
          # deploy state and kanban-archive.yml then hid it (.github#237). Fixing
          # that instance left the CLASS: the next rename or inserted column
          # reopens it, silently, in two files.
          #
          # The board already answers this. `$PROJ` carries the Status options in
          # PIPELINE ORDER, so a deploy state is any column at or after "On dev"
          # and at or before "Prod". An inserted column -- which is exactly how
          # "Staging (agent review)" arrived -- is classified correctly with no
          # edit here, and a renamed intermediate column keeps working because its
          # POSITION is what matters, not its name.
          #
          # Two anchors instead of six names, and both are written by this same
          # workflow, so .github#247's checker already asserts they exist.
          col_index() {
            echo "$PROJ" | jq -r --arg s "$1" \
              '[.data.organization.projectV2.fields.nodes[]
                | select(.name=="Status") | .options[].name] | index($s) // -1'
          }
          # selftest:classify-start  (byte-identical in kanban-reconcile.yml)
          # Is this column a DEPLOY STATE? Answered from the board's own ORDER --
          # any column at or after "On dev" and at or before "Prod" -- so a column
          # INSERTED between them is classified correctly with no edit here
          # (backend#1846). Only `col_index` differs between the two workflows,
          # because only their inputs differ; this decision must not.
          #
          #   yes      a deploy state
          #   no       not one -- including NO COLUMN AT ALL, which is evidence
          #            nothing deployed rather than a column we cannot place
          #   unknown  a column the board does not report
          #   noboard  the board's anchors are MISSING OR INVERTED, so nothing can
          #            be placed. Inverted counts as much as missing: this helper's
          #            whole thesis is that POSITION decides, which makes option
          #            ORDER load-bearing. Drag "Prod" above "On dev" and the range
          #            _d.._p is unsatisfiable, so EVERY column -- "Prod" itself
          #            included -- comes back `no`, the router writes Done over
          #            shipped state and reconcile asserts it. A reordered board is
          #            UNREADABLE, not evidence that nothing deployed, so it fails
          #            closed exactly like a missing anchor (backend#1994).
          classify_column() {
            case "${1:-}" in
              ""|"No status") echo no; return ;;
            esac
            _c=$(col_index "$1"); _d=$(col_index "On dev"); _p=$(col_index "Prod")
            if [ "$_d" -lt 0 ] || [ "$_p" -lt 0 ] || [ "$_d" -gt "$_p" ]; then echo noboard; return; fi
            if [ "$_c" -lt 0 ]; then echo unknown; return; fi
            if [ "$_c" -ge "$_d" ] && [ "$_c" -le "$_p" ]; then echo yes; else echo no; fi
          }
          # selftest:classify-end
          if [ "$STATUS_NAME" = "Done" ]; then
            # UNKNOWN MUST NOT FALL OPEN -- the other half of #1846. A column this
            # workflow cannot place used to sail past the `case` and let Done erase
            # a deploy state. Refusing costs a card sitting where it is; falling
            # open erases the fact that it shipped.
            # selftest:policy-start
            _ds=$(classify_column "${CURRENT_COL:-}")
            case "$_ds" in
              noboard)
                echo "::error::the board's 'On dev'/'Prod' anchors are missing or out of order, so a deploy state cannot be recognised - refusing to set Done on #$NUMBER"
                exit 1 ;;
              unknown)
                echo "::notice::#$NUMBER sits in '${CURRENT_COL:-<unreadable>}', which this board does not report as a column - NOT setting Done rather than guessing"
                exit 0 ;;
              yes) _protect=yes ;;
              *)   _protect=no ;;
            esac
            # selftest:policy-end
            if [ "$_protect" = "yes" ]; then
              echo "::notice::#$NUMBER hand-closed but sits in '$CURRENT_COL', a deploy state - NOT setting Done (D8: follow the PR's stage)"
              # AND SAY SO WHERE SOMEONE WILL SEE IT. Refusing is right, but it
              # parks the card with no way to self-heal, and a run-log notice is
              # invisible by the time anyone looks at the board. The two real
              # cases needed OPPOSITE answers -- backend#1493 had shipped via
              # cli#452 and belonged in Prod; data-ingestors#488 was reverted and
              # belonged in Done -- so no default is correct and only the person
              # closing it knows which.
                CLOSE_NOTE="Closed while the board still shows \`$CURRENT_COL\`, which records a deployment."
                CLOSE_NOTE="$CLOSE_NOTE The automation will not overwrite a deploy state with \`Done\` (RFC-BACKEND-1405 D8),"
                CLOSE_NOTE="$CLOSE_NOTE so this card stays where it is until someone says which happened:"
                CLOSE_NOTE="$CLOSE_NOTE **it shipped** - move the card to the column it reached (\`Prod\` if it is in production);"
                CLOSE_NOTE="$CLOSE_NOTE **nothing was deployed** (reverted, abandoned, superseded) - clear the deploy state, then \`Done\`."
                CLOSE_NOTE="$CLOSE_NOTE Both cases are real and they need opposite answers, which is why this is not decided automatically."
                gh issue comment "$NUMBER" --repo "$REPO_FULL" --body "$CLOSE_NOTE" >/dev/null 2>&1 \
                  || echo "::warning::could not comment on #$NUMBER - it is parked in '$CURRENT_COL' with no note on the issue"
              exit 0
            fi
          fi

          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          gh api graphql -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $p, itemId: $i, fieldId: $f,
                value: {singleSelectOptionId: $o}
              }) { projectV2Item { id } }
            }' -f p="$PROJECT_ID" -f i="$ITEM_ID" -f f="$STATUS_FIELD" -f o="$STATUS_OPT" > /dev/null

          echo "→ #$NUMBER → Status=$STATUS_NAME"
      - name: Label a card whose override could not be used
        if: steps.target.outputs.unusable_override == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_FULL: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # Same write rule as the sibling label below: a swallowed failure means the
          # card silently loses the only marker saying its Status is a placeholder.
          # `override-unusable`, not `override-unreadable` (backend#2324): the label
          # is the operator's entry point, and a card can now reach this state with a
          # `.kanban.yml` that read perfectly and named a column that does not exist.
          #
          # NOTHING TO MIGRATE, AND THE REASON IS MEASURED RATHER THAN INFERRED
          # (backend#2801). This used to rest on a claim that the fleet had no
          # adopters of the override at all, which stopped being true. The
          # CONCLUSION survives on its own evidence: `override-unreadable` is
          # carried by ZERO issues or PRs org-wide (measured 2026-08-28), so there
          # is still nothing to migrate. Do not reintroduce a clause about how many
          # repos adopt the override -- it is a fact about the org that no comment
          # can keep true, it was load-bearing for a different conclusion in
          # scripts/branch_status_map.py, and that file's selftest now refuses it
          # here too.
          #
          # KEEP THE DESCRIPTION UNDER 100 CHARACTERS (Bugbot, #302). That is the
          # label API's cap; over it the create 422s, `set -euo pipefail` aborts the
          # step, and the parked card never gets the marker this holding state exists
          # to leave. My first wording was 133. The selftest measures it now.
          if ! gh api "repos/$REPO_FULL/labels/override-unusable" >/dev/null 2>&1; then
            gh api "repos/$REPO_FULL/labels" -f name=override-unusable -f color=d4c5f9 -f description="Holding state: .kanban.yml unreadable, or names an undeclared Status (backend#2324)" >/dev/null
          fi
          gh api -X POST "repos/$REPO_FULL/issues/$NUMBER/labels" -f "labels[]=override-unusable" >/dev/null

      - name: Label sibling-merged PR
        if: steps.target.outputs.sibling == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_FULL: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Write failures FAIL this step (the PROJECTS_KANBAN_TOKEN write
          # rule): a swallowed error means the card silently loses its only
          # visibility marker (Bugbot, .github#157). Only the ensure-label
          # probe may miss quietly - a 404 there just means create it.
          if ! gh api "repos/$REPO_FULL/labels/sibling-merge" >/dev/null 2>&1; then
            gh api "repos/$REPO_FULL/labels" -f name=sibling-merge -f color=bfdadc -f description="Merged into a sibling feature branch; content ships via the parent PR (backend#1437)" >/dev/null
          fi
          gh api -X POST "repos/$REPO_FULL/issues/$NUMBER/labels" -f "labels[]=sibling-merge" >/dev/null

