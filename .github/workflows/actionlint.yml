name: Actionlint

# Repo-local CI for this repo's OWN workflow files. Not a reusable workflow --
# nothing calls it; it runs on pull requests here.
#
# WHY
#   This repo publishes the reusable workflows that every other repo in the org
#   consumes at `@main`, and until now nothing validated them before merge. A
#   mistyped expression, a bad `needs:` edge, or a broken shell line shipped
#   org-wide the moment it landed. actionlint parses each workflow, type-checks
#   every `${{ }}` expression, validates the runs-on / uses / needs wiring, and
#   runs shellcheck over every `run:` block -- i.e. it covers exactly the class
#   of mistake that is invisible in review and expensive in production.
#
# BLOCKING BEHAVIOUR
#   A hard gate from day one: any finding fails the job. That is affordable
#   only because the pre-existing backlog (29 findings across 8 workflows) was
#   cleared in the same change that added this file, so the tree starts at zero
#   and the job is green immediately. Contrast code-quality.yml, which ships
#   `soft-fail: true` because it is aimed at repos with an unlinted backlog --
#   a linter switched on as a required check against a dirty tree gets the
#   check removed, not the tree fixed.
#
#   Suppressions are per-line `# shellcheck disable=SCxxxx` directives placed at
#   the site, each with a comment saying why. There is deliberately no
#   `.github/actionlint.yaml` and no `-ignore` flag: a repo-wide exclusion would
#   silently cover future code as well as the line it was written for.
#
#   Before marking this a required status check, read the `paths:` filter below.
#   It means the job does NOT run on a PR that touches no workflow file (a
#   README-only change, say), and a required check that never runs leaves such a
#   PR waiting for a status forever. Either drop the filter when you require the
#   check, or keep the filter and leave the check advisory.
#
# SUPPLY CHAIN
#   actionlint is installed from its release tarball, pinned by version AND
#   verified against a pinned SHA-256, rather than through a wrapper action that
#   downloads it for us -- a digest pin on the artefact actually executed is a
#   stronger guarantee than a commit pin on the wrapper. `actions/checkout` is
#   pinned to a full commit SHA. To bump: change ACTIONLINT_VERSION and
#   ACTIONLINT_SHA256 together, taking the digest from the upstream
#   `actionlint_<version>_checksums.txt` release asset.
#
# RUN IT LOCALLY (same tool, same checks as CI)
#   brew install actionlint shellcheck   # or: go install .../actionlint@latest
#   actionlint

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

# Supersede the previous run when the branch is pushed again, instead of
# stacking duplicate runs per push.
concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. The job checks out the tree and runs a linter -- it never writes
# to the repo, the API, or the project board.
permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install actionlint (version + digest pinned)
        run: |
          set -euo pipefail
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}"
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/$TARBALL" "$URL"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$TARBALL" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP" actionlint
          install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          actionlint -version

      - name: Check shellcheck is present
        run: |
          set -euo pipefail
          # actionlint shells out to shellcheck for every `run:` block, but when
          # the binary is missing it SKIPS that whole class of checks and still
          # exits 0 -- the gate would stay green while checking far less. Fail
          # loudly rather than degrade quietly.
          if ! command -v shellcheck > /dev/null 2>&1; then
            echo "::error::shellcheck is not on the runner -- actionlint would skip every shell check."
            exit 1
          fi
          shellcheck --version | sed -n '/version:/p'

      - name: Lint workflows
        run: |
          set -uo pipefail
          # -shellcheck is passed explicitly so the integration cannot be turned
          # off by an empty default. No -ignore and no config file on purpose:
          # suppressions belong at the line they apply to.
          actionlint -no-color -oneline -shellcheck shellcheck > "$RUNNER_TEMP/findings.txt"
          STATUS=$?

          # Exit 0 = clean, 1 = findings, anything else = actionlint itself failed
          # (bad flag, no workflows directory). Don't report that as a lint result.
          if [ "$STATUS" -gt 1 ]; then
            echo "::error::actionlint could not run (exit $STATUS). See the log above."
            exit "$STATUS"
          fi

          COUNT=$(wc -l < "$RUNNER_TEMP/findings.txt" | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            echo "actionlint: 0 findings."
            echo "### actionlint: 0 findings" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat "$RUNNER_TEMP/findings.txt"
          # Annotate each finding on the diff. -oneline emits "path:line:col: msg",
          # so the location is the first three colon-separated fields.
          awk -F: 'NF>=4 {
            loc = $1 ":" $2 ":" $3
            printf "::error file=%s,line=%s,col=%s::%s\n", $1, $2, $3, substr($0, length(loc) + 3)
          }' "$RUNNER_TEMP/findings.txt"

          {
            echo "### actionlint: $COUNT finding(s)"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/findings.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::actionlint reported $COUNT finding(s)."
          echo "::error::Fix them, or add a targeted '# shellcheck disable=SCxxxx' at the specific line with a reason."
          exit 1
