name: advance-deploy-env selftest

# advance-deploy-env moves a merged PR's kanban card, and it decides WHICH card
# by attributing each pushed commit to a PR. It used to read that from the commit
# SUBJECT, which the org convention `type(scope): summary (backend#N)` breaks --
# the `(#N)` slot holds a ticket, or an edited squash subject holds nothing -- so
# it advanced the wrong card or none (2/48 on the 2026-09-07 staging hop,
# backend#3365). The fix derives the PR from GitHub; this pins it with the two
# real misses as fixtures so the class cannot silently return.
#
# Offline: the suite builds throwaway git repos and stubs `gh` on PATH, so it
# needs no token and reaches no network. Path-filtered like the other selftests --
# it only runs when the thing it tests changes.

on:
  pull_request:
    paths:
      - scripts/extract-advanced-prs.sh
      - scripts/tests/extract-advanced-prs-selftest.sh
      - .github/workflows/advance-deploy-env-selftest.yml
  push:
    branches: [main, develop, staging]
    paths:
      - scripts/extract-advanced-prs.sh
      - scripts/tests/extract-advanced-prs-selftest.sh
      - .github/workflows/advance-deploy-env-selftest.yml

permissions:
  contents: read

concurrency:
  group: advance-deploy-env-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The suite creates real commits; a committer identity is not configured on
      # a fresh runner.
      - run: |
          git config --global user.email "selftest@tracebloc.io"
          git config --global user.name "advance-deploy-env selftest"
      - run: bash scripts/tests/extract-advanced-prs-selftest.sh
