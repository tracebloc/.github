name: Kanban archive

# Continuous board hygiene (RFC-BACKEND-0008 D3): archive every item that has
# reached a terminal column (Prod / Cancelled) so the board shows only live work.
#
# Archived items are RETAINED and searchable - this hides done work, it does not
# delete it. Archiving is what keeps the board fast: at the current merge rate
# ~800 items/month land in Prod, so terminal work has to leave the board on entry,
# not accumulate.
#
# Archives by COLUMN MEMBERSHIP, never by age. Age is unusable on this board (the
# retired auto-classify rewrote updatedAt every 10 min), and a just-shipped item
# should archive promptly, not after N idle days. Runs daily, just after the
# reconcile pass (which moves any drifted items into Prod first).

on:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC daily (after kanban-reconcile at 04:00)
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Log what would be archived without archiving"
        type: boolean
        default: false

permissions:
  contents: read
  # Lets the completeness check below download the PREVIOUS run's recorded board
  # size. That number is the only one in this job that THIS run's credential did
  # not produce, which is what makes it able to answer a question no
  # single-read check can (backend#2802).
  actions: read

concurrency:
  group: kanban-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      ORG: tracebloc
      PROJECT_NUMBER: 2
      DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
    steps:
      # Board writes authenticate as the tracebloc-release-train App (backend#2036),
      # not as a human's PAT. `owner:` makes it an ORG-scoped installation token --
      # a repo-scoped one cannot touch an org ProjectV2. No fallback to the old PAT:
      # a fallback would make a broken App path look like a working migration.
      #
      # GH_TOKEN moved from job-level env to per-step because a job-level env cannot
      # read a step output. That is an improvement, not a workaround -- it now says
      # exactly which steps hold a credential.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # LEAST PRIVILEGE, DERIVED FROM WHAT THIS RUNS (backend#2157). The only
          # mutation is `archiveProjectV2Item`, so `organization-projects: write` is
          # the whole requirement -- no issues, no pull-requests, no contents.
          #
          # `repositories:` narrows the repo-level half to this repo; the board write
          # is an ORG permission and is unaffected by it (measured, backend#2181 run
          # 32255581084).
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write

      - name: Resolve project id
        id: ids
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # $names are GraphQL variables, not shell - keep literal
          PROJECT_ID=$(gh api graphql -f query='
            query($org: String!, $num: Int!) {
              organization(login: $org) { projectV2(number: $num) { id } }
            }' -F org="$ORG" -F num="$PROJECT_NUMBER" \
            --jq '.data.organization.projectV2.id')
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Collect un-archived terminal items (Prod / Cancelled)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          : > terminal.ids
          : > seen.tsv
          cursor="null"
          while :; do
            if [ "$cursor" = "null" ]; then
              # shellcheck disable=SC2016  # $names are GraphQL variables, not shell - keep literal
              OUT=$(gh api graphql -f query='
                query($org: String!, $num: Int!) {
                  organization(login: $org) { projectV2(number: $num) {
                    items(first: 100) {
                      totalCount
                      pageInfo { hasNextPage endCursor }
                      nodes { id isArchived
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name } } }
                    } } } }' -F org="$ORG" -F num="$PROJECT_NUMBER")
            else
              # shellcheck disable=SC2016  # $names are GraphQL variables, not shell - keep literal
              OUT=$(gh api graphql -f query='
                query($org: String!, $num: Int!, $c: String!) {
                  organization(login: $org) { projectV2(number: $num) {
                    items(first: 100, after: $c) {
                      totalCount
                      pageInfo { hasNextPage endCursor }
                      nodes { id isArchived
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name } } }
                    } } } }' -F org="$ORG" -F num="$PROJECT_NUMBER" -F c="$cursor")
            fi
            echo "$OUT" | jq -r '.data.organization.projectV2.items.nodes[]
              | select(.isArchived == false)
              | select(.fieldValueByName.name == "Prod" or .fieldValueByName.name == "Cancelled" or .fieldValueByName.name == "Done")
              | .id' >> terminal.ids
            # WHAT THIS READ ACTUALLY SAW, recorded per item (backend#2623). The counts
            # below are the only thing that can tell "the board is clean" apart from
            # "this credential cannot see the board", and for weeks nothing printed
            # them. A null Status means the item was returned but its field value was
            # not readable -- which silently drops it from the filter above.
            echo "$OUT" | jq -r '.data.organization.projectV2.items.nodes[]
              | [(.isArchived|tostring), (.fieldValueByName.name // "NULL_STATUS")]
              | @tsv' >> seen.tsv
            HAS_NEXT=$(echo "$OUT" | jq -r '.data.organization.projectV2.items.pageInfo.hasNextPage')
            cursor=$(echo "$OUT" | jq -r '.data.organization.projectV2.items.pageInfo.endCursor')
            [ "$HAS_NEXT" = "true" ] || break
          done
          total=$(wc -l < seen.tsv | tr -d " ")
          nullst=$(awk -F"\t" '$2=="NULL_STATUS"' seen.tsv | wc -l | tr -d " ")
          live=$(awk -F"\t" '$1=="false"' seen.tsv | wc -l | tr -d " ")
          echo "Items this credential could read: $total (un-archived: $live, unreadable Status: $nullst)"
          echo "Un-archived terminal items: $(wc -l < terminal.ids)"
          {
            echo "## What the archive credential saw"
            echo ""
            echo "| measure | count |"
            echo "|---|---|"
            echo "| items read | $total |"
            echo "| un-archived | $live |"
            echo "| Status unreadable (null) | $nullst |"
            echo "| terminal + un-archived | $(wc -l < terminal.ids | tr -d " ") |"
          } >> "$GITHUB_STEP_SUMMARY"
          # A NULL Status IS A FINDING, not a shrug. The item exists, the filter cannot
          # judge it, and the run would otherwise report success having skipped it.
          if [ "$nullst" -gt 0 ]; then
            echo "::warning::$nullst item(s) returned an unreadable Status for this credential. They cannot be judged terminal or not, so they are neither archived nor reported -- this is the silent-skip path backend#2623 exists to close."
          fi
          echo "$total" > seen.total

      - name: Archive them
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PROJECT_ID="${{ steps.ids.outputs.project_id }}"
          n=$(wc -l < terminal.ids | tr -d ' ')
          if [ "$n" = "0" ]; then echo "Nothing to archive."; fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN - would archive $n terminal item(s)."
            exit 0
          fi
          ok=0; fail=0
          while IFS= read -r itemId; do
            [ -z "$itemId" ] && continue
            # `2>&1 >/dev/null` keeps stderr (the API error) and drops the mutation
            # payload, which we never read. The reverse order would discard the one
            # thing needed to diagnose a failure. Same form as advance-deploy-env.yml.
            # shellcheck disable=SC2016  # $names are GraphQL variables, not shell - keep literal
            if err=$(gh api graphql -f query='
                mutation($p: ID!, $i: ID!) {
                  archiveProjectV2Item(input: {projectId: $p, itemId: $i}) { item { id } }
                }' -F p="$PROJECT_ID" -F i="$itemId" 2>&1 >/dev/null); then
              ok=$((ok+1))
            else
              echo "::warning::failed to archive item $itemId: $err"
              fail=$((fail+1))
            fi
          done < terminal.ids
          echo "=== Archived: $ok ok, $fail failed ==="
          # Handed to the completeness check as the ONLY legitimate reason the
          # board may be smaller than it was yesterday. Written before the
          # fail-closed exit below so it exists whatever the archive did.
          echo "$ok" > archived.count
          {
            echo "## Kanban archive"
            echo ""
            echo "Archived $ok terminal item(s), $fail failed."
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail closed. A failed archive leaves terminal work on the board, which
          # is the exact condition this workflow exists to prevent, and nothing
          # retries it beyond tomorrow's run hitting the same error. Exiting 0 here
          # meant the board could degrade for weeks behind an unbroken green history
          # - at ~800 items/month reaching Prod, slowly enough to look like normal
          # growth. The summary is written above first so it survives this exit.
          if [ "$fail" -ne 0 ]; then
            echo "::error::$fail of $((ok+fail)) terminal item(s) failed to archive (see warnings above)."
            exit 1
          fi


      # THE ONE NUMBER THIS RUN DID NOT PRODUCE ITSELF (backend#2802).
      #
      # Every completeness check below this line compares two figures that come
      # out of the SAME credential's SAME view of the board -- `reread_total`
      # against `declared_total`, and the re-read against the first read. Both
      # pairs shrink together, so all of them agree while the view itself is
      # partial. Measured 2026-08-28: two runs two minutes apart reported
      # "paginated 93, totalCount=93 (agree)" and "paginated 30, totalCount=30
      # (agree)" with ONE item archived between them, while a PAT saw 742. Each
      # run was internally consistent and both were wrong. A board cannot lose
      # 63 cards to a single archive, but nothing in a single run could say so,
      # because the disagreement is BETWEEN runs and every number was inside one.
      #
      # So carry yesterday's count forward as an artifact and compare across the
      # boundary. Cards leave this board exactly one way -- being archived -- so
      # `previous - archived_this_run` is a hard floor on today's size, and a
      # total below it is a shrunken view, not a smaller board.
      - name: Recall the previous run's board size
        if: env.DRY_RUN != 'true'
        env:
          # The DEFAULT token, not the App token: this reads run artifacts in
          # this repo, which is what `actions: read` above grants it. The App
          # token is scoped for the project board and is the very credential
          # under suspicion here -- reading the baseline with it would put both
          # sides of the comparison back inside one view.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          : > prev.total
          : > prev.error
          # ASK WHETHER A BASELINE EXISTS BEFORE ASKING FOR ITS CONTENT, because
          # those are the two answers this step must never conflate (Bugbot,
          # #383). The first draft walked `gh run list ... || true` and let an
          # empty result mean "no baseline" -- so an API failure, an expired
          # token or a rate limit rendered as the benign first-run warning and
          # the job still passed. That is the ticket's own defect reproduced one
          # layer inside its fix: a check reporting clean having compared
          # nothing, because it could not tell "absent" from "unreadable".
          #
          # The artifacts endpoint answers it unambiguously: it FAILS on a
          # broken lookup and returns an empty list when there is genuinely
          # nothing yet. It also carries `workflow_run.id`, so the run listing
          # is not needed at all -- one call, and no second way to be wrong.
          if ! arts=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=board-baseline&per_page=100" 2>&1); then
            # selftest:unreadable-path
            printf 'the artifact listing failed: %s\n' "$(printf '%s' "$arts" | tail -1)" > prev.error
            echo "::warning::could not list the board-baseline artifacts; the assert step will refuse."
          else
            live=$(printf '%s' "$arts" | jq '[.artifacts[] | select(.expired == false)] | length')
            if [ "$live" = "0" ]; then
              echo "No unexpired board-baseline artifact exists yet (first run, or retention lapsed)."
            else
              rid=$(printf '%s' "$arts" \
                | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id')
              if gh run download "$rid" -n board-baseline -D prev >/dev/null 2>&1 && [ -s prev/board.total ]; then
                cp prev/board.total prev.total
                echo "Baseline: run $rid saw $(cat prev.total) item(s)."
                # IS THIS JOB THE ONLY ARCHIVER SINCE? It is not, and assuming
                # so was wrong (Bugbot High, .github#383). `kanban-reconcile.yml`
                # archives too -- `archiveProjectV2Item` at its own apply step --
                # every Monday at 04:00, an hour before this job. Cards it
                # archived are gone from the board and counted by no `ok` of
                # ours, so a floor of `previous - archived_now` sits above the
                # real board every Monday: a red produced by the check being
                # wrong, which is the fastest way to get a tier switched off.
                #
                # DERIVED, not estimated: ask when reconcile last succeeded and
                # compare it against the baseline's own timestamp. If it ran in
                # between, the arithmetic cannot be exact and this run says so
                # instead of refusing. Every other day the floor is exact.
                cut=$(printf '%s' "$arts" \
                  | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .created_at')
                if ! rec=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/kanban-reconcile.yml/runs?status=success&per_page=1" 2>&1); then
                  # selftest:unreadable-path
                  printf 'could not tell whether kanban-reconcile archived since the baseline: %s\n' "$(printf '%s' "$rec" | tail -1)" > prev.error
                else
                  last_rec=$(printf '%s' "$rec" | jq -r '.workflow_runs[0].updated_at // ""')
                  if [ -n "$last_rec" ] && [ "$last_rec" \> "$cut" ]; then
                    printf '%s\n' "$last_rec" > prev.otherarchiver
                  fi
                fi
              else
                # The listing SAW a live artifact and the fetch still failed, so
                # this is a broken read, not an empty history. Refusing is the
                # whole point of having asked the two questions separately.
                # selftest:unreadable-path
                printf 'a live board-baseline artifact exists (run %s) but could not be downloaded\n' "$rid" > prev.error
                echo "::warning::the baseline exists but could not be read; the assert step will refuse."
              fi
            fi
          fi

      # A SEPARATE STEP, AND THAT IS THE FIX (Bugbot High, #339). This block used
      # to sit at the bottom of "Archive them", BELOW `if [ "$n" = "0" ]; then
      # ... exit 0; fi`. So the one case it exists to catch -- a first read that
      # finds nothing terminal because the credential cannot see it -- left the
      # step before asserting anything, and the job went green having checked
      # nothing. A guard reachable only when the bug is absent is not a guard.
      # As its own step it runs whatever the archive did or did not do.
      # NOT IN DRY RUN. A dry run archives nothing, so terminal cards are still
      # there by construction and this would fail every time -- turning the
      # preview into a permanent red that teaches people to ignore it. The
      # assertion is about whether a REAL run left the board clean.
      - name: Assert the board is clean
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # ASSERT THE BOARD IS CLEAN, not that the archive did what it saw
          # (backend#2623). Every guard above answers "did my writes succeed?" and
          # every one of them can answer yes while the board is untouched -- which is
          # what happened: on 2026-08-26 this workflow archived 63 of 63 items,
          # reported success, and left 668 un-archived terminal cards (475 Prod, 153
          # Done, 40 Cancelled) that a human PAT could see and this credential could
          # not. Weeks of unbroken green, and the header comment above had already
          # predicted the shape ("the board could degrade for weeks behind an unbroken
          # green history").
          #
          # So re-read AFTER archiving and fail on anything terminal that is still
          # live. This is deliberately a SECOND read rather than arithmetic on the
          # first: the defect being caught is that the first read is incomplete, so
          # comparing it against itself would agree and prove nothing -- the
          # test-a-list-against-itself trap.
          #
          # It fails CLOSED on an unreadable re-read too: zero parsed items is not
          # evidence of a clean board, so an empty result with a non-zero total is a
          # finding, not a pass.
          left=0; reread_total=0; nullst_after=0; declared_total=""; cursor="null"
          while :; do
            if [ "$cursor" = "null" ]; then
              # shellcheck disable=SC2016  # $names are GraphQL variables, not shell - keep literal
              OUT=$(gh api graphql -f query='
                query($org: String!, $num: Int!) {
                  organization(login: $org) { projectV2(number: $num) {
                    items(first: 100) {
                      totalCount
                      pageInfo { hasNextPage endCursor }
                      nodes { id isArchived
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name } } }
                    } } } }' -F org="$ORG" -F num="$PROJECT_NUMBER") || OUT=""
            else
              # shellcheck disable=SC2016  # $names are GraphQL variables, not shell - keep literal
              OUT=$(gh api graphql -f query='
                query($org: String!, $num: Int!, $c: String!) {
                  organization(login: $org) { projectV2(number: $num) {
                    items(first: 100, after: $c) {
                      totalCount
                      pageInfo { hasNextPage endCursor }
                      nodes { id isArchived
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name } } }
                    } } } }' -F org="$ORG" -F num="$PROJECT_NUMBER" -F c="$cursor") || OUT=""
            fi
            if [ -z "$OUT" ]; then
              echo "::error::the post-archive re-read failed, so this run cannot show the board is clean. Unverified is not verified-clean."
              exit 1
            fi
            # FAIL CLOSED ON AN UNREADABLE CONNECTION. `nodes|length` renders a
            # missing or null path as 0, so a query that returned no items at all
            # would read as "nothing left to archive" and pass (Bugbot HIGH,
            # backend#2623). Check the connection resolved before counting it.
            if [ "$(echo "$OUT" | jq -r 'try (.data.organization.projectV2.items.nodes|type) catch "null"')" != "array" ]; then
              echo "::error::the post-archive re-read returned no items array, so this run cannot show the board is clean. Unverified is not verified-clean."
              exit 1
            fi
            # THE SERVER'S OWN COUNT, which is the only number in this job that does
            # not come from the same credential's view of `nodes`. Comparing two
            # same-credential reads catches a read that DEGRADED, never one that was
            # incomplete in both -- the blindness this whole step exists to close.
            page_tc=$(echo "$OUT" | jq -r '.data.organization.projectV2.items.totalCount // "null"')
            case "$page_tc" in
              ''|null|*[!0-9]*)
                echo "::error::the post-archive re-read did not return totalCount, so the completeness of this read cannot be established."
                exit 1 ;;
            esac
            [ -z "$declared_total" ] && declared_total="$page_tc"
            n=$(echo "$OUT" | jq -r '.data.organization.projectV2.items.nodes|length')
            reread_total=$((reread_total + n))
            left=$((left + $(echo "$OUT" | jq -r '[.data.organization.projectV2.items.nodes[]
              | select(.isArchived == false)
              | select(.fieldValueByName.name == "Prod" or .fieldValueByName.name == "Cancelled" or .fieldValueByName.name == "Done")]
              | length')))
            nullst_after=$((nullst_after + $(echo "$OUT" | jq -r '[.data.organization.projectV2.items.nodes[]
              | select(.isArchived == false)
              | select(.fieldValueByName == null or .fieldValueByName.name == null)]
              | length')))
            HAS_NEXT=$(echo "$OUT" | jq -r '.data.organization.projectV2.items.pageInfo.hasNextPage')
            cursor=$(echo "$OUT" | jq -r '.data.organization.projectV2.items.pageInfo.endCursor')
            [ "$HAS_NEXT" = "true" ] || break
          done
          echo "Post-archive re-read: $reread_total item(s), $left still terminal + un-archived."
          {
            echo ""
            echo "Post-archive re-read: **$left** terminal item(s) still un-archived (of $reread_total read)."
          } >> "$GITHUB_STEP_SUMMARY"
          # NOTE: this no longer exits here. It is the primary assertion, but exiting
          # on it skipped the completeness numbers below, and those are what say
          # whether a non-zero `left` means "archiving missed some" or "this
          # credential cannot see the board at all". Recorded into `fail` and raised
          # with everything else at the end of the step.
          left_bad=0
          if [ "$left" -ne 0 ]; then
            echo "::error::$left terminal item(s) remain un-archived after this run. The archive succeeded on what it could see, which is NOT the same as the board being clean -- see backend#2623."
            left_bad=1
          fi
          # THE RE-READ IS THE SAME CREDENTIAL, SO IT SHARES THE BLIND SPOT
          # (Bugbot High, #339). The comment above says a second read avoids
          # comparing the first read against itself. That is true of the ITEM
          # LIST and false of what actually made the incident invisible: the
          # items WERE returned; their `Status` came back null for this
          # credential, so they matched no terminal filter and `left` stayed 0.
          # A second read with the same token reproduces that precisely, and
          # then agrees with itself -- the trap the comment claims to dodge.
          #
          # Two things the terminal count alone cannot say are therefore findings:
          #
          #   1. A null Status on an UN-ARCHIVED item. It may be terminal and
          #      this credential cannot tell. "Cannot tell" is not "clean". The
          #      first read only ::warning::-ed on exactly this, which is the
          #      silent skip backend#2623 exists to close, one layer further in.
          #   2. A re-read that saw FEWER items than the first read. Both reads
          #      are this credential's, so this cannot see what neither can; it
          #      does catch a read that degraded mid-run, which would otherwise
          #      lower `left` and read as the board having improved.
          # EVALUATE EVERY COMPLETENESS FINDING BEFORE EXITING, and exit once at the
          # end. These three answer DIFFERENT questions and the most diagnostic one
          # was ordered last, so the first to fire hid it: on 2026-08-27 this step
          # exited on a single null Status while `totalCount` -- the only number here
          # that does not come from this credential's own view of `nodes` -- was never
          # compared. That comparison is what separates "this credential sees a small
          # board" from "items are being omitted from a large one", which is precisely
          # the question backend#2623 needs answered, and one short-circuit meant a
          # whole run produced no answer to it. A guard that masks a stronger guard
          # costs a run per diagnosis.
          fail=$left_bad
          # SEPARATE FROM `fail`, and the distinction is the whole of the second
          # Bugbot High (.github#383). `fail` asks "is the board clean?";
          # `view_bad` asks "can this run's own count be trusted?", and only the
          # second decides whether the baseline advances. Tying the record to
          # `fail` made the red SELF-SUSTAINING: a run that archived 50 cards and
          # then failed on a leftover terminal one skipped the record, so the next
          # run met a floor 50 too high, refused, skipped the record in turn, and
          # nothing could ever get back under it. Rule 4 -- a red nobody can clear
          # trains people to skip the tier. A leftover card or an unreadable
          # Status makes the JOB fail without making the COUNT wrong.
          view_bad=0
          # THE SERVER'S OWN COUNT FIRST, because it is the one independent number.
          # `totalCount` is the server's count of the connection; `reread_total` is
          # what pagination actually yielded. They disagree exactly when items are
          # omitted from `nodes` while still being counted -- the credential-blind
          # path, which would otherwise land as a LOWER terminal count and read as
          # success.
          if [ "$reread_total" -ne "$declared_total" ]; then
            echo "::error::the post-archive re-read paginated $reread_total item(s) but the server reports totalCount=$declared_total. Items are being omitted from the read, so a terminal card can exist that this run never judged -- this run cannot show the board is clean (backend#2623)."
            fail=1
            view_bad=1
          else
            echo "Completeness: paginated $reread_total item(s), server totalCount=$declared_total (agree)."
          fi
          if [ "$nullst_after" -gt 0 ]; then
            echo "::error::$nullst_after un-archived item(s) returned an unreadable Status on the post-archive re-read. They cannot be judged terminal, so this run CANNOT show the board is clean -- unverified is not verified-clean (backend#2623)."
            fail=1
          fi
          first_total=$(cat seen.total)
          if [ "$reread_total" -lt "$first_total" ]; then
            echo "::error::the post-archive re-read saw $reread_total item(s) but the first read saw $first_total. A read that shrank mid-run lowers the terminal count for a reason that is not archiving, so this run cannot show the board is clean."
            fail=1
            view_bad=1
          fi
          # selftest:xrun-begin
          # `if`, not `[ -s f ] && v=$(cat f)`: the short-circuit leaves the
          # absent-file case with a non-zero `$?`, which is harmless HERE and
          # becomes a failed step the moment anything is appended after it or
          # this block moves to the end of the step. Measured, so the comment
          # does not overstate it: `set -e` exempts every command of an AND-OR
          # list but the last, so the short-circuit does NOT exit mid-step
          # today. The `if` is what makes that independent of position.
          archived_now=0
          if [ -s archived.count ]; then archived_now=$(cat archived.count); fi
          prev_total=""
          if [ -s prev.total ]; then prev_total=$(cat prev.total); fi
          # THE EXACT IDENTITY, and it needs no baseline and no other workflow.
          # Two reads bracket this job's own archiving, so `first_total - ok` is
          # what the re-read MUST return -- not a bound, an equality. Nothing
          # else archives inside the seconds between them (reconcile runs an hour
          # earlier), so any other number is a view that moved under this run.
          # This is what catches the measured 93 -> 30: a first read of 93, one
          # item archived, and a re-read of 30 is off by 62 against an exact
          # expectation, with no cross-run state involved at all.
          expected=$((first_total - archived_now))
          if [ "$reread_total" -ne "$expected" ]; then
            echo "::error::this run read $first_total item(s), archived $archived_now, and then read $reread_total -- but archiving $archived_now of $first_total must leave exactly $expected. The view moved under this run, so its counts describe no single board (backend#2802)."
            fail=1
            view_bad=1
          fi
          # ACROSS THE RUN BOUNDARY, which is the only axis the three checks
          # above cannot see (backend#2802). Archiving is the sole way a card
          # leaves this board, so yesterday's total minus what this run archived
          # is a FLOOR on today's. Below it, the board did not shrink -- this
          # credential's view of it did.
          # UNREADABLE FIRST, and it is a REFUSAL rather than the warning below.
          # The two look identical from here -- both leave `prev_total` empty --
          # and collapsing them is what this ticket is about. An empty history is
          # a bounded cannot-tell with no remedy, so it warns; a failed read is
          # actionable, and a cron job's warnings are exactly what went unread
          # for weeks while this defect ran.
          if [ -s prev.error ]; then
            echo "::error::the previous board size could not be read ($(cat prev.error)), so this run made NO cross-run comparison. An unread baseline is not an absent one -- refusing rather than reporting the first-run warning (backend#2802)."
            fail=1
          elif [ -s prev.otherarchiver ]; then
            # NOT A REFUSAL, because the arithmetic genuinely cannot be exact
            # here: kanban-reconcile archived after this baseline was taken and
            # published no count, so a drop is expected and unquantified. Saying
            # "cannot tell" is the honest answer; refusing would be a red the
            # calendar produces, and passing silently would be the defect this
            # whole check exists to remove.
            echo "::warning::kanban-reconcile succeeded at $(cat prev.otherarchiver), after this baseline was recorded. It archives too, so the floor cannot be exact and NO cross-run comparison was made this run (backend#2802)."
          elif [ -n "$prev_total" ]; then
            floor=$((prev_total - archived_now))
            if [ "$declared_total" -lt "$floor" ]; then
              echo "::error::the board reports totalCount=$declared_total, but the previous run saw $prev_total and this run archived only $archived_now -- so at least $((floor - declared_total)) item(s) stopped being visible for a reason that is not archiving. This is a shrunken view, not a smaller board (backend#2802)."
              fail=1
              view_bad=1
            else
              echo "Cross-run: totalCount=$declared_total against a floor of $floor (previous $prev_total - $archived_now archived)."
            fi
          else
            # NOT A PASS, and said out loud. With no baseline the cross-run
            # comparison did not run, so this is the one shape it exists to
            # catch going unchecked -- rule 3, "cannot tell" is a finding. It is
            # a warning rather than a failure only because a first run, and the
            # run after any retention lapse, legitimately has nothing to compare
            # against; a red there would be a red nobody could ever clear.
            echo "::warning::no previous board size was available, so this run could NOT rule out a shrunken view (backend#2802). Its own counts agreeing proves only that they came from the same read."
          fi
          if [ "$view_bad" -eq 0 ]; then
            echo "$declared_total" > board.total
          else
            echo "::warning::not recording a baseline from this run: its own read was incoherent, and enshrining it would ratchet the floor down to meet the defect."
          fi
          # selftest:xrun-end
          {
            echo ""
            echo "| completeness check | value |"
            echo "|---|---|"
            echo "| paginated (re-read) | $reread_total |"
            echo "| server totalCount | $declared_total |"
            echo "| first read | $first_total |"
            echo "| un-archived null Status | $nullst_after |"
            echo "| previous run totalCount | ${prev_total:-none} |"
            echo "| archived this run | $archived_now |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ] || exit 1

      # ONLY ON A PASS -- no `if: always()`. A run whose view shrank must not
      # write its own shrunken total forward as tomorrow's baseline, or the
      # floor ratchets down to meet the defect and the check quietly stops
      # being able to fire. Failing leaves the last TRUSTED count in place, so
      # the comparison keeps pointing at the real board until it is fixed.
      - name: Record this run's board size for the next one
        # `!cancelled()`, not the assert step's success: the decision to record
        # moved INTO that step, where `view_bad` can separate "the board is not
        # clean" from "this run's count cannot be trusted". Gating the upload on
        # the job instead made the red self-sustaining -- see the `view_bad`
        # comment above. `if-no-files-found: ignore` because a refusing run
        # deliberately writes no board.total, and that is the mechanism, not a
        # fault. `always()` is avoided so a cancelled run records nothing.
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: board-baseline
          path: board.total
          if-no-files-found: ignore
          retention-days: 30
