# Weekly guard on repo merge settings (tracebloc/backend#1337).
#
# WHY THIS EXISTS: the fr-gate proves every promoted commit came from a merged
# PR via commits/{sha}/pulls. Rebase-merge creates NEW shas on the base branch
# that this API often cannot associate with any PR, so the gate fails CLOSED on
# legitimately-reviewed code (design-system#88, 2026-07-29, needed an audited
# skip-fr-gate override). All 19 active repos were set to merge+squash only on
# 2026-07-30 — but GitHub defaults allow_rebase_merge to TRUE on repo creation
# and nothing enforces it, so repo number 20 arrives with rebase on. This is
# that enforcement.
#
# It also flags a repo left with NEITHER merge-commit NOR squash, which would
# make it unmergeable — the failure mode the original sweep guarded against.
#
# It also guards delete_branch_on_merge (backend#1981). That setting was off on 10
# of 19 repos, and the org had accumulated 1212 remote branches that were provably
# merged with no open PR. The local half is the part that is easy to miss: we
# squash-merge, so a merged branch is NOT an ancestor of develop — the squashed
# commit is a different commit. `git branch --merged` never lists such a branch and
# `git branch -d` refuses it, so the only reliable local "this is done" signal is
# [gone] on the upstream, which exists ONLY if the server deleted the remote branch
# on merge. With the setting off, no cleanup command can ever reap the branch.
#
# REPORT-ONLY by design. It never PATCHes a repo: a settings change should be a
# visible, deliberate act, and the token then needs no repo-administration
# permission at all (see backend#1343 on over-scoped credentials). The report
# tells you the one command to run.
#
# It does still hold `contents: write`, which looks like a contradiction and is
# not: GitHub returns the four merge-setting fields only to a caller with PUSH
# access, so that grant buys this job a READ it cannot otherwise perform. Measured
# 2026-08-24 -- the mint step below carries the numbers.

name: Merge-settings drift

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC, before the refinement ritual
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the drift report lands on a tracking issue

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Authenticates as the tracebloc-release-train App (backend#2036) instead of
      # one human's PAT. `owner:` yields an ORG-scoped installation token. This
      # workflow only READS merge settings and comments on the tracking issue -- the
      # `gh api -X PATCH` lines in its report are text it PRINTS for a human to run,
      # not calls it makes, so no repo-administration permission is needed or asked
      # for. No fallback to the PAT: a fallback would let a broken App path keep
      # working silently.
      #
      # `contents: write` IS LOAD-BEARING AND IT IS NOT A TYPO. Read this before
      # "fixing" it (backend#2157, measured 2026-08-24).
      #
      # `GET /repos/{owner}/{repo}` returns `allow_merge_commit`,
      # `allow_squash_merge`, `allow_rebase_merge` and `delete_branch_on_merge` ONLY
      # to a caller with PUSH access. For an App installation the push signal is
      # `contents: write`. Everything else is a 200 with those four keys simply
      # ABSENT -- no error, no warning, nothing in the status line to notice.
      #
      # Measured, not reasoned, because the shape of the failure is invisible to a
      # green run. Six token scopes were run against the real endpoint and then this
      # job's own audit loop over all 19 active repos:
      #
      #   contents: write            -> 19 readable, 0 unreadable  (same as the full grant)
      #   contents: read             ->  0 readable, 19 unreadable
      #   administration: read, no contents:write ->  0 readable, 19 unreadable
      #   contents: write, no administration      -> 19 readable, 0 unreadable
      #
      # So `administration: read` is neither necessary NOR sufficient here, which is
      # the opposite of what both this file and the report below used to say, and it
      # is dropped. What the org listing needs (metadata) is implicit.
      #
      # This is the one grant backend#2157 set out to delete everywhere, and this is
      # the one workflow that measurably cannot lose it. Swapping it to `read` does
      # not fail loudly at mint time -- it fails 19 times inside the loop, where the
      # non-boolean guard catches it and reddens the run. Loud, but only after the
      # fact, and only because that guard exists.
      #
      # Still a real narrowing: administration:read, actions:read, checks:read,
      # pull-requests:write and organization-projects:write all go.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write # a READ requirement, not a write one -- read the block above
          permission-issues: write # the drift report comments on backend#1337

      # Needed for repo-inventory.yml, which the listing is cross-checked against
      # below. The sibling audits (caller-drift, standards-sync) check out for the
      # same reason; this one did not, because until backend#2036 it ran as an
      # org-member PAT whose listing was the whole org by construction.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same pin and version as caller-drift/standards-sync. setup-python rather
      # than the system interpreter because a bare `pip install` on the runner
      # hits PEP 668 (externally-managed-environment).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'

      - name: Check every active repo's merge settings
        id: audit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: tracebloc
        run: |
          set -euo pipefail

          # Enumerate by LISTING, never by probing a hard-coded name list: a
          # stale list silently skips new repos, which is exactly the drift
          # this job exists to catch. Forks are excluded along with archives —
          # a fork's merge settings are not ours to police. Written to a file
          # and read line-by-line so a name never goes through word splitting.
          REPOS="$RUNNER_TEMP/repos.txt"
          gh repo list "$ORG" --limit 200 --json name,isArchived,isFork \
            --jq '.[] | select(.isArchived == false and .isFork == false) | .name' \
            | sort > "$REPOS"

          count=$(wc -l < "$REPOS" | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::Enumerated zero repos - the token cannot list the org. Refusing to report 'no drift' from a failed read." >&2
            exit 1
          fi
          echo "Checked $count active repos."

          # A NON-EMPTY LISTING IS NOT A COMPLETE ONE (Bugbot, #278). The zero-repo
          # guard above was sufficient while this ran as an org-member PAT, whose
          # listing was the whole org by construction. An App installation token
          # sees only the repos the installation covers, so narrowing the
          # installation -- or adding a repo to the org and not to the App --
          # silently shrinks the audited set while every remaining repo passes and
          # the job exits green. That is the exact fail-open this audit exists to
          # refuse, reintroduced by the credential change rather than by any logic
          # here.
          #
          # So compare the listing against the DECLARED set. repo-inventory.yml is
          # the contract for which repos exist; any repo it declares that the
          # listing did not return means the listing is incomplete, not that the
          # repo is compliant. Derive from the declaration, never from a
          # hand-maintained second list.
          #
          # A declared repo can also legitimately vanish from the listing by being
          # archived (the filter above drops archives). That is still a finding
          # here: an archived repo carrying an inventory entry is drift someone
          # should look at, and refusing is cheaper than guessing which case it is.
          python3 - "$REPOS" <<'PY'
          import sys, yaml
          listed = {l.strip() for l in open(sys.argv[1]) if l.strip()}
          declared = set(yaml.safe_load(open('repo-inventory.yml'))['repos'])
          absent = sorted(declared - listed)
          if absent:
              print(
                  "::error::the org listing is missing %d repo(s) declared in "
                  "repo-inventory.yml: %s. A partial listing is an incomplete READ, "
                  "not evidence those repos comply - check the App installation "
                  "covers every repo, or that none was archived." % (len(absent), ", ".join(absent)),
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print("Listing covers all %d declared repos." % len(declared))
          PY

          drift=""       # rebase-merge enabled
          unmergeable="" # neither merge-commit nor squash
          nodelete=""    # delete_branch_on_merge disabled
          failed=""      # settings unreadable, or not the booleans we expect

          # `gh api` inherits stdin, which would swallow the repo list; feed it
          # from /dev/null so the loop cannot lose entries.
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            if ! settings=$(gh api "repos/$ORG/$repo" \
                 --jq '[.allow_merge_commit, .allow_squash_merge, .allow_rebase_merge, .delete_branch_on_merge] | @tsv' \
                 < /dev/null 2>/dev/null); then
              echo "  ?? $repo - could not read settings"
              failed="$failed $repo(read)"
              continue
            fi
            merge=$(printf '%s' "$settings" | cut -f1)
            squash=$(printf '%s' "$settings" | cut -f2)
            rebase=$(printf '%s' "$settings" | cut -f3)
            autodelete=$(printf '%s' "$settings" | cut -f4)

            # FAIL CLOSED on anything that is not a literal true/false. These
            # four fields are only returned to a principal with PUSH access to
            # the repo (`contents: write` on an App installation — measured
            # 2026-08-24, backend#2157; it is NOT `administration`, which this
            # comment claimed until then), so a token that can LIST but not read
            # settings gets a perfectly successful response with the keys absent
            # — jq then yields empty strings, which match neither branch below
            # and would have been silently counted as compliant. That is the same
            # false all-clear the zero-repo guard above exists to prevent.
            #
            # If every repo lands in `failed(unreadable)` at once, the token lost
            # `contents: write`, not `administration: read`. That is the whole
            # failure mode, and it looks like a settings problem.
            for value in "$merge" "$squash" "$rebase" "$autodelete"; do
              case "$value" in
                true | false) ;;
                *)
                  echo "  ?? $repo - merge settings missing or non-boolean (does the token have admin here?)"
                  failed="$failed $repo(unreadable)"
                  continue 2
                  ;;
              esac
            done

            # Independent of the merge-method checks below: a repo can have
            # perfectly correct merge methods and still never delete a head
            # branch. Checked with its own `if`, not an `elif`, so a repo that
            # is wrong twice is reported twice.
            if [ "$autodelete" = "false" ]; then
              echo "  !! $repo - delete_branch_on_merge is DISABLED"
              nodelete="$nodelete $repo"
            fi

            if [ "$merge" = "false" ] && [ "$squash" = "false" ] && [ "$rebase" = "false" ]; then
              # Nothing could be merged at all. Reported, never "corrected".
              echo "  !! $repo - NO merge method is enabled"
              unmergeable="$unmergeable $repo"
            elif [ "$rebase" = "true" ]; then
              if [ "$merge" = "false" ] && [ "$squash" = "false" ]; then
                # Rebase is the only way in. Disabling it here would leave the
                # repo unmergeable, so this needs a human to enable merge or
                # squash FIRST — never a blind flip.
                echo "  !! $repo - rebase is the ONLY enabled merge method"
                drift="$drift $repo(rebase-only)"
              else
                echo "  !! $repo - rebase merge is ENABLED"
                drift="$drift $repo"
              fi
            fi
          done < "$REPOS"

          {
            echo "checked=$count"
            echo "drift=${drift# }"
            echo "unmergeable=${unmergeable# }"
            echo "nodelete=${nodelete# }"
            echo "failed=${failed# }"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Merge-settings drift"
            echo ""
            echo "Checked **$count** active repos (archived and forks excluded)."
            echo ""
            if [ -n "$drift" ]; then echo "- Rebase-merge enabled:$drift"; else echo "- Rebase-merge enabled: none"; fi
            if [ -n "$nodelete" ]; then echo "- delete_branch_on_merge disabled:$nodelete"; else echo "- delete_branch_on_merge disabled: none"; fi
            if [ -n "$unmergeable" ]; then echo "- No merge method enabled:$unmergeable"; fi
            if [ -n "$failed" ]; then echo "- Settings unreadable:$failed"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report drift on the tracking issue
        # Only speaks up when something is wrong - a weekly "all clear" comment
        # would train everyone to ignore it (see the design-system Amplify app,
        # backend#1344: five silent failures nobody read).
        if: steps.audit.outputs.drift != '' || steps.audit.outputs.unmergeable != '' || steps.audit.outputs.nodelete != '' || steps.audit.outputs.failed != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRIFT: ${{ steps.audit.outputs.drift }}
          UNMERGEABLE: ${{ steps.audit.outputs.unmergeable }}
          NODELETE: ${{ steps.audit.outputs.nodelete }}
          FAILED: ${{ steps.audit.outputs.failed }}
          CHECKED: ${{ steps.audit.outputs.checked }}
          ORG: tracebloc
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016  # the backticks below are markdown code
          # spans in the issue body, not command substitution - they must stay
          # literal, which is exactly why these printf strings are single-quoted.
          #
          # Each finding gets ONLY its own remediation. A single generic
          # "disable rebase-merge" footer was wrong for two of the three
          # conditions: on an all-methods-disabled repo that PATCH is a no-op
          # that restores nothing, and on an unreadable one the problem is the
          # token, not the setting. An alert whose fix does not match what it
          # detected is worse than no alert.
          {
            printf 'Weekly merge-settings check over **%s** active repos found:\n\n' "$CHECKED"

            if [ -n "$DRIFT" ]; then
              printf '### Rebase-merge is enabled\n\n%s\n\n' "$DRIFT"
              printf 'Rebase-merging rewrites commits into shas that `commits/{sha}/pulls` cannot\n'
              printf 'associate with a PR, so the FR gate fails closed on properly-reviewed code.\n\n'
              printf 'For each repo NOT marked `(rebase-only)`:\n\n'
              printf '```bash\ngh api -X PATCH repos/%s/<repo> -F allow_rebase_merge=false\n```\n\n' "$ORG"
              printf 'A repo marked `(rebase-only)` has rebase as its ONLY merge method — enable\n'
              printf 'merge-commit or squash there FIRST, or you will leave it unmergeable.\n\n'
            fi

            if [ -n "$NODELETE" ]; then
              printf '### delete_branch_on_merge is disabled\n\n%s\n\n' "$NODELETE"
              printf 'Merged head branches are never deleted in these repos, so stale branches\n'
              printf 'accumulate on the server AND become unreapable locally: we squash-merge, so a\n'
              printf 'merged branch is not an ancestor of `develop` and `git branch --merged` will\n'
              printf 'never list it. The only reliable local signal is `[gone]` on the upstream, and\n'
              printf 'that requires the server to have deleted the remote branch (backend#1981).\n\n'
              printf '```bash\ngh api -X PATCH repos/%s/<repo> -F delete_branch_on_merge=true\n```\n\n' "$ORG"
              printf 'This never touches `develop`, `staging`, `main`/`master` (branch protection\n'
              printf 'refuses deletions) nor any branch that is not a merged PR head, such as\n'
              printf '`gh-pages`. Enabling it does not clean up branches that are already stale.\n\n'
            fi

            if [ -n "$UNMERGEABLE" ]; then
              printf '### No merge method is enabled\n\n%s\n\n' "$UNMERGEABLE"
              printf 'Nothing can be merged in these repos at all. Disabling rebase is not the fix\n'
              printf 'here — enable one of the attribution-preserving methods:\n\n'
              printf '```bash\ngh api -X PATCH repos/%s/<repo> -F allow_merge_commit=true\n```\n\n' "$ORG"
            fi

            if [ -n "$FAILED" ]; then
              printf '### Settings could not be read\n\n%s\n\n' "$FAILED"
              printf 'These are NOT known to be compliant. The four merge fields are only returned\n'
              printf 'to a principal with PUSH access, so `(unreadable)` usually means the token\n'
              printf 'lost `contents: write` rather than that anything is misconfigured — and if\n'
              printf 'EVERY repo is listed here, that is certainly what happened (backend#2157).\n'
              printf 'Fix the token permissions (or check the repo still exists), then re-run.\n\n'
            fi

            printf '[Run log](%s)\n' "$RUN_URL"
          } > body.md
          gh issue comment 1337 --repo tracebloc/backend --body-file body.md

      - name: Fail the run when drift was found but not corrected
        # A green run must mean "settings are correct", not merely "the check
        # executed" - otherwise the badge lies.
        if: steps.audit.outputs.failed != '' || steps.audit.outputs.unmergeable != '' || steps.audit.outputs.nodelete != '' || steps.audit.outputs.drift != ''
        run: |
          echo "::error::Merge-settings drift detected and not corrected - see the run summary and the comment on backend#1337."
          exit 1
