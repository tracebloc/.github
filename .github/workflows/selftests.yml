name: Selftests

# EVERY SELFTEST, ON EVERY PR, AS ONE REQUIRED CHECK (backend#1680).
#
# WHY THIS EXISTS. This repo has eight selftest suites and, before this file,
# seven of them ran only from their own path-filtered workflow and NONE was a
# required status check. So a change to `caller-drift.py` ran the caller-drift
# selftest and nothing else, a change to a shared helper ran whichever
# filter happened to match, and a red suite blocked no merge at all.
#
# That is the org's own rule turned on itself: a guard in a non-required job is
# advice, not a gate (backend#1729). These suites guard the reusables every
# other repo's CI depends on -- they are the last place advice is good enough.
#
# NO `paths:` FILTER, DELIBERATELY. Two reasons, and the second is the one that
# bites:
#   1. The suites are cross-cutting. `caller-drift-selftest.py` imports the
#      guard, `kanban-deploy-state-selftest.py` extracts and runs shell out of
#      TWO workflows, and `selftests-cover` reads the Makefile. A filter that
#      names the obvious file misses the edit that actually broke them.
#   2. A REQUIRED check that is path-filtered never reports on a PR the filter
#      skips, so the PR waits at "Expected -- waiting for status" forever. This
#      org has hit that twice (`client#665`, `pii-gate/pii-check`). A required
#      check must run on every PR or not be required.
#
# The whole suite is 34 seconds and 346 assertions, so there is nothing to buy
# by filtering.
#
# `make selftests` is the SAME target a contributor runs and the same one the
# pre-push hook runs, so this job cannot drift from local (backend#1606). It
# depends on `selftests-cover`, which fails if a selftest file exists that no
# target runs -- so adding a suite without wiring it is caught here too.

on:
  pull_request:
  push:
    branches: [develop, staging, main]

concurrency:
  group: selftests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # THE MUTATION TIER IS SHARDED, AND `selftests` STAYS THE ONLY REQUIRED CONTEXT
  # (backend#3157).
  #
  # `make mutations` ran all 15 runners serially, and each runner re-runs its whole
  # selftest suite once per mutation row -- so the job's wall time grew with every
  # row added anywhere in the fleet, with nothing about adding a row making that
  # visible. Measured on the `mutation-check` step on develop: 3m08s (Sep 2) ->
  # 9m03s (Sep 3) -> 9m26s (Sep 4), the last one taking the job to 10m13s and being
  # CANCELLED on its timeout -- on develop's own tip (a57b3960, the #409 merge), so a
  # REQUIRED check was red on the default branch. #410 raised the bound to 25 as a
  # stopgap and said to shard rather than bid the number up if it recurred.
  #
  # WHY NOT A NEW REQUIRED CONTEXT. Two jobs below produce new contexts, and neither
  # is required -- deliberately. A new required context has to be armed by hand in
  # branch protection, and `LukasWodka` is the sole org admin, so "arm it later" is a
  # single point of failure rather than a plan. Instead the shards' verdict is
  # enforced through the EXISTING `selftests` context by the fan-in step in that job:
  # branch protection needs no change, and an unarmed shard context cannot matter,
  # because a red shard reds `selftests`.
  #
  # WHY THE FAN-IN CANNOT BE A BARE `needs:`. GitHub reports a SKIPPED required check
  # as success, and a job whose `needs` failed is skipped -- so a bare dependency
  # would turn a red shard into a green `selftests`. That is this repo's own
  # promote.yml lesson (backend#1424): "A failing STEP is red and auditable; a
  # skipped job would report green and hide the denial." Hence `if: always()` on
  # `selftests` plus an explicit result assertion, with `skipped` and `cancelled`
  # treated as failures rather than as the absence of a finding.
  mutation-matrix:
    name: mutation shard list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.derive.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Ask make for MUTATION_TARGETS
        id: derive
        run: |
          set -euo pipefail
          # ASKED OF MAKE, never restated here. A hand-written matrix would be a
          # second copy of MUTATION_TARGETS, and the drift is silent in the worst
          # direction: the runner that fell off still has a green `selftests` beside
          # it (.github#300, twice). See the Makefile target's own comment.
          mapfile -t targets < <(make --no-print-directory print-mutation-targets)
          # FAIL CLOSED ON EMPTY. Zero shards means the matrix job never runs, and
          # "nothing to check" must not read as "everything passed".
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::derived NO mutation targets from the Makefile. Refusing to" \
                 "report a sharded tier that would run nothing." >&2
            exit 1
          fi
          for t in "${targets[@]}"; do
            case "$t" in
              mutation-*) ;;
              *)
                echo "::error::'${t}' is not a mutation-* target. The derivation read" \
                     "something other than MUTATION_TARGETS; refusing to build a" \
                     "matrix from it." >&2
                exit 1 ;;
            esac
          done
          printf 'derived %d shard(s):\n' "${#targets[@]}"
          printf '  %s\n' "${targets[@]}"
          shards="$(printf '%s\n' "${targets[@]}" | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"

  mutation-shard:
    # One runner per job. `fail-fast: false` so a red shard does not cancel the
    # others -- the whole point is to learn about every failure in one run, and a
    # cancelled sibling is indistinguishable from a passing one in the fan-in.
    name: mutation ${{ matrix.target }}
    needs: mutation-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.mutation-matrix.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install what the suites need
        run: |
          python -m pip install --quiet 'pyyaml==6.0.2'

      - name: make ${{ matrix.target }}
        env:
          # Through env, never interpolated into the run line. The values come from
          # our own Makefile, but a matrix value spliced into a shell command is the
          # shape that stops being safe the moment the source changes.
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            mutation-*) ;;
            *) echo "::error::refusing to run '${TARGET}': not a mutation-* target." >&2; exit 1 ;;
          esac
          make "$TARGET"

  selftests:
    name: selftests
    # The mutation tier runs in the shards above; this job asserts their verdict, so
    # `selftests` remains the single required context for the whole tier.
    needs: [mutation-matrix, mutation-shard]
    # `always()`, or a failed shard would SKIP this job and GitHub would report the
    # skipped required check as success (backend#1424).
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # FIRST, so a red shard fails this job before spending a minute on the rest.
      # Every non-success result is a failure here, `skipped` and `cancelled`
      # included: a shard that did not report is not a shard that passed.
      - name: mutation tier — every shard succeeded (fan-in)
        env:
          MATRIX_RESULT: ${{ needs.mutation-matrix.result }}
          SHARDS_RESULT: ${{ needs.mutation-shard.result }}
        run: |
          set -euo pipefail
          rc=0
          for pair in "mutation-matrix:${MATRIX_RESULT}" "mutation-shard:${SHARDS_RESULT}"; do
            job="${pair%%:*}"; res="${pair#*:}"
            if [ "$res" != "success" ]; then
              echo "::error::${job} reported '${res}', not success — the mutation tier" \
                   "did not pass. This context stays red so a failed shard cannot merge" \
                   "behind a green required check (backend#1424)." >&2
              rc=1
            fi
          done
          [ "$rc" -eq 0 ] || exit 1
          echo "mutation tier: matrix derived and every shard succeeded."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install what the suites need
        # PyYAML only -- the suites stub every network seam, so nothing else is
        # required. Pinned to the version repo-inventory.yml's own guard uses.
        run: python -m pip install --quiet 'pyyaml==6.0.2'
      - name: make selftests
        run: make selftests

      # THE PRODUCTION AUDIT, in a REQUIRED context (Bugbot, #287).
      #
      # `mint-scope` was wired only into `make lint`, which CI does not run -- so a
      # new unscoped `create-github-app-token` mint could merge while `selftests`
      # stayed green, because `selftests` runs the FIXTURE suite and never the real
      # audit. A guard in a non-required job is advice, and this one was not even in
      # a job. That is the exact failure mode CLAUDE.md's own rule 2 names, shipped
      # in the PR that added the guard.
      #
      # HERE RATHER THAN A NEW JOB, on purpose: `selftests` is ALREADY a required
      # context on develop/staging/main, so this arms the gate with no
      # branch-protection edit -- and never landing a red gate is the other half of
      # the same rule. A new context would sit unrequired until someone armed it,
      # which is how a guard ends up advisory.
      #
      # BOTH HALVES RUN, and they answer different questions: the fixture suite proves
      # the rule CATCHES, this proves the fleet COMPLIES. Passing one while failing
      # the other is possible in both directions. (No case count here on purpose --
      # `mint-scope` prints its own, and a tally in prose is what backend#1729 is
      # cited for.)
      - name: mint-scope (the real workflows, not fixtures)
        run: make mint-scope

      # THE SAME GAP, IN THE PR THAT ADDED THE GUARD (@saadqbal on #388).
      #
      # `reusable-no-cancel` shipped wired only into `make lint`, exactly like
      # `mint-scope` before #287 -- so the fixture suite and the mutation tier were
      # armed and the audit of the REAL workflows was not. A reusable could be added
      # with `cancel-in-progress: true`, or this one flipped back, and merge green.
      #
      # Third time this repo has closed this shape: mint-scope (#287), `make
      # mutations` (.github#300), reason-citations (backend#2449). Same reasoning,
      # same placement -- `selftests` is already required on develop/staging/main, so
      # this arms it without a branch-protection edit and without landing a red gate.
      - name: reusable-no-cancel (the real workflows, not fixtures)
        run: make reusable-no-cancel

      # THE CLASS, not the instance. The comment above is the fourth of its shape in
      # this repo, so the rule stops being a paragraph people are asked to remember:
      # `lint-targets-run-in-ci` derives lint's prerequisites and CI's `make`
      # invocations and fails when a live audit is reachable from neither.
      - name: every live audit in `make lint` is reachable from CI
        run: make lint-targets-run-in-ci

      # THE MUTATION TIER, in the SAME already-required context (backend#1788).
      #
      # `house-rules` is a required status check on develop, staging AND prod across
      # 16 repos, and until #291 nothing tested it at all. The selftest above says the
      # matcher works; this says the selftest would NOTICE if it stopped -- and it
      # earned that distinction on its first run, catching two cases that passed the
      # whole suite while the rule they described was broken.
      #
      # SAME REASONING AS THE STEP ABOVE, arrived at independently in two PRs: a new
      # context sits unrequired until somebody arms it. Measured at ~58s (each
      # mutation re-runs the ~3s suite), which is affordable on a runner and is why
      # `make check` only resolves the anchors.
      # BY THE LIST, NOT BY ONE MEMBER OF IT. This step named
      # `mutation-house-rules` directly, so when a second runner was added to
      # MUTATION_TARGETS it satisfied `selftests-cover` -- which asks make what
      # that list would run -- while never executing here. Covered on paper,
      # unrun in fact (Bugbot, .github#300). `make mutations` is the list.
      # THE INVENTORY'S CITATIONS, in the SAME already-required context
      # (backend#2449).
      #
      # `repo-inventory.yml` exemption reasons cite tickets, and nothing read
      # them: `caller-drift.py` enforces staleness on the ENTRY and never on the
      # sentence explaining it. So a reason could say "sequenced behind
      # backend#1408" for the eighteen days after that issue closed, with the
      # audit green throughout. `make reason-citations` fails when a cited issue
      # is closed, or a cited PR was closed without merging.
      #
      # HERE RATHER THAN A NEW JOB OR A NEW WORKFLOW, for the two reasons the
      # steps above were: `selftests` is ALREADY a required context on
      # develop/staging/main, so this arms the check with no branch-protection
      # edit, and a new context would sit unrequired until somebody armed it --
      # which is how a guard ends up advisory. A new REUSABLE would also need its
      # own repo-inventory.yml row in every repo, serialising against every other
      # guarded-file PR in this single-writer repo.
      #
      # BOTH HALVES RUN, exactly as for mint-scope: `make selftests` runs the
      # FIXTURE suite, which proves the rule catches, and this proves the live
      # inventory complies. Either can pass while the other fails.
      #
      # THE TOKEN IS ORG-WIDE ON PURPOSE, which is the opposite of the narrowing
      # `add-to-kanban.yml` argues for and for a stated reason: the reasons in
      # repo-inventory.yml cite tickets in `backend`, `client`, `client-runtime`,
      # `model-zoo`, `data-ingestors`, `release-train` and `.github`. A token
      # scoped with `repositories:` to this repo would resolve NONE of those, and
      # the check would report "cannot tell" on almost every citation. Read-only
      # in both scopes, and it writes nothing.
      #
      # FAIL CLOSED ON A MISSING SECRET, which also means this step fails on a
      # PR from a FORK, where GitHub withholds secrets. That is the correct
      # answer for a required check whose whole contract is that it never reports
      # clean from a read it could not make -- and `add-to-kanban.yml` already
      # carries the same property in this repo.
      - name: Mint a read-only token for the citation check
        id: citation-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: read
          permission-pull-requests: read

      - name: reason-citations (the live inventory, not fixtures)
        env:
          GH_TOKEN: ${{ steps.citation-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::the citation token is empty. Without it every citation" \
                 "reads as unresolvable, and this check must not report clean from" \
                 "a read it could not make." >&2
            exit 1
          fi
          make reason-citations

