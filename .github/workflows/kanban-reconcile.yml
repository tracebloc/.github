name: Kanban reconcile

# Weekly self-healing backstop for the engineer kanban (project #2).
#
# Catches stalls and drift that the event-driven workflows
# (advance-deploy-env, kanban-closure-router) silently miss:
#
#   1. Drift to Prod  - items in RfP / FR-on-staging / FR-on-dev / Code review
#                       whose merge SHA is already on the repo's prod branch.
#                       Cause: the push event was missed, or the deploy
#                       happens out-of-band (e.g. averaging-service deploys
#                       a Docker image from staging without ever pushing main).
#
#   2. Cancelled  - closed-not-merged PRs sitting in non-terminal columns.
#
#   3. Misplaced open issues - open issues that drifted into a post-merge
#                              column (RfP, FR-on-*, Ready-for-staging).
#                              Move back to Backlog.
#
#   4. Missing from board - open or recently-merged PRs/issues that were never
#                           added by the event-driven add-to-kanban workflow.
#                           That workflow is fire-and-forget (one shot on
#                           'opened', no retry), so a single dropped webhook
#                           leaves a permanent silent gap that nothing else
#                           catches. We sweep every board-tracked repo, find
#                           items with no project #2 entry, and add them in a
#                           sensible starting column. Archived items count as
#                           present, so the daily archiver is never fought.
#
#   5. Closed-issue terminalize - a CLOSED issue in any non-terminal column.
#                       The closure-router only moves issues closed by a linked
#                       PR (and misses even those to a close-time race), and
#                       never moves hand-closed ones -- so completed issues pile
#                       up wherever they were. Route by state_reason:
#                       not_planned/duplicate -> Cancelled, else -> Prod.
#
# Safety cap: if the script would move > 100 items OR add > 60 items in one
# run, it aborts and reports - that's almost certainly a bug, not real drift.

on:
  schedule:
    - cron: '0 4 * * 1'  # 04:00 UTC Mondays — weekly backstop (event-driven flows are the primary path)
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Log moves without applying them"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kanban-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_KANBAN_TOKEN }}
      ORG: tracebloc
      PROJECT_NUMBER: 2
      DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
      MAX_MOVES: 100
    steps:
      - name: Resolve project + field/option IDs
        id: ids
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          PROJ=$(gh api graphql -f query='
            query($org: String!, $num: Int!) {
              organization(login: $org) {
                projectV2(number: $num) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id name options { id name }
                      }
                    }
                  }
                }
              }
            }' -F org="$ORG" -F num="$PROJECT_NUMBER")

          PROJECT_ID=$(echo "$PROJ" | jq -r '.data.organization.projectV2.id')
          STATUS_FIELD=$(echo "$PROJ" | jq -r '.data.organization.projectV2.fields.nodes[] | select(.name=="Status") | .id')
          opt() {
            echo "$PROJ" | jq -r --arg n "$1" '.data.organization.projectV2.fields.nodes[]
              | select(.name=="Status") | .options[] | select(.name==$n) | .id'
          }
          {
            echo "project_id=$PROJECT_ID"
            echo "status_field=$STATUS_FIELD"
            echo "prod_opt=$(opt Prod)"
            echo "done_opt=$(opt Done)"
            echo "cancelled_opt=$(opt Cancelled)"
            echo "backlog_opt=$(opt Backlog)"
            echo "code_review_opt=$(opt 'Code review')"
            echo "in_progress_opt=$(opt 'In progress')"
            echo "on_dev_opt=$(opt 'On dev')"
            echo "fr_staging_opt=$(opt 'FR on staging')"
          } >> "$GITHUB_OUTPUT"

      - name: Pull non-terminal items
        run: |
          set -euo pipefail
          : > items.ndjson
          cursor="null"
          while :; do
            if [ "$cursor" = "null" ]; then
              # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
              OUT=$(gh api graphql -f query='
                query($org: String!, $num: Int!) {
                  organization(login: $org) {
                    projectV2(number: $num) {
                      items(first: 100) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          id
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue { name }
                          }
                          content {
                            __typename
                            ... on PullRequest {
                              number title state mergedAt baseRefName headRefName
                              mergeCommit { oid }
                              repository { name defaultBranchRef { name } }
                            }
                            ... on Issue {
                              number title state stateReason
                              repository { name defaultBranchRef { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }' -F org="$ORG" -F num="$PROJECT_NUMBER")
            else
              # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
              OUT=$(gh api graphql -f query='
                query($org: String!, $num: Int!, $c: String!) {
                  organization(login: $org) {
                    projectV2(number: $num) {
                      items(first: 100, after: $c) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          id
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue { name }
                          }
                          content {
                            __typename
                            ... on PullRequest {
                              number title state mergedAt baseRefName headRefName
                              mergeCommit { oid }
                              repository { name defaultBranchRef { name } }
                            }
                            ... on Issue {
                              number title state stateReason
                              repository { name defaultBranchRef { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }' -F org="$ORG" -F num="$PROJECT_NUMBER" -F c="$cursor")
            fi
            # We also pull the planning columns (Backlog / In progress / No status
            # / Ready / North Stars) so that (a) closed promotion-PR cards hiding
            # there can be archived and (b) CLOSED issues stranded there get
            # terminalized. Classify leaves everything else in them untouched.
            echo "$OUT" | jq -c '.data.organization.projectV2.items.nodes[]
              | select((.fieldValueByName.name // "No status") as $s
                       | ["Code review","On dev",
                          "FR on staging","Ready for prod",
                          "Backlog","In progress","No status",
                          "Ready","North Stars"] | index($s))' \
              >> items.ndjson

            HAS_NEXT=$(echo "$OUT" | jq -r '.data.organization.projectV2.items.pageInfo.hasNextPage')
            cursor=$(echo "$OUT" | jq -r '.data.organization.projectV2.items.pageInfo.endCursor')
            [ "$HAS_NEXT" = "true" ] || break
          done
          echo "Found $(wc -l < items.ndjson) non-terminal items to evaluate"

      - name: Classify + plan moves
        id: plan
        run: |
          set -euo pipefail
          : > moves.tsv
          : > skip.tsv

          declare -A PROD_BRANCH_CACHE
          resolve_prod_branch() {
            local repo="$1" default_branch="$2"
            if [ -n "${PROD_BRANCH_CACHE[$repo]:-}" ]; then
              echo "${PROD_BRANCH_CACHE[$repo]}"; return
            fi
            # Prod is conventionally main or master. Probe those directly instead
            # of trusting a repo-controlled .kanban.yml override: a repo could
            # commit `branch_status_map: {develop: Prod}` and self-grant prod
            # status to every develop merge (D27-L4). Read from the repo, not a
            # file the PR author controls. Fall back to the default branch only
            # if neither main nor master exists.
            local branch="$default_branch"
            if gh api "/repos/$ORG/$repo/branches/main" --jq '.name' >/dev/null 2>&1; then
              branch="main"
            elif gh api "/repos/$ORG/$repo/branches/master" --jq '.name' >/dev/null 2>&1; then
              branch="master"
            fi
            PROD_BRANCH_CACHE[$repo]="$branch"
            echo "$branch"
          }

          sha_on_branch() {
            local repo="$1" branch="$2" sha="$3"
            { [ -z "$sha" ] || [ "$sha" = "null" ]; } && return 1
            local status
            status=$(gh api "/repos/$ORG/$repo/compare/$branch...$sha" \
                     --jq '.status' 2>/dev/null) || return 1
            [ "$status" = "behind" ] || [ "$status" = "identical" ]
          }

          PROD_OPT="${{ steps.ids.outputs.prod_opt }}"
          DONE_OPT="${{ steps.ids.outputs.done_opt }}"
          CANCELLED_OPT="${{ steps.ids.outputs.cancelled_opt }}"
          BACKLOG_OPT="${{ steps.ids.outputs.backlog_opt }}"
          # Needed by the router-miss backstop below: when the closure router failed to
          # set a stage, this step derives it from the closing PR's base branch.
          ON_DEV_OPT="${{ steps.ids.outputs.on_dev_opt }}"
          FR_STAGING_OPT="${{ steps.ids.outputs.fr_staging_opt }}"

          while IFS= read -r line; do
            ITEM_ID=$(echo "$line"  | jq -r '.id')
            COL=$(echo "$line"      | jq -r '.fieldValueByName.name // "No status"')
            TYPE=$(echo "$line"     | jq -r '.content.__typename')
            REPO=$(echo "$line"     | jq -r '.content.repository.name')
            DEFAULT=$(echo "$line"  | jq -r '.content.repository.defaultBranchRef.name // "main"')
            NUM=$(echo "$line"      | jq -r '.content.number')

            if [ "$TYPE" = "PullRequest" ]; then
              STATE=$(echo "$line" | jq -r '.content.state')
              SHA=$(echo "$line"   | jq -r '.content.mergeCommit.oid // ""')
              HEADREF=$(echo "$line" | jq -r '.content.headRefName // ""')

              # Release-train promotion PRs are plumbing, not work items: the
              # fr-gate ignores them and the membership sweep never adds them.
              # Archive the card once the PR is no longer open; leave open ones
              # alone (the train manages them).
              if [ "${HEADREF#release-train/}" != "$HEADREF" ]; then
                if [ "$STATE" = "OPEN" ]; then
                  printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "-" "$REPO#$NUM open promotion PR (train-managed)" "waiting" >> skip.tsv
                else
                  printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "ARCHIVE" "$REPO#$NUM promotion PR card ($COL -> archive)" "archive-promotion" >> moves.tsv
                fi
                continue
              fi

              # Pre-merge columns are pulled only for the promotion-PR archive
              # above -- leave everything else in them to the event-driven flows.
              case "$COL" in
                "Backlog"|"In progress"|"No status")
                  printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "-" "$REPO#$NUM PR in $COL (pre-merge, no action)" "no-action" >> skip.tsv
                  continue ;;
              esac

              if [ "$STATE" = "CLOSED" ]; then
                printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "$CANCELLED_OPT" "$REPO#$NUM closed-not-merged ($COL)" "cancelled" >> moves.tsv
                continue
              fi

              if [ "$STATE" = "MERGED" ] && [ -n "$SHA" ]; then
                PROD=$(resolve_prod_branch "$REPO" "$DEFAULT")
                if sha_on_branch "$REPO" "$PROD" "$SHA"; then
                  printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "$PROD_OPT" "$REPO#$NUM SHA on $PROD ($COL -> Prod)" "drift-to-prod" >> moves.tsv
                  continue
                fi
              fi
              printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "-" "$REPO#$NUM PR in $COL (legit waiting)" "waiting" >> skip.tsv
              continue
            fi

            if [ "$TYPE" = "Issue" ]; then
              STATE=$(echo "$line" | jq -r '.content.state')
              SR=$(echo "$line"    | jq -r '.content.stateReason // ""')

              # A CLOSED issue in ANY non-terminal column is stale clutter. The
              # closure-router only moves issues closed by a linked PR (and can
              # miss even those to a close-time race), and never moves hand-closed
              # ones -- so completed issues pile up wherever they were closed.
              # Terminalize by reason: not_planned / duplicate -> Cancelled,
              # otherwise (completed / unspecified) -> Prod. Safe now that
              # fr-gate.yml attributes promotions via commits->PRs, so a card
              # parked in Prod cannot satisfy the gate.
              if [ "$STATE" = "CLOSED" ]; then
                if [ "$SR" = "NOT_PLANNED" ] || [ "$SR" = "DUPLICATE" ]; then
                  printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "$CANCELLED_OPT" "$REPO#$NUM closed issue $SR ($COL -> Cancelled)" "cancelled" >> moves.tsv
                else
                  # Done means "completed, nothing deployed" (D8), so it needs TWO things
                  # to be true: the card carries no deploy state, AND nothing closed it.
                  # A closed-completed issue already sitting in a deploy column got there
                  # from a real deploy signal -- so Done would
                  # assert nothing shipped about work that did, and would overwrite what
                  # kanban-closure-router correctly set (Bugbot, .github#126).
                  #
                  # D8's routing for those is "follow the PR's stage", i.e. leave them.
                  # That does leave a closed card in a non-terminal column, which D8's
                  # third invariant forbids -- the two rules genuinely conflict for work
                  # that shipped to dev/staging and then stopped. Asserting something
                  # false is the worse of the two, so this reports and moves on; the
                  # conflict is flagged on backend#1411 for a human to settle.
                  case "$COL" in
                    "On dev"|"FR on staging"|"Ready for prod"|"Prod")
                      echo "  [SKIP] $REPO#$NUM closed-completed in $COL - a deploy state, so NOT Done; D8 says follow the PR's stage"
                      ;;
                    *)
                      # The column is NOT sufficient evidence on its own. It was the only
                      # check here until now, and it is circular: the column is exactly
                      # what is wrong when kanban-closure-router misses a close -- its
                      # closer lookup can fail, in which case it deliberately leaves
                      # Status alone and the card stays wherever it was. Asserting Done
                      # off that column claims "nothing deployed" about work that shipped,
                      # and kanban-archive then hides it (Bugbot, .github#127).
                      #
                      # So ask the question directly: is there a closer? Only a genuinely
                      # closer-less issue is "completed, nothing deployed".
                      # shellcheck disable=SC2016  # $names are GraphQL variables
                      CLOSER=$(gh api graphql -f query='
                        query($org: String!, $repo: String!, $num: Int!) {
                          repository(owner: $org, name: $repo) {
                            issue(number: $num) {
                              timelineItems(last: 10, itemTypes: [CLOSED_EVENT]) {
                                nodes { ... on ClosedEvent {
                                  closer { __typename ... on PullRequest { baseRefName } }
                                } }
                              }
                            }
                          }
                        }' -F org="$ORG" -F repo="$REPO" -F num="$NUM" \
                        --jq '((.data.repository.issue.timelineItems.nodes // []) | last) as $e
                              | if $e == null then "NOEVENT|"
                                else (($e.closer.__typename // "NONE") + "|" + ($e.closer.baseRefName // "")) end' \
                        2>/dev/null) || CLOSER="ERROR|"
                      CLOSER_BASE="${CLOSER#*|}"
                      CLOSER="${CLOSER%%|*}"
                      case "$CLOSER" in
                        # NONE means the timeline HAD a ClosedEvent and its closer was
                        # null -- an actual hand-close. "No ClosedEvent at all" is
                        # NOEVENT, and a null issue or repository is too; those five
                        # shapes were one token until Bugbot flagged it on .github#127.
                        # NOEVENT falls through to the SKIP below, where absence of
                        # evidence belongs.
                        NONE)
                          printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "$DONE_OPT" "$REPO#$NUM closed issue completed, no closer ($COL -> Done)" "closed-issue-terminalized" >> moves.tsv
                          ;;
                        PullRequest|Commit)
                          # It shipped somewhere, and the card is NOT in a deploy column --
                          # exactly the router-miss this job exists to backstop.
                          #
                          # Skipping was wrong: the card is closed, sitting in an active
                          # column, and archive only takes terminal ones -- so it stayed
                          # there permanently. That is the invariant this job enforces,
                          # broken by the job itself (Bugbot, .github#127).
                          #
                          # So do what the router failed to do: derive the stage from the
                          # closer. The mapping is IDENTICAL to kanban-closure-router.yml's,
                          # deliberately -- when the two disagree the faster one wins and the
                          # slower one silently undoes it, which was Bugbot's third finding
                          # on .github#126.
                          case "$CLOSER_BASE" in
                            main|master) OPT="$PROD_OPT";       DEST="Prod" ;;
                            staging)     OPT="$FR_STAGING_OPT"; DEST="FR on staging" ;;
                            develop)     OPT="$ON_DEV_OPT";     DEST="On dev" ;;
                            # A Commit closer carries no base ref, and an unrecognised base
                            # takes the router's same default: start at On dev and let a
                            # later deploy signal promote it.
                            *)           OPT="$ON_DEV_OPT";     DEST="On dev" ;;
                          esac
                          printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "$OPT" "$REPO#$NUM closed by $CLOSER (base=${CLOSER_BASE:-none}), router missed it ($COL -> $DEST)" "closed-issue-stage-derived" >> moves.tsv
                          ;;
                        NOEVENT)
                          # The read succeeded and the timeline carried no ClosedEvent at
                          # all. Silence is not a hand-close, so it is not Done either.
                          echo "  [SKIP] $REPO#$NUM closed-completed but its timeline carries no ClosedEvent - no evidence either way, so NOT Done"
                          ;;
                        *)
                          # Unreadable. Not evidence of absence.
                          echo "  [SKIP] $REPO#$NUM closed-completed but the closer lookup failed ($CLOSER) - refusing to assert Done"
                          ;;
                      esac
                      ;;
                  esac
                fi
                continue
              fi

              # OPEN issue in a pre-merge / planning column: it belongs there (or
              # the event flows handle it) -> no action.
              case "$COL" in
                "Backlog"|"In progress"|"No status"|"Ready"|"North Stars")
                  printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "-" "$REPO#$NUM open issue in $COL (no action)" "no-action" >> skip.tsv
                  continue ;;
              esac

              # OPEN issue that drifted into a post-merge column -> back to Backlog.
              case "$COL" in
                "Ready for prod"|"FR on staging"|"On dev")
                  printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "$BACKLOG_OPT" "$REPO#$NUM open issue in $COL -> Backlog" "misplaced-issue" >> moves.tsv
                  continue ;;
              esac
              printf '%s\t%s\t%s\t%s\n' "$ITEM_ID" "-" "$REPO#$NUM issue in $COL (no action)" "no-action" >> skip.tsv
            fi
          done < items.ndjson

          PLANNED=$(wc -l < moves.tsv | tr -d ' ')
          echo "planned=$PLANNED" >> "$GITHUB_OUTPUT"
          echo "Planned moves: $PLANNED"
          echo "::group::Planned moves"
          column -t -s$'\t' moves.tsv || cat moves.tsv
          echo "::endgroup::"

          if [ "$PLANNED" -gt "$MAX_MOVES" ]; then
            echo "::error::$PLANNED moves exceeds MAX_MOVES=$MAX_MOVES - aborting. Investigate."
            exit 1
          fi

      - name: Apply moves
        if: steps.plan.outputs.planned != '0' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          PROJECT_ID="${{ steps.ids.outputs.project_id }}"
          STATUS_FIELD="${{ steps.ids.outputs.status_field }}"
          ok=0; fail=0
          # `label` is field 4 of moves.tsv (the move category, consumed by awk in the
          # Per-label summary step). It is read here only so that `read` does not fold
          # field 4 into $reason - without a trailing variable the [OK]/[FAIL] lines
          # below would print "<reason><TAB><label>". Deliberately unused in this step.
          # shellcheck disable=SC2034
          while IFS=$'\t' read -r itemId optId reason label; do
            [ "$optId" = "-" ] && continue
            if [ "$optId" = "ARCHIVE" ]; then
              # `2>&1 >/dev/null` keeps stderr (the API error) and drops the mutation
              # payload, which we never read. Ordered the other way round it would
              # throw away the only diagnostic a [FAIL] line has to offer.
              # shellcheck disable=SC2016  # GraphQL variables, not shell - keep literal
              if err=$(gh api graphql -f query='
                  mutation($p: ID!, $i: ID!) {
                    archiveProjectV2Item(input: {projectId: $p, itemId: $i}) {
                      item { id }
                    }
                  }' -F p="$PROJECT_ID" -F i="$itemId" 2>&1 >/dev/null); then
                echo "[OK]   $reason"
                ok=$((ok+1))
              else
                echo "[FAIL] $reason: $err"
                fail=$((fail+1))
              fi
              continue
            fi
            # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
            if err=$(gh api graphql -f query='
                mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $p, itemId: $i, fieldId: $f,
                    value: {singleSelectOptionId: $o}
                  }) { projectV2Item { id } }
                }' -F p="$PROJECT_ID" -F i="$itemId" -F f="$STATUS_FIELD" -f o="$optId" \
                2>&1 >/dev/null); then
              echo "[OK]   $reason"
              ok=$((ok+1))
            else
              echo "[FAIL] $reason: $err"
              fail=$((fail+1))
            fi
          done < moves.tsv
          echo ""
          echo "=== Applied: $ok ok, $fail failed ==="

          # Fail closed. Every [FAIL] above is a card left in the column this pass
          # decided was wrong, so the drift the run was supposed to remove survives
          # it. Tomorrow's pass re-plans the identical move and, on a persistent
          # cause (revoked project write, deleted Status option), fails identically
          # - forever, invisibly, while the schedule reports success. The counters
          # were already here; only the assertion was missing. Same shape as the
          # RUN_FAILED assertion in advance-deploy-env.yml.
          if [ "$fail" -ne 0 ]; then
            echo "::error::$fail of $((ok+fail)) planned move(s) failed to apply (see [FAIL] lines above)."
            exit 1
          fi

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        run: |
          echo "DRY RUN - no moves applied."
          echo "$(wc -l < moves.tsv | tr -d ' ') moves were planned (see prior step)."

      - name: Per-label summary
        if: always() && steps.plan.outputs.planned != '0'
        run: |
          {
            echo "## Reconcile summary"
            echo ""
            echo "Planned: ${{ steps.plan.outputs.planned }} | Dry run: $DRY_RUN"
            echo ""
            echo "### Counts by label"
            awk -F'\t' '{print $4}' moves.tsv | sort | uniq -c | sort -rn \
              | awk '{print "- **"$2"**: "$1}'
            echo ""
            echo "### Individual moves"
            awk -F'\t' '{print "- "$3" -> `"$4"`"}' moves.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Discover + add items missing from the board
        id: membership
        # Independent of the status-reconcile steps above: run even when classify
        # or apply failed (e.g. a MAX_MOVES abort) so missing-board gaps still
        # heal. Needs only the resolved ids; has its own MAX_ADDS runaway guard.
        if: always() && steps.ids.outcome == 'success'
        env:
          LOOKBACK_DAYS: 21
          MAX_ADDS: 60
          # Lower bound on the discovered sweep scope. 1 is deliberately loose - it
          # is a "did we look at anything at all" tripwire, not a coverage target,
          # so it never fires when a repo legitimately opts out of the board.
          MIN_SCOPE: 1
        run: |
          set -euo pipefail

          PROJECT_ID="${{ steps.ids.outputs.project_id }}"
          STATUS_FIELD="${{ steps.ids.outputs.status_field }}"
          BACKLOG_OPT="${{ steps.ids.outputs.backlog_opt }}"
          CODE_REVIEW_OPT="${{ steps.ids.outputs.code_review_opt }}"
          IN_PROGRESS_OPT="${{ steps.ids.outputs.in_progress_opt }}"
          ON_DEV_OPT="${{ steps.ids.outputs.on_dev_opt }}"
          FR_STAGING_OPT="${{ steps.ids.outputs.fr_staging_opt }}"
          PROD_OPT="${{ steps.ids.outputs.prod_opt }}"

          SINCE=$(date -u -d "${LOOKBACK_DAYS} days ago" +%Y-%m-%d)
          echo "Merged-PR lookback since $SINCE"

          # Scope = repos that opt into the board (have the add-to-kanban caller).
          # Self-maintaining: mirrors add-to-kanban's coverage exactly, so we never
          # pull in repos that deliberately don't track (e.g. release-train's own PRs).
          mapfile -t ALL < <(gh api "orgs/$ORG/repos?per_page=100&type=all" --paginate \
                               --jq '.[] | select(.archived==false) | .name')
          SCOPE=()
          for r in "${ALL[@]}"; do
            # Read the HTTP status rather than just gh's exit code. Exit-code-only
            # made 404 ("this repo does not opt into the board" - the answer we
            # want) indistinguishable from 403 / 429 / 5xx ("we could not find
            # out"), and both silently dropped the repo from SCOPE. A repo out of
            # scope is never swept, so its drift becomes invisible while the run
            # still reports success. `-i --silent` returns headers without the
            # base64 file body; on a transport failure there is no status line at
            # all, which lands in the fatal branch - correctly, since that is also
            # "we could not find out".
            probe=$(gh api -i --silent \
                      "repos/$ORG/$r/contents/.github/workflows/add-to-kanban.yml" 2>/dev/null) || true
            http=$(awk 'NR==1 {print $2}' <<<"$probe")
            case "$http" in
              2??) SCOPE+=("$r") ;;
              404) ;;  # genuinely not tracked - the one benign non-2xx
              *)   echo "::error::Could not determine board tracking for $ORG/$r (HTTP ${http:-none}) - refusing to silently drop it from scope."
                   exit 1 ;;
            esac
          done
          echo "Board-tracked repos (${#SCOPE[@]}): ${SCOPE[*]}"

          # Floor assertion. Everything below is a per-repo sweep, so an empty scope
          # produces a flawless green run that inspected nothing: "Missing from
          # board: 0" is emitted identically whether nothing is missing or nothing
          # was looked at. The MAX_ADDS ceiling only catches the opposite failure
          # (everything looks missing). This catches the quiet one - e.g. the repo
          # listing above returning nothing, or the token losing org-wide contents
          # read - where zero is an absence of evidence, not evidence of health.
          if [ "${#SCOPE[@]}" -lt "$MIN_SCOPE" ]; then
            echo "::error::Board-tracked scope is ${#SCOPE[@]} repo(s), below MIN_SCOPE=$MIN_SCOPE - refusing to report a clean sweep over an empty scope. Check PROJECTS_KANBAN_TOKEN still has org-wide contents:read."
            exit 1
          fi

          # Find open + recently-merged items NOT already on project #2.
          # projectItems' includeArchived defaults to true, so an archived card counts
          # as present and we never re-add something the daily archiver removed.
          : > missing.ndjson
          search_missing() {
            local q="$1" cursor="" out hn ec
            while :; do
              # shellcheck disable=SC2016  # $q/$c are GraphQL variables, keep literal
              if [ -z "$cursor" ]; then
                out=$(gh api graphql -f query='
                  query($q: String!) {
                    search(query: $q, type: ISSUE, first: 100) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        __typename
                        ... on PullRequest { id number isDraft state headRefName baseRefName mergeCommit { oid }
                          repository { name defaultBranchRef { name } }
                          projectItems(first: 10) { nodes { project { number } } } }
                        ... on Issue { id number state repository { name }
                          projectItems(first: 10) { nodes { project { number } } } }
                      }
                    }
                  }' -F q="$q")
              else
                # shellcheck disable=SC2016  # $q/$c are GraphQL variables, keep literal
                out=$(gh api graphql -f query='
                  query($q: String!, $c: String!) {
                    search(query: $q, type: ISSUE, first: 100, after: $c) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        __typename
                        ... on PullRequest { id number isDraft state headRefName baseRefName mergeCommit { oid }
                          repository { name defaultBranchRef { name } }
                          projectItems(first: 10) { nodes { project { number } } } }
                        ... on Issue { id number state repository { name }
                          projectItems(first: 10) { nodes { project { number } } } }
                      }
                    }
                  }' -F q="$q" -F c="$cursor")
              fi
              echo "$out" | jq -c '.data.search.nodes[]
                | select(.__typename=="PullRequest" or .__typename=="Issue")
                | select(((.headRefName // "") | startswith("release-train/")) | not)
                | select([.projectItems.nodes[].project.number] | index(2) | not)' \
                >> missing.ndjson
              hn=$(echo "$out" | jq -r '.data.search.pageInfo.hasNextPage')
              ec=$(echo "$out" | jq -r '.data.search.pageInfo.endCursor')
              [ "$hn" = "true" ] || break
              cursor="$ec"
            done
          }

          for r in "${SCOPE[@]}"; do
            search_missing "repo:$ORG/$r is:open"
            search_missing "repo:$ORG/$r is:pr is:merged merged:>=$SINCE"
          done

          if [ -s missing.ndjson ]; then
            jq -s -c 'unique_by(.id)[]' missing.ndjson > missing.dedup \
              && mv missing.dedup missing.ndjson
          fi
          COUNT=$(wc -l < missing.ndjson | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Missing from board: $COUNT"

          if [ "$COUNT" -gt "$MAX_ADDS" ]; then
            echo "::error::$COUNT missing exceeds MAX_ADDS=$MAX_ADDS - aborting (likely a token/scope problem making everything look missing, not real drift)."
            exit 1
          fi

          declare -A PROD_BRANCH_CACHE
          resolve_prod_branch() {
            local repo="$1" default_branch="$2" branch
            if [ -n "${PROD_BRANCH_CACHE[$repo]:-}" ]; then
              echo "${PROD_BRANCH_CACHE[$repo]}"; return
            fi
            branch="$default_branch"
            if gh api "/repos/$ORG/$repo/branches/main"   --jq '.name' >/dev/null 2>&1; then
              branch="main"
            elif gh api "/repos/$ORG/$repo/branches/master" --jq '.name' >/dev/null 2>&1; then
              branch="master"
            fi
            PROD_BRANCH_CACHE[$repo]="$branch"
            echo "$branch"
          }
          sha_on_branch() {
            local repo="$1" branch="$2" sha="$3" status
            { [ -z "$sha" ] || [ "$sha" = "null" ]; } && return 1
            status=$(gh api "/repos/$ORG/$repo/compare/$branch...$sha" \
                     --jq '.status' 2>/dev/null) || return 1
            [ "$status" = "behind" ] || [ "$status" = "identical" ]
          }
          add_item() {
            # shellcheck disable=SC2016  # GraphQL variables, keep literal
            gh api graphql -f query='mutation($p: ID!, $c: ID!) {
              addProjectV2ItemById(input: {projectId: $p, contentId: $c}) { item { id } } }' \
              -F p="$PROJECT_ID" -F c="$1" --jq '.data.addProjectV2ItemById.item.id'
          }
          set_status() {
            # shellcheck disable=SC2016  # GraphQL variables, keep literal
            gh api graphql -f query='mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {projectId: $p, itemId: $i, fieldId: $f,
                value: {singleSelectOptionId: $o}}) { projectV2Item { id } } }' \
              -F p="$PROJECT_ID" -F i="$1" -F f="$STATUS_FIELD" -f o="$2" >/dev/null
          }

          : > added.tsv
          add_fail=0
          while IFS= read -r line; do
            TYPE=$(echo "$line" | jq -r '.__typename')
            NID=$(echo "$line"  | jq -r '.id')
            REPO=$(echo "$line" | jq -r '.repository.name')
            NUM=$(echo "$line"  | jq -r '.number')
            # Per-ITEM reset: initializing this inside the merged-PR branch let
            # the flag leak to whatever the loop visited next - an issue after
            # a sibling PR inherited SIB=1 and got mislabeled (Bugbot, #157).
            SIB=0

            if [ "$TYPE" = "Issue" ]; then
              OPT="$BACKLOG_OPT"; DESC="issue -> Backlog"
            else
              STATE=$(echo "$line" | jq -r '.state')
              if [ "$STATE" = "OPEN" ]; then
                if [ "$(echo "$line" | jq -r '.isDraft')" = "true" ]; then
                  OPT="$IN_PROGRESS_OPT"; DESC="draft PR -> In progress"
                else
                  OPT="$CODE_REVIEW_OPT"; DESC="open PR -> Code review"
                fi
              else
                SHA=$(echo "$line" | jq -r '.mergeCommit.oid // ""')
                DEF=$(echo "$line" | jq -r '.repository.defaultBranchRef.name // "main"')
                BASE=$(echo "$line" | jq -r '.baseRefName // ""')
                PB=$(resolve_prod_branch "$REPO" "$DEF")
                OPT="$ON_DEV_OPT"; DESC="merged PR -> On dev"
                # Sibling-based merge: same rule as the closure router
                # (backend#1437 / .github#157) - the dual-workflow mapping must
                # stay synchronized or a sibling missed by auto-add returns to
                # the silently-stranded state on the next sweep. On dev is still
                # the holding column; the card gets the visibility label. Only
                # CLASSIFIED here - the actual label write happens next to the
                # other mutations, inside the DRY_RUN guard (Bugbot, #157: a
                # dry run must not mutate labels either).
                case "$BASE" in
                  develop|staging|master|main|"") : ;;
                  *)
                    SIB=1
                    DESC="merged sibling-base PR -> On dev + sibling-merge label"
                    ;;
                esac
                if sha_on_branch "$REPO" "staging" "$SHA"; then
                  OPT="$FR_STAGING_OPT"; DESC="merged PR -> FR on staging"
                fi
                if sha_on_branch "$REPO" "$PB" "$SHA"; then
                  OPT="$PROD_OPT"; DESC="merged PR -> Prod"
                fi
              fi
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY]  would add $REPO#$NUM ($DESC)"
              printf '%s\t%s\n' "$REPO#$NUM" "$DESC" >> added.tsv
              continue
            fi
            if item=$(add_item "$NID") && [ -n "$item" ]; then
              if set_status "$item" "$OPT"; then
                echo "[OK]   added $REPO#$NUM ($DESC)"
              else
                echo "[WARN] added $REPO#$NUM but Status set failed"
                add_fail=$((add_fail+1))
              fi
              # Sibling visibility label - written AFTER the status so a label
              # failure can never cost the card its column (.github#157's
              # ordering lesson), and inside the wet path so dry runs skip it.
              # Hard-fails per the PROJECTS_KANBAN_TOKEN write rule.
              if [ "${SIB:-0}" = "1" ]; then
                if ! gh api "repos/$ORG/$REPO/labels/sibling-merge" >/dev/null 2>&1; then
                  gh api "repos/$ORG/$REPO/labels" -f name=sibling-merge -f color=bfdadc -f description="Merged into a sibling feature branch; content ships via the parent PR (backend#1437)" >/dev/null
                fi
                gh api -X POST "repos/$ORG/$REPO/issues/$NUM/labels" -f "labels[]=sibling-merge" >/dev/null
              fi
              printf '%s\t%s\n' "$REPO#$NUM" "$DESC" >> added.tsv
            else
              echo "[FAIL] could not add $REPO#$NUM"
              add_fail=$((add_fail+1))
            fi
          done < missing.ndjson

          # Fail closed. Both branches above were printed and then forgotten - no
          # counter, no non-zero exit - so this step could fail on every single item
          # and still go green.
          #
          # [WARN] is counted as a failure, not tolerated, and it is the worse of the
          # two: the card exists on the board with no Status, so it renders in no
          # column and is invisible in every column view. Nor does anything repair
          # it - the classify pass above reads a null Status as "No status" and
          # routes that to no-action for both PRs and issues, and this membership
          # sweep skips the card because it now IS on the board. A [FAIL] card at
          # least stays missing and gets rediscovered by tomorrow's sweep; a
          # Status-less one counts as present and is never revisited by either pass.
          if [ "$add_fail" -ne 0 ]; then
            echo "::error::$add_fail item(s) could not be added, or were added without a Status (see [FAIL]/[WARN] lines above). A card with no Status appears in no column."
            exit 1
          fi

      - name: Membership summary
        if: always() && steps.membership.outputs.count != '' && steps.membership.outputs.count != '0'
        run: |
          {
            echo "## Membership reconcile"
            echo ""
            echo "Found missing from board: ${{ steps.membership.outputs.count }} | Dry run: $DRY_RUN"
            echo ""
            if [ -s added.tsv ]; then
              awk -F'\t' '{print "- "$1" -> `"$2"`"}' added.tsv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
