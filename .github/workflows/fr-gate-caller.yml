name: FR gate

# Per-repo caller. Blocks merges to staging/main unless every contained kanban item
# is in "Ready for staging" or "Ready for prod" respectively. All logic lives in
# tracebloc/.github/.github/workflows/fr-gate.yml.
#
# This repo HOSTS that reusable, so this caller is a self-reference — and it is
# pinned `@main` like every other caller, deliberately (RFC-BACKEND-1405 open
# question 3, answered: branch promotion, one standard process for every repo).
#
# The consequence is worth naming rather than discovering: a change to fr-gate.yml
# on `develop` is NOT gating its own PR. The gate that runs is main's. So this repo
# cannot self-test a gate change before promoting it, which is precisely why the
# develop -> staging -> main path matters here more than anywhere else: `staging`
# is the only place a new gate runs against real board state before ten other
# repos start consuming it at `@main`.
#
# `branches:` omits `master` — this repo has never had one, and listing a branch
# that does not exist is how dead filters accumulate (backend#1428).

on:
  pull_request:
    branches: [staging, main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

jobs:
  gate:
    uses: tracebloc/.github/.github/workflows/fr-gate.yml@main
    secrets: inherit
