# Caller-inventory drift guard (tracebloc/backend#1415).
#
# WHY THIS EXISTS: nothing in the org detected a missing caller.
# merge-settings-drift.yml reads three booleans. kanban-reconcile.yml:436 probes a
# single filename to decide board scope, so a 403 there is indistinguishable from
# "repo not tracked". Eight repos drifted unnoticed, and e2e-test-agent#1 closed
# without routing because no closure caller exists in that repo at all. A caller
# that is simply absent produces no run, no annotation and no red check — the
# absence of a signal is not a signal, which is why it went unnoticed for months.
#
# WHAT IT COMPARES: /repo-inventory.yml, the single source of truth, against every
# active repo in the org. Matching is on the resolved `uses:` value of a parsed
# workflow, never on filename — two filename conventions are mixed within nearly
# every repo, kanban-closure-router's callers match neither, and code-quality.yml:60
# is a commented-out example that a grep would count as a caller. It reads the
# develop-first branch: twelve of twenty repos default to main/master while work
# lands on develop, so a default-branch audit under-reports anything in flight.
#
# REPORT-ONLY on schedule, PR and push. The `create-prs` dispatch input is the only
# path that writes, and it writes ONE family: copies marked `required` in the
# inventory that are missing or drifted (backend#1608 item 4). Callers are not
# generated — their content is repo-specific, measured 2026-08-12 as eight different
# code-quality-caller.yml files across eight repos — and protection/rulesets are API
# settings no commit can change. Entries marked `divergent` or `exempt` carry a
# written reason and are never rewritten.
#
# `quality_files` (CLAUDE.md, .cursor/BUGBOT.md — backend#1608 increment 5) is also
# NOT remediable, and unlike the others that is a deliberate refusal rather than a
# technical limit: a commit could trivially create the file. But the family asserts
# that per-repo GUIDANCE exists, and auto-generating a placeholder would turn every
# finding green while adding nothing a tool can use — a check that can no longer
# fail, which is the one outcome this repo's guards exist to prevent. These findings
# are closed by a human writing the file.
#
# TOKEN: report-only needs org-wide read. create-prs additionally needs Contents: RW
# and Pull requests: RW — AND, because the callers it writes live under
# `.github/workflows/`, the `workflow` scope (classic PAT) or fine-grained
# "Workflows: write". Contents: RW alone is REFUSED for that path, so every
# remediation PUT would fail closed and no PR would open. standards-sync.yml writes
# CLAUDE.md, not workflow files, so it needs no `workflow` scope — the one scope
# that differs from what it exercises. (Bugbot #227.)
#
# FAIL-CLOSED: every read either yields a value or is recorded as unreadable, and
# one unreadable repo fails the run. There is no path from a 403, a rate limit, an
# unparseable workflow, a truncated tree or a missing inventory key to a green run.
# The final step fails on anything other than a literal exit code of 0, including
# an absent one — a skipped or crashed audit step must not read as all-clear.
#
# All interpolations reach shell through `env:` and are read as quoted variables,
# never spliced into a command line.

name: Caller inventory drift

on:
  schedule:
    - cron: '30 6 * * 1' # Mondays 06:30 UTC, right after merge-settings-drift
  workflow_dispatch:
    inputs:
      create-prs:
        description: 'Open remediation PRs for drifted/missing REQUIRED copies'
        type: boolean
        default: false
        required: false
  # Edits to the inventory or the guard are validated against reality on the PR
  # that makes them, so a wrong inventory cannot reach develop unchallenged.
  pull_request:
    paths:
      - repo-inventory.yml
      - scripts/caller-drift.py
      - scripts/tests/caller-drift-selftest.py
      - .github/workflows/caller-drift.yml
      - .github/workflows/conformance-gate.yml
  push:
    branches: [main, develop]
    paths:
      - repo-inventory.yml
      - scripts/caller-drift.py
      - scripts/tests/caller-drift-selftest.py
      - .github/workflows/caller-drift.yml
      - .github/workflows/conformance-gate.yml

permissions:
  contents: read
  issues: write # the drift report lands on a tracking issue

concurrency:
  group: caller-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The guard's own fail-closed paths, asserted offline with a stubbed `gh`: a 403,
  # a rate limit, a truncated tree, an unparseable workflow and a missing inventory
  # key must each produce a FAILURE, never "no caller found". The audit needs this,
  # so a regression here stops the audit from reporting at all rather than letting
  # it report all-clear from a broken comparison.
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'
      - run: python scripts/tests/caller-drift-selftest.py

  audit:
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Job-level so BOTH reporting steps below resolve it. Defined in one step's
      # env: it was undefined in the other, and under `set -u` that step dies —
      # loud rather than silent, but the drift comment would never post.
      WATCHDOG_ISSUE: '1781'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        # The guard parses workflows as YAML rather than grepping them, so there is
        # no degraded mode worth having. If this step fails, the audit step is
        # skipped, its exit_code output is empty, and the final step fails on the
        # empty value rather than letting a skipped audit look clean.
        run: python -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'

      # THE ONE AUDIT THAT DOES NOT AUTHENTICATE AS THE APP, and this is a decision
      # rather than an omission (backend#2036, decided by Lukas 2026-08-17).
      #
      # Its three siblings -- standards-sync, merge-settings-drift, bricked-prs --
      # moved to the tracebloc-release-train App. This one cannot, because it is the
      # only audit that asserts ruleset BYPASS ALLOWLISTS, and GitHub returns
      # `bypass_actors` only to a caller with WRITE access to the ruleset:
      #
      #   "To prevent leaking sensitive information, the bypass_actors property is
      #    only returned if the user making the API request has write access to the
      #    ruleset."
      #
      # So no read-level permission can fix it. `administration: read` was granted
      # and measured: it fixed all 52 branch-protection reads and left every
      # `bypass_actors` withheld. The only sufficient grant is
      # `administration: write`, which would give an App invoked by ~14 workflows on
      # every PR and push the power to REWRITE branch protection and every ruleset
      # across the fleet -- including the `v*` tag trust root whose bypass list this
      # audit exists to police. Granting write over the trust root in order to read
      # who may bypass it makes the auditor one of the actors it audits.
      #
      # So this stays on PROJECTS_KANBAN_TOKEN, deliberately, and #2036 closes with
      # the PAT alive for exactly this one consumer. That is the SAFEST place for a
      # privileged credential to remain: a weekly cron, never event-triggered, so no
      # outside contributor can influence when it runs, and it never writes.
      #
      # DO NOT "finish" #2036 by pointing this at the App. If a future GitHub release
      # returns `bypass_actors` to a read-scoped caller, migrate then and delete this
      # comment. Until it does, a green audit here means the allowlist was actually
      # read -- which under the App it would not be (see the `bypass_present` note in
      # caller-drift.py, and the 16 unreadable records that change produced).
      - name: Check the audit token is present
        # Guards an EMPTY token reaching the audit, which is what makes this guard
        # fail open: the org listing returns nothing and every check passes against
        # an empty scope.
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_KANBAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::The installation token is empty. Without it the org listing" \
                 "returns nothing and every check would pass against an empty scope." >&2
            exit 1
          fi

      - name: Compare every active repo against repo-inventory.yml
        id: audit
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_KANBAN_TOKEN }}
          # The event is asserted explicitly rather than inferred from `inputs`
          # being unset — same expression standards-sync.yml uses. Writing to
          # twenty repos is not something a cron may decide to do, and a
          # PR-triggered audit that wrote to the fleet would be a supply-chain
          # hole rather than a convenience.
          CREATE_PRS: ${{ github.event_name == 'workflow_dispatch' && inputs.create-prs == true }}
        run: |
          set -uo pipefail
          remediate=""
          if [ "${CREATE_PRS:-false}" = "true" ]; then
            remediate="--create-prs"
            echo "Remediation ENABLED: required copies that are missing or drifted"
            echo "will get a PR. divergent/exempt entries are never rewritten."
          fi
          # The exit code is recorded rather than raised so that the reporting step
          # below still runs on a failure. The step itself therefore always exits 0
          # — the run is failed by the final step, from this recorded value.
          set +e
          python scripts/caller-drift.py \
            --inventory repo-inventory.yml \
            --source-dir . \
            ${remediate}
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "The audit exited $code (0 clean, 1 drift, 2 could not evaluate)."

      - name: Rewrite the conformance matrix on the watchdog issue
        # THE ONE SCREEN (backend#1608 item 3).
        #
        # The comment step below fires only on drift, deliberately — an all-clear
        # per run trains people to ignore the issue (backend#1344). The cost of
        # that, until now, was that a CONFORMANT fleet published nothing at all:
        # the matrix existed only in a step summary on a run nobody opens, so
        # "where does the fleet stand?" was still answered by running the script by
        # hand. Comments are the history; this body is the current state.
        #
        # Rewritten on EVERY scheduled/manual run regardless of outcome, which is
        # what makes staleness meaningful: the body carries the run timestamp and
        # the audit is weekly, so a timestamp older than ~8 days means the audit
        # itself stopped and the fleet is UNKNOWN. That is the backend#1530
        # cron-watchdog contract, and it only holds if a red run rewrites the body
        # too — otherwise a fleet that broke in January still shows January's
        # green and looks merely stale-ish.
        #
        # `always()`, and NOT gated on exit_code: a run that could not evaluate
        # must overwrite the previous green with UNKNOWN. Leaving the last good
        # matrix in place is the fail-open this whole guard exists to refuse.
        if: >-
          always()
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_KANBAN_TOKEN }}
          CODE: ${{ steps.audit.outputs.exit_code }}
          REPORT: ${{ steps.audit.outputs.report }}
          EVALUATED: ${{ steps.audit.outputs.evaluated }}
          UNREADABLE: ${{ steps.audit.outputs.unreadable }}
          CALLER_UNREADABLE: ${{ steps.audit.outputs.caller_unreadable }}
          PROTECTION_UNREADABLE: ${{ steps.audit.outputs.protection_unreadable }}
          RULESET_UNREADABLE: ${{ steps.audit.outputs.ruleset_unreadable }}
          LISTING_UNREADABLE: ${{ steps.audit.outputs.listing_unreadable }}
          FINDINGS: ${{ steps.audit.outputs.findings }}
          FINDINGS_TOTAL: ${{ steps.audit.outputs.findings_total }}
          REMEDIATED: ${{ steps.audit.outputs.remediated }}
          REMEDIATION_FAILURES: ${{ steps.audit.outputs.remediation_failures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          code="${CODE:-}"
          now="$(date -u '+%Y-%m-%d %H:%M UTC')"

          # NAME WHICH READ FAILED, once, for every verdict below. UNREADABLE is the merged list, so wording
          # it as "repo(s) could not be read" announced a failed protection or
          # ruleset read as a repo nobody looked at -- true count, false name
          # (Bugbot #238). The script emits the split; use it.
          what=""
          [ "${CALLER_UNREADABLE:-0}" != "0" ] && what="${CALLER_UNREADABLE} repo(s) could not be read (caller/copy state UNKNOWN)"
          if [ "${PROTECTION_UNREADABLE:-0}" != "0" ]; then
          [ -n "$what" ] && what="$what; "
          what="${what}${PROTECTION_UNREADABLE} branch-protection read(s) failed (protection state UNKNOWN)"
          fi
          if [ "${RULESET_UNREADABLE:-0}" != "0" ]; then
          [ -n "$what" ] && what="$what; "
          what="${what}${RULESET_UNREADABLE} ruleset read(s) failed (ruleset state UNKNOWN)"
          fi
          # The fourth bucket, and the reason the fallback below is not enough on
          # its own: it fires only when `what` is ENTIRELY empty, so a listing gap
          # MIXED with any other cause was silently dropped from the sentence rather
          # than mis-named -- the same true-count-false-name class, one step further
          # along (Bugbot, #278). Its fix is "widen the App installation", which no
          # other clause would ever suggest.
          if [ "${LISTING_UNREADABLE:-0}" != "0" ]; then
          [ -n "$what" ] && what="$what; "
          what="${what}${LISTING_UNREADABLE} declared repo(s) missing from the org listing (fleet coverage UNKNOWN)"
          fi
          # Fall back to the merged count rather than an empty sentence if a
          # future read type is added and not surfaced here. The selftest asserts
          # that every `*_unreadable` output the script emits IS surfaced above, so
          # this is a backstop rather than the plan.
          [ -z "$what" ] && what="${UNREADABLE:-0} read(s) failed"
          # Built once: TWO verdicts quote it, and fixing only the first would
          # leave the second still saying "repo(s) could not be read".

          case "$code" in
            0) verdict='✅ **Conformant** — every repo read, every entry matched.' ;;
            1) verdict='🔴 **Drift** — see the latest comment for the findings.' ;;
            2) verdict='⚠️ **Could not evaluate** — the audit did not complete cleanly. Fleet conformance is UNKNOWN; anything not read is NOT known to comply.' ;;
            *) verdict="⚠️ **No result** — the audit exited \`${code:-<empty>}\`, which it should never do. Treat fleet conformance as UNKNOWN." ;;
          esac

          # Exit 2 is not only "an unreadable repo": die() also exits 2 for a bad
          # inventory or a failed org enumeration, where UNREADABLE is 0. Name the
          # actual cause from the count instead of always blaming unread repos
          # (Bugbot #227).
          if [ "$code" = "2" ]; then
            if [ "${UNREADABLE:-0}" != "0" ]; then
              verdict="⚠️ **Could not evaluate** — ${what}. Anything not read is NOT known to comply. Fleet conformance is UNKNOWN."
            else
              verdict='⚠️ **Could not evaluate** — the audit could not run to completion (a bad inventory or a failed org enumeration; see the log). Fleet conformance is UNKNOWN.'
            fi
          fi

          # Exit 2 has two causes and they need different words. Without this, a
          # dispatch whose remediation PRs failed to open is headlined "repos that
          # could not be read are NOT known to comply" - a true sentence about a
          # thing that did not happen, sending the reader to the wrong problem.
          # (Bugbot, #227.)
          if [ "${REMEDIATION_FAILURES:-0}" != "0" ]; then
            if [ "${UNREADABLE:-0}" != "0" ]; then
              verdict="⚠️ **Remediation failed** — ${REMEDIATION_FAILURES} repo(s) still carry their drift, and ${what} — NOT known to comply."
            else
              verdict="⚠️ **Remediation failed** — the fleet was read successfully, but ${REMEDIATION_FAILURES} repo(s) could not be remediated and still carry their drift."
            fi
          fi

          # backend#1965: a REMEDIATED run is green, but it is not 'every entry
          # matched' -- drift was found and is still on the fleet until those PRs
          # merge. Saying Conformant here would be the mirror of the bug this
          # change fixes: a true exit code under a false headline.
          if [ "$code" = "0" ] && [ "${REMEDIATED:-0}" != "0" ]; then
            verdict="✅ **Remediated** — ${FINDINGS_TOTAL:-?} drift finding(s), every one with a PR open. The fleet is NOT yet conformant, it is fixed-pending-merge: the next run goes red again if those PRs are closed unmerged."
          fi

          # The verdict must not be able to contradict the counts printed beside it.
          # A clean exit code alongside a non-zero unreadable/findings count is not a
          # green fleet, it is a broken audit — and "✅ every repo read" printed above
          # "3 unreadable" is the most confidently wrong thing this issue could say.
          # The script does not currently produce that pair, which is exactly why it
          # is worth pinning: the headline is DERIVED from the numbers, so it stays
          # true if the exit-code contract ever changes.
          # FINDINGS is the UN-REMEDIATED count (backend#1965), which is exactly
          # what keeps this guard meaningful after that change: a clean exit beside
          # a finding nothing fixed is still a contradiction, a remediated one is
          # not. Comparing the TOTAL here would make every successful --create-prs
          # run report 'Inconsistent result ... fix the audit' -- trading a false
          # red for a worse one, since that headline tells the reader to stop
          # trusting the audit itself.
          if [ "$code" = "0" ] && { [ "${UNREADABLE:-0}" != "0" ] || [ "${FINDINGS:-0}" != "0" ]; }; then
            verdict="⚠️ **Inconsistent result** — the audit exited clean while reporting ${UNREADABLE:-?} unreadable and ${FINDINGS:-?} finding(s). Treat fleet conformance as UNKNOWN and fix the audit."
          fi

          # shellcheck disable=SC2016  # backticks are markdown code spans in the
          # issue body, not command substitution — hence the single quotes.
          {
            printf 'This issue is the org'"'"'s repo-conformance surface (backend#1608). The weekly\n'
            printf 'audit in `tracebloc/.github` (`caller-drift.yml`) rewrites this body on every\n'
            printf 'run; drift arrives separately as a **comment**. The body is the current\n'
            printf 'state, the comments are the history.\n\n'
            printf '**Fail-closed contract:** the audit runs **Mondays 06:30 UTC**. If the\n'
            printf 'timestamp below is stale by more than ~8 days, the audit itself has died —\n'
            printf 'that staleness is the alarm, and fleet conformance is UNKNOWN rather than\n'
            printf 'fine. Do not close this issue.\n\n'
            printf -- '---\n\n'
            printf '### Last audit: %s\n\n' "$now"
            printf -- '- Repos evaluated: **%s** (%s unreadable)\n' "${EVALUATED:-?}" "${UNREADABLE:-?}"
            printf -- '- Findings: **%s**' "${FINDINGS_TOTAL:-${FINDINGS:-?}}"
            if [ "${REMEDIATED:-0}" != "0" ]; then
              printf -- ' (%s with a PR open, %s still un-remediated)' "${REMEDIATED}" "${FINDINGS:-?}"
            fi
            printf -- '\n'
            printf -- '- Verdict: %s\n\n' "$verdict"
            if [ -n "${REPORT:-}" ]; then
              printf '%s\n\n' "$REPORT"
            else
              # No report body on a run that was supposed to produce one is itself a
              # finding: say so here rather than leaving the previous matrix visible.
              printf 'The audit produced **no report body**, so no matrix could be rendered.\n'
              printf 'Fleet conformance is UNKNOWN for this run — see the run log.\n\n'
            fi
            printf '[Run log](%s)\n' "$RUN_URL"
          } > wd-body.md

          # GitHub rejects a body over 65536 characters. A rejected edit would leave
          # the previous body in place — a stale green presented as current, the one
          # outcome this step exists to prevent — so truncate and say that we did.
          if [ "$(wc -c < wd-body.md)" -gt 60000 ]; then
            head -c 59000 wd-body.md > wd-body.trunc
            {
              printf '\n\n---\n\n**TRUNCATED** — the full report exceeded GitHub'"'"'s issue-body\n'
              printf 'limit. See the [run log](%s) for the complete matrix.\n' "$RUN_URL"
            } >> wd-body.trunc
            mv wd-body.trunc wd-body.md
          fi

          gh issue edit "$WATCHDOG_ISSUE" --repo tracebloc/backend --body-file wd-body.md

      - name: Report on the tracking issue
        # Only on scheduled and manual runs: a PR that edits the inventory gets its
        # answer from the check itself, and a comment per push would train everyone
        # to ignore the issue (backend#1344 — five silent failures nobody read).
        # No all-clear comment ever, for the same reason.
        if: >-
          always()
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && steps.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_KANBAN_TOKEN }}
          CODE: ${{ steps.audit.outputs.exit_code }}
          REPORT: ${{ steps.audit.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          code="${CODE:-}"

          # shellcheck disable=SC2016  # the backticks below are markdown code spans
          # in the issue body, not command substitution — they must stay literal,
          # which is exactly why these printf strings are single-quoted.
          {
            case "$code" in
              1)
                printf '## Caller inventory drift\n\n'
                printf 'Reality has diverged from `repo-inventory.yml`. Either a repo lost a\n'
                printf 'caller, or the inventory is out of date — the report below says which.\n\n'
                ;;
              2)
                printf '## Caller inventory could NOT be evaluated (or remediation failed)\n\n'
                printf 'This is not a clean result. Either `repo-inventory.yml` failed schema\n'
                printf 'validation, one or more repos could not be read, or remediation PRs\n'
                printf 'could not be opened/refreshed. Repos that could not be read are **not**\n'
                printf 'known to comply, and drift that could not be remediated still stands —\n'
                printf 'fix the token, the inventory, or the remediation dispatch and re-run\n'
                printf 'before drawing any conclusion.\n\n'
                ;;
              *)
                printf '## Caller inventory guard did not report a result\n\n'
                printf 'The audit step produced exit code `%s`, which it should never do. Treat\n' "${code:-<empty>}"
                printf 'the caller state across the org as UNKNOWN until this is explained.\n\n'
                ;;
            esac
            if [ -n "${REPORT:-}" ]; then
              printf '%s\n\n' "$REPORT"
            else
              printf 'The audit produced no report body — see the run log.\n\n'
            fi
            printf '[Run log](%s)\n' "$RUN_URL"
          } > body.md
          # backend#1781, not #1415: #1415 is CLOSED. Comments on a closed issue
          # still post, so this looked like it worked — but a closed issue cannot
          # be pinned, drops out of every default issue view, and notifies nobody
          # who is not already subscribed. Drift has been reporting into a drawer.
          gh issue comment "$WATCHDOG_ISSUE" --repo tracebloc/backend --body-file body.md

      - name: Fail the run unless the audit came back clean
        # A green run must mean "the inventory matches reality", never merely "the
        # workflow executed". Anything other than a literal 0 fails, and an absent
        # value fails hardest: it means the audit step was skipped or died, which is
        # exactly the failure-that-reports-success this whole guard is about.
        if: always()
        env:
          CODE: ${{ steps.audit.outputs.exit_code }}
          REMEDIATED: ${{ steps.audit.outputs.remediated }}
          FINDINGS_TOTAL: ${{ steps.audit.outputs.findings_total }}
        run: |
          set -euo pipefail
          code="${CODE:-}"
          case "$code" in
            0)
              # Exit 0 has TWO meanings after backend#1965: a clean match, or a
              # fully remediated run (every finding got a PR). "every entry
              # matched" is only true for the first -- printing it for a
              # remediated run is the same false-green headline this change
              # strips from the watchdog body, so the log branches on the same
              # REMEDIATED signal the verdict does.
              if [ "${REMEDIATED:-0}" != "0" ]; then
                echo "Every active repo read; ${FINDINGS_TOTAL:-?} drift finding(s) remediated, every one with a PR open. The fleet is fixed-pending-merge, NOT yet conformant."
              else
                echo "Every active repo read; every inventory entry matched."
              fi
              ;;
            1)
              echo "::error::Caller-inventory drift detected. See the run summary." >&2
              exit 1
              ;;
            2)
              echo "::error::The caller inventory could not be evaluated or remediated — bad" \
                   "inventory, failed org enumeration, an unreadable repo, or remediation PRs" \
                   "that could not be opened. This is NOT an all-clear." >&2
              exit 1
              ;;
            *)
              echo "::error::The audit step reported no exit code ('$code'). It was skipped or" \
                   "it crashed; caller state across the org is UNKNOWN. Failing closed." >&2
              exit 1
              ;;
          esac
