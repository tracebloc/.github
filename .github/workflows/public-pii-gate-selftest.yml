name: PII gate selftest

# public-pii-gate.yml is a `workflow_call` reusable, so it cannot host a test job
# of its own — this workflow runs its decision table instead.
#
# Why it exists: every defect in backend#1409 was a path that reported "clean"
# having compared nothing, and each was found by reading the file after it had
# shipped. A fail-open is invisible in a diff and obvious in a run. The gate is
# consumed at @main by every public repo, so a regression here reaches all of
# them on its first successful run.
#
# scripts/tests/pii-gate-selftest.sh extracts the gate's `run:` block and executes
# it against a stubbed `gh`. It asserts the exit status AND a distinguishing phrase
# per case, because several paths share an exit code while needing to say different
# things — a fork PR and an unconfigured org both exit 1, and only one of them is
# fixable by an admin.

on:
  pull_request:
    paths:
      - .github/workflows/public-pii-gate.yml
      - .github/workflows/public-pii-gate-selftest.yml
      - scripts/tests/pii-gate-selftest.sh
  push:
    branches: [main, develop, staging]
    paths:
      - .github/workflows/public-pii-gate.yml
      - .github/workflows/public-pii-gate-selftest.yml
      - scripts/tests/pii-gate-selftest.sh

permissions:
  contents: read

concurrency:
  group: pii-gate-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'
      - run: bash scripts/tests/pii-gate-selftest.sh
