# Org-standards sync guard (tracebloc/backend#1602).
#
# WHY THIS EXISTS: the org's working rules were per-repo prose islands. Measured
# 2026-08-06: 5 of 14 repo CLAUDE.mds carried the develop-only rule in five
# phrasings, client/CLAUDE.md mandated a retired assignee policy, model-zoo's
# named a default branch that no longer exists, and five active repos had no
# CLAUDE.md at all. A rule that drifts per repo is re-litigated per PR — the
# same failure class caller-drift.yml exists for, so this is the same shape:
# one canonical file (/org-standards.md), one guard, absence never implicit.
#
# WHAT IT COMPARES: the canon in the CHECKOUT against the block between
# `<!-- org-standards:begin/end -->` markers in every active repo's CLAUDE.md,
# read develop-first over the API (repo list from repo-inventory.yml).
#
# REPORT-ONLY on schedule. The `create-prs` dispatch input is the remediation:
# it pushes a `docs/1602-org-standards-sync` branch per drifted repo and opens
# a PR against that repo's develop. It never pushes to develop directly and it
# never edits a file with malformed markers (those fail closed, exit 2).
#
# WHY THE AUDIT DOES NOT RUN ON PRs: the canon is read from the checkout, so a
# PR editing org-standards.md legitimately sees the whole fleet as behind — a
# red check there would block every canon change by construction. PRs run the
# offline selftest, which asserts the splice logic and its fail-closed paths.
#
# TOKENS, PLURAL, AND THE SPLIT IS THE POINT (backend#2590).
#
# report-only needs org-wide READ, and the App installation token covers it.
# create-prs needs two different things from two different identities:
#
#   * Contents: RW on the target repos, to push the sync branch -- the App,
#     ORG-scoped, minted below (backend#2036).
#   * A PR AUTHOR WITH A CURSOR SEAT, to open the PR -- `SYNC_PR_AUTHOR_TOKEN`,
#     a human PAT. Cursor Bugbot keys its review on the author's seat, and an
#     App installation token makes the author `tracebloc-release-train[bot]`,
#     which has none: Bugbot skipped all 14 sync PRs and `bugbot / review`
#     failed closed on every one.
#
# THIS PARAGRAPH USED TO SAY THE APP SATISFIED BOTH, and it no longer does
# (@saqlainsyed007, #348 -- the step comment below already said so, so the file
# contradicted itself). It also used to argue that "a second fleet-wide
# credential is the thing backend#2036 exists to stop". That argument was
# right about the risk and is now overtaken by a harder constraint: no App
# token can author a PR Bugbot will look at, so the choice is a second
# credential or no automated review on the fleet's own standards changes.
#
# The debt is real and is written down rather than argued away: the PAT is
# long-lived, human-owned and fleet-wide, and it wants to be a FINE-GRAINED
# token scoped to `pull_requests: write` + `contents: read` on the target
# repos, not a classic `repo` one. Tracked as its own decision rather than
# smuggled in here.
#
# The script still fails closed (exit 2) on the first refused write. Before the
# first branch is pushed it validates the PAT -- present, resolvable, NOT the
# same identity as `SYNC_REVIEWER` (since #348), and, since backend#3187, able
# to read `repository.defaultBranchRef` on a real target: the exact GraphQL
# surface `gh pr create` is refused at when the token has no grant on the fleet
# (which is how the 2026-09-04 create-prs dispatch died after pushing one
# branch). That read is necessary, not sufficient -- only opening a PR proves
# `pull_requests: write` -- so at most ONE orphan branch can still precede a
# `pr create` refusal, and the AuthorUnusable path bounds the blast radius to
# that one repo. "Cannot produce a partial rollout" was the earlier claim and
# was false; this is what the code actually enforces.
#
# All interpolations reach shell through `env:` and are read as quoted
# variables, never spliced into a command line. No event-controlled text
# (titles, bodies, branch names) is interpolated anywhere in this file.

name: Org-standards sync

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC, after caller-drift at 06:30
  workflow_dispatch:
    inputs:
      create-prs:
        description: "Open/refresh per-repo sync PRs (default: report only)"
        type: boolean
        default: false
  pull_request:
    paths:
      - org-standards.md
      - scripts/standards-sync.py
      - scripts/tests/standards-sync-selftest.py
      - .github/workflows/standards-sync.yml
  push:
    branches: [main, develop]
    paths:
      - org-standards.md
      - scripts/standards-sync.py
      - scripts/tests/standards-sync-selftest.py
      - .github/workflows/standards-sync.yml

permissions:
  contents: read
  issues: write # the drift report lands on the tracking issue (via the PAT)

concurrency:
  group: standards-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The splice logic edits files other people own, so its fail-closed paths are
  # asserted offline before any audit: malformed markers never spliced, an
  # empty or marker-carrying canon rejected, repo-owned prose preserved
  # byte-for-byte around the block, stale exemptions fail the run.
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # load_targets() parses an inventory in the selftest's good-path check, so
      # the selftest needs PyYAML like the audit does — a clean setup-python has
      # none (caught red in CI and by Bugbot on .github#170).
      - run: python -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'
      - run: python scripts/tests/standards-sync-selftest.py

  audit:
    needs: selftest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        # The repo list comes from repo-inventory.yml parsed as YAML; there is
        # no degraded mode worth having. If this fails, the audit is skipped,
        # its exit_code output stays empty, and the final step fails on that.
        run: python -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'

      # Authenticates as the tracebloc-release-train App (backend#2036) instead of
      # one human's PAT. `owner:` yields an ORG-scoped installation token; a
      # repo-scoped one cannot read the fleet. The App carries `contents: write`,
      # which is what `create-prs` mode needs to push the per-repo sync branches.
      # No fallback to the PAT: a fallback would let a broken App path keep
      # working silently.
      #
      # THIS TOKEN NO LONGER OPENS THE PRs, and that is the one thing it may not
      # do (backend#2590). Cursor Bugbot keys its review on the PR author's Cursor
      # seat; an App installation token makes the author
      # `tracebloc-release-train[bot]`, which has none, so Bugbot skipped all 14
      # sync PRs and `bugbot / review` failed closed on every one. Everything
      # here still runs as the App -- fleet reads, the CLAUDE.md write, the branch
      # push -- and `SYNC_PR_AUTHOR_TOKEN` below covers `gh pr create` alone.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # CONDITIONAL, BECAUSE THE TWO MODES NEED DIFFERENT THINGS
          # (backend#2157, last of four). This minted the App's entire permission
          # set across every repo the installation covers. Scoping it to the
          # UNION would have kept fleet-wide contents:WRITE on every scheduled
          # report -- which is the mismatch, not the fix, since `report` mode
          # only ever reads.
          #
          # `write` is granted for exactly one thing: the `create-prs` dispatch,
          # which PUTs CLAUDE.md and POSTs a branch ref in each drifted repo. On
          # a schedule run -- where `inputs` is empty, so the condition is false
          # -- the same job gets `read`.
          #
          # DERIVED FROM THE CALLS THIS TOKEN MAKES, checked one by one:
          #   git/ref/heads/develop, repos/{r}, contents/CLAUDE.md?ref=  -> contents: read
          #   PUT contents/CLAUDE.md, POST git/refs   (create-prs only)  -> contents: WRITE
          #   gh pr list                                                 -> pull-requests: read
          #   gh issue comment 1602 (the drift report)                   -> issues: WRITE
          #
          # `== true` RATHER THAN A BARE TRUTHINESS TEST, matching the CREATE_PRS
          # line further down. The input is `type: boolean` today, so a bare
          # `inputs.create-prs` is equivalent -- but if it ever became a string,
          # `'false'` is TRUTHY and this would silently mint write on every
          # scheduled run while still looking conditional.
          #
          # NOT pull-requests:write -- `pr create` and both `pr edit` calls run
          # on SYNC_PR_AUTHOR_TOKEN, not on this token (backend#2590). The App
          # only LISTS PRs here.
          permission-contents: ${{ (github.event_name == 'workflow_dispatch' && inputs.create-prs == true) && 'write' || 'read' }}
          permission-pull-requests: read
          permission-issues: write

      - name: Check the sync token is present
        # KEPT, and pointed at the minted token. A failed mint fails its own step,
        # but the condition this guards is an EMPTY token reaching the audit --
        # which is the fail-open direction: every repo read fails and the audit
        # reports nothing as if it were something. Unchanged by where the token
        # comes from, so the assertion stays.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::The installation token is empty. Without it every repo read" \
                 "fails and the audit would report nothing as if it were something." >&2
            exit 1
          fi

      - name: Compare every active repo's CLAUDE.md block against the canon
        id: audit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # PR CREATION ONLY -- scripts/standards-sync.py reads this for
          # `gh pr create` and the reviewer/assignee edit, and for nothing else
          # (backend#2590). A PAT owned by a seated Cursor user, so the sync PRs
          # have an author Bugbot will review.
          #
          # WHAT IT ACTUALLY NEEDS IS NARROWER THAN WHAT IT HAS
          # (@saqlainsyed007, #348). This said "needs `repo` scope across the
          # fleet; `contents: write` alone cannot open a PR", which conflates
          # two claims. The true one is that the APP's contents:write cannot
          # open a PR Bugbot reviews -- that is an authorship problem, not a
          # scope one. A FINE-GRAINED PAT carrying `pull_requests: write` +
          # `contents: read` on the target repos opens PRs perfectly well, and
          # is dramatically tighter than a classic `repo` token: no code write,
          # no issues, no settings, no webhooks, on every repo its owner can
          # reach.
          #
          # The token in use today is the classic kind. Narrowing it is a
          # re-provisioning decision rather than a code change, so it is
          # recorded here and tracked rather than asserted as already done.
          #
          # NOT GUARDED FOR EMPTINESS HERE, deliberately -- but the guard MOVED
          # (@saqlainsyed007, #348). An unset secret interpolates to "" and the
          # check now runs in `main()` BEFORE the first branch is pushed, not
          # per-repo at PR time: the old placement meant a missing token pushed
          # CLAUDE.md to every drifted repo and then opened no PRs anywhere. A
          # `[ -z ]` check here would still be wrong, because it would abort
          # before the audit and turn "PRs could not be opened" into "fleet
          # state unknown" -- strictly less information.
          #
          # AND THAT ARGUMENT BINDS `main()` TOO (Bugbot, #348). The first
          # version of the moved guard called `die()`, which is the same abort
          # this paragraph rejects, one layer in. It now DISARMS remediation
          # instead: the fleet is still classified and reported, every drifted
          # row reads NOT REMEDIATED, nothing is pushed, and the run exits 2
          # naming the credential.
          SYNC_PR_AUTHOR_TOKEN: ${{ secrets.SYNC_PR_AUTHOR_TOKEN }}
          CREATE_PRS: ${{ github.event_name == 'workflow_dispatch' && inputs.create-prs == true }}
        run: |
          set -uo pipefail
          # The exit code is recorded rather than raised so the reporting step
          # still runs on a failure; the final step fails the run from it.
          args=(--canonical org-standards.md --inventory repo-inventory.yml
                --issue 1602 --report-file report.md)
          if [ "${CREATE_PRS}" = "true" ]; then
            args+=(--create-prs)
          fi
          set +e
          python scripts/standards-sync.py "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "The sync exited $code (0 clean/remediated, 1 drift, 2 could not evaluate)."

      - name: Report on the tracking issue
        # Only scheduled/manual runs reach this job, and it never posts an
        # all-clear — the same no-noise rule as caller-drift (backend#1344:
        # comments nobody reads train everyone to ignore the issue).
        if: always() && steps.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CODE: ${{ steps.audit.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The drift signal is worthless on a CLOSED issue (backend#3186): a
          # comment there notifies nobody and never surfaces on the board, so a
          # red audit sat four days with 19 repos behind and no one paged. The
          # report target is a variable, and the step below asserts it is OPEN
          # before posting -- reopening it if closed, failing closed if it
          # cannot be made open -- so this delivery hop can never silently
          # regress into the void again.
          REPORT_ISSUE: "1602"
          REPORT_REPO: tracebloc/backend
        run: |
          set -euo pipefail
          code="${CODE:-}"

          # shellcheck disable=SC2016  # the backticks below are markdown code
          # spans in the issue body, not command substitution — they must stay
          # literal, which is exactly why these printf strings are single-quoted.
          {
            case "$code" in
              1)
                printf '## Org-standards drift\n\n'
                printf 'One or more repos are behind (or ahead of) the canon in\n'
                printf '`tracebloc/.github/org-standards.md`. Dispatch this workflow with\n'
                printf '`create-prs: true` to open the sync PRs.\n\n'
                ;;
              2)
                printf '## Org-standards state could NOT be evaluated\n\n'
                printf 'Not a clean result: an unreadable repo, malformed markers, or a\n'
                printf 'refused write. Repos that could not be read are **not** known to\n'
                printf 'comply — fix the cause and re-run before drawing any conclusion.\n\n'
                ;;
              *)
                printf '## Org-standards guard did not report a result\n\n'
                printf 'The audit step produced exit code `%s`, which it never should.\n' "${code:-<empty>}"
                printf 'Treat fleet state as UNKNOWN until this is explained.\n\n'
                ;;
            esac
            if [ -s report.md ]; then
              cat report.md
              printf '\n'
            else
              printf 'The audit produced no report body — see the run log.\n\n'
            fi
            printf '[Run log](%s)\n' "$RUN_URL"
          } > body.md
          # ENSURE THE TARGET IS OPEN BEFORE POSTING (backend#3186). A comment on
          # a closed, archived issue reaches nobody and does not reach the board;
          # the guard's entire value is that a human sees the red audit and fires
          # the create-prs dispatch. Read the state, reopen if closed, and FAIL
          # LOUD if it cannot be read or made open -- an undeliverable report must
          # redden the run, never post silently into a closed issue.
          state="$(gh issue view "$REPORT_ISSUE" --repo "$REPORT_REPO" --json state --jq .state 2>/dev/null || true)"
          if [ -z "$state" ]; then
            echo "::error::Cannot read tracking issue ${REPORT_REPO}#${REPORT_ISSUE};" \
                 "refusing to post the drift report where it cannot be seen." >&2
            exit 1
          fi
          if [ "$state" != "OPEN" ]; then
            echo "::notice::Tracking issue ${REPORT_REPO}#${REPORT_ISSUE} is ${state};" \
                 "reopening so the drift report is visible (backend#3186)."
            if ! gh issue reopen "$REPORT_ISSUE" --repo "$REPORT_REPO"; then
              echo "::error::${REPORT_REPO}#${REPORT_ISSUE} is ${state} and could not be" \
                   "reopened; the drift report would be invisible. Failing closed." >&2
              exit 1
            fi
            state="$(gh issue view "$REPORT_ISSUE" --repo "$REPORT_REPO" --json state --jq .state 2>/dev/null || true)"
            if [ "$state" != "OPEN" ]; then
              echo "::error::${REPORT_REPO}#${REPORT_ISSUE} did not reopen (still ${state:-unknown});" \
                   "failing closed rather than posting into a non-open issue." >&2
              exit 1
            fi
          fi
          gh issue comment "$REPORT_ISSUE" --repo "$REPORT_REPO" --body-file body.md

      - name: Fail the run unless the audit came back clean
        # Green must mean "fleet in sync" (or "every sync PR opened"), never
        # merely "the workflow executed". An absent exit code fails hardest:
        # it means the audit step was skipped or died.
        if: always()
        env:
          CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          set -euo pipefail
          code="${CODE:-}"
          case "$code" in
            0)
              echo "Fleet in sync with the canon (or every sync PR opened/refreshed)."
              ;;
            1)
              echo "::error::Org-standards drift detected. See the run summary; dispatch" \
                   "with create-prs to remediate." >&2
              exit 1
              ;;
            2)
              echo "::error::Org-standards state could not be evaluated — unreadable repo," \
                   "malformed markers, or a refused write. NOT an all-clear." >&2
              exit 1
              ;;
            *)
              echo "::error::The audit reported no exit code ('$code'); it was skipped or" \
                   "crashed. Fleet state is UNKNOWN. Failing closed." >&2
              exit 1
              ;;
          esac
