name: TEMP scope probe (backend#2157)

# TEMPORARY. Measures, per token scope, WHICH FIELDS the branch-protection,
# ruleset and repo-settings endpoints actually return. Deleted once measured.
# Read-only: every call is a GET. Nothing is created, patched or deleted.

on:
  pull_request:
    paths:
      - '.github/workflows/scope-probe.yml'
      - '.github/scripts-probe/**'
  workflow_dispatch: {}

permissions:
  contents: read
  checks: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start results file
        env:
          RESULTS: ${{ github.workspace }}/results.tsv
        run: printf 'variant\tprobe\tvalue\n' > "$RESULTS"
      - name: Mint A-full-grant
        id: tok-a
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Probe A-full-grant
        continue-on-error: true
        env:
          GH_ADMIN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS: ${{ github.workspace }}/results.tsv
        run: |
          if [ -z "${{ steps.tok-a.outputs.token }}" ]; then
            printf '%s\tMINT\tFAILED\n' 'A-full-grant' >> "$RESULTS"; exit 0
          fi
          printf '%s\tMINT\tOK\n' 'A-full-grant' >> "$RESULTS"
          bash .github/scripts-probe/probe.sh '${{ steps.tok-a.outputs.token }}' 'A-full-grant'
      - name: Mint H-bricked-candidate
        id: tok-h
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: read
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
          permission-actions: read
      - name: Probe H-bricked-candidate
        continue-on-error: true
        env:
          GH_ADMIN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS: ${{ github.workspace }}/results.tsv
        run: |
          if [ -z "${{ steps.tok-h.outputs.token }}" ]; then
            printf '%s\tMINT\tFAILED\n' 'H-bricked-candidate' >> "$RESULTS"; exit 0
          fi
          printf '%s\tMINT\tOK\n' 'H-bricked-candidate' >> "$RESULTS"
          bash .github/scripts-probe/probe.sh '${{ steps.tok-h.outputs.token }}' 'H-bricked-candidate'
      - name: Mint M-msd-candidate
        id: tok-m
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-issues: write
      - name: Probe M-msd-candidate
        continue-on-error: true
        env:
          GH_ADMIN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS: ${{ github.workspace }}/results.tsv
        run: |
          if [ -z "${{ steps.tok-m.outputs.token }}" ]; then
            printf '%s\tMINT\tFAILED\n' 'M-msd-candidate' >> "$RESULTS"; exit 0
          fi
          printf '%s\tMINT\tOK\n' 'M-msd-candidate' >> "$RESULTS"
          bash .github/scripts-probe/probe.sh '${{ steps.tok-m.outputs.token }}' 'M-msd-candidate'
      - name: Render
        if: always()
        env:
          RESULTS: ${{ github.workspace }}/results.tsv
        run: |
          echo '### Scope probe results' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RESULTS"
