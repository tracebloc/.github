name: Set PR card Status on project

# Reusable workflow. Called from each active repo on PR open / reopen /
# draft-toggle / title-or-body edit (`edited`, added under tracebloc/backend#2556
# so the `closing-ref` job re-runs when the fields it reads change).
# Moves the PR's card to the right Status:
#   - draft PR  → In progress
#   - non-draft → Code review
#
# TWO JOBS, and the second one is here on purpose (tracebloc/backend#2364).
#
#   set-status    writes the card's Status (below)
#   closing-ref   checks that a PR whose TITLE names a ticket actually LINKS it
#
# WHY closing-ref LIVES HERE rather than in a new reusable or in code-quality.yml.
# Three constraints, and this file is the only host that satisfies all three:
#
#   1. It needs a token that can read the PR *and* an issue in ANOTHER repo --
#      almost every house ticket is in `tracebloc/backend`, and nearly every repo
#      is private. This file already mints an ORG-SCOPED installation token for
#      the `tracebloc-release-train` App (measured 2026-08-23: `issues: write`,
#      `pull_requests: write`, `repository_selection: all`), and every one of its
#      19 callers already passes `secrets: inherit`. `code-quality.yml` cannot:
#      it is deliberately secretless and declares `contents: read` only, and a
#      called workflow may not hold more than its caller grants -- adding
#      `pull-requests: read` there would fail all 16 callers at startup with no
#      jobs, before any of them could be updated.
#   2. It must run on the SAME event that puts a card in `Code review`, because
#      the convention it enforces is what makes that card move again later. That
#      event is this file's trigger set by construction.
#   3. A NEW reusable would need a `repo-inventory.yml` row for all 19 repos, and
#      that file is guarded by `conformance-gate.yml` -- a required check that
#      every other merge invalidates. A job in an existing reusable needs no
#      inventory row at all: the inventory tracks CALLERS, one row per reusable.
#
# NOT A REQUIRED STATUS CHECK ANYWHERE, measured before landing: no repo's
# protection or rulesets name `set-status`, and `closing-ref` is new. So a
# finding here is loud and blocks nothing -- which is the point while the fleet
# is still non-compliant (measured 2026-08-23: of the last 25 merged PRs in each
# of 19 repos, 44 pass, 192 would report a finding, 239 name no ticket at all).
# Arming it as a required context is a separate, later decision that belongs
# after that backlog, not in the change that introduces the check.

on:
  workflow_call:
    inputs:
      project-number:
        type: number
        default: 2
      org:
        type: string
        default: tracebloc
      closing-ref-check:
        description: >-
          Run the closing-ref job: a PR whose TITLE names a ticket must LINK it.
          On by default -- the failure it catches is silent, and a repo that opts
          out has to say so in its caller where a reviewer can see it.
        type: boolean
        default: true
      closing-ref-soft-fail:
        description: >-
          Report a closing-ref finding but exit 0. Defaults FALSE: the finding is
          fixed by adding one line to the PR body, not by clearing a backlog, so
          there is nothing to migrate -- and this job is a required context
          nowhere, so a red job blocks no merge. Flip it per caller if a repo
          wants the annotation without the red X. It governs FINDINGS ONLY: a
          malfunction of the check (an unreadable title, an unreadable link
          graph, an API error) exits nonzero either way, which is the same split
          `action-pins-soft-fail` keeps in code-quality.yml.
        type: boolean
        default: false
      quality-ref:
        description: >-
          Ref of tracebloc/.github the closing-ref checker is taken from. Callers
          pin this workflow at `@main`, so `main` is the matching version.
          Override only to test a change to the checker before it merges.
        type: string
        default: "main"

# ONE RUN PER PR WINS, AND IT IS THE NEWEST (backend#2767).
#
# Every trigger this file answers can fire twice in quick succession -- a
# title fixed straight after a body edit, a ready_for_review immediately
# after an edit -- and `edited` made that ordinary rather than rare: the
# 19-PR sweep for backend#2756 armed `edited` on all 20 callers, so what
# was latent on one repo is now live fleet-wide.
#
# Without a group the runs race and the LOSER writes last: an older
# evaluation of the title/body overwrites a newer one, and the card (or the
# closing-ref verdict) settles on stale input. Nothing errors; the board is
# simply wrong, which is the failure mode this whole workflow exists to
# prevent one level down.
#
# `github.ref` is `refs/pull/<n>/merge` on these events, so the group is
# already per-PR; `github.workflow` is the CALLER's workflow name, which
# keeps two different callers in one repo apart. Same shape as
# `rfcs`'s code-quality-caller.yml, deliberately -- one house pattern.
#
# QUEUE, DO NOT CANCEL. The previous revision said "CANCELLING IS SAFE HERE,
# and that is measured rather than assumed ... GitHub surfaces the newest per
# context ... so a cancelled older run blocks nothing." Half of that holds and
# the half that does not is the half that matters.
#
# `gh pr checks` does dedupe to the newest per context, which is where the
# claim came from. `statusCheckRollup.state` does NOT: it aggregates
# WORST-OF across every check run on the commit, so one CANCELLED run sits
# beside three SUCCESS runs of the same name and the rollup reports FAILURE.
# That is what the PR's red X renders from, and what every tool reading the
# rollup sees -- including our own `ship.py` scan.
#
# Measured on `.github#387` (2026-08-30, four runs at 07:39 -- the train
# creates the PR, then edits the body, and `edited` cancelled the in-flight
# `opened` run):
#
#   mergeStateStatus=BLOCKED  rollup=FAILURE
#   EVERY non-SUCCESS context:
#      set-status / set-status  = CANCELLED
#      set-status / closing-ref = CANCELLED
#      quality / format         = SKIPPED
#
# Nothing else was non-green. "Blocks nothing" was right about MERGING -- these
# are not required contexts -- and wrong about what a human sees. A red X that
# is not a real failure is not cosmetic: on 2026-08-28 two reviewers withheld
# approval over exactly this shape of stale red (@saqlainsyed007 on .github#369,
# @aptracebloc on client#890), and both were reading the evidence correctly.
#
# Keeping the GROUP still solves what the group was for. With
# `cancel-in-progress: false` a second run goes PENDING until the first
# finishes rather than running beside it, so the newer evaluation still writes
# last and the card cannot settle on stale input.
#
# THAT IS ORDERING WITHIN THE GROUP, AND ONLY THAT (@saadqbal on #388). An
# earlier draft said "nothing is lost", which is too strong. Cancelling also
# TRUNCATED a superseded run; queuing guarantees it completes. Both the
# `if: state == 'open'` condition and the draft read come off the FROZEN event
# payload, so an `edited` run that lands after the closure router has already
# moved a merged card can still drag it back to `Code review`. Cancelling
# narrowed that window by accident, not by design, and it paid for it with a red
# X on every superseded run. Queuing is the better trade, not a free one.
#
# RESIDUAL, stated rather than glossed: GitHub cancels a previously PENDING run
# when a third event supersedes it, so a burst of 3+ rapid edits can still
# leave one CANCELLED entry. The create-then-edit the train actually does is
# two events, which this removes entirely.
concurrency:
  group: set-pr-status-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ONLY WHILE THE PR IS OPEN (tracebloc/backend#2556). This condition is a
  # DIRECT CONSEQUENCE of adding `edited` to the callers, and it is not optional.
  #
  # Before `edited`, every trigger this workflow had -- opened, reopened,
  # ready_for_review, converted_to_draft -- was reachable only on an OPEN PR, so
  # an unconditional write to `Code review` was always correct. `edited` is not:
  # GitHub fires it when a MERGED PR's title or body is edited, and this job
  # writes Status unconditionally. Editing a typo in a shipped PR's description
  # would therefore drag its card from `Prod` back to `Code review` -- a
  # DEMOTION, in the one file in the fleet whose board writes are not already
  # monotonic (`advance-deploy-env.yml` compares pipeline rank; this job does
  # not, because until now it could not need to).
  #
  # Guarded by state rather than by event name on purpose: `if: github.event.action
  # != 'edited'` would have kept the demotion out but also disabled the board write
  # for a DRAFT toggled by an edit, and it states the exception instead of the rule.
  # The rule is that this job describes an open PR's review state.
  set-status:
    if: ${{ github.event.pull_request.state == 'open' }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine target Status
        id: target
        run: |
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "status_name=In progress" >> "$GITHUB_OUTPUT"
          else
            echo "status_name=Code review" >> "$GITHUB_OUTPUT"
          fi

      # Board writes authenticate as the tracebloc-release-train App, not a human's
      # PAT (backend#2036). The App's installation budget is separate from any
      # person's interactive `gh` usage and does not vanish when someone is
      # offboarded -- `PROJECTS_KANBAN_TOKEN` was ONE user PAT shared by every
      # caller in the fleet, both crons, and that person's own shell, and it was
      # measured exhausted in practice (client-runtime run 31776053792, exit 1).
      #
      # `owner:` makes this an ORG-scoped installation token. Without it the token
      # is scoped to the calling repository, which cannot write an org ProjectV2.
      #
      # NO FALLBACK TO THE PAT, deliberately. A fallback would make a broken App
      # path look like a working migration, which is the exact failure class this
      # work exists to remove. If the mint fails, this job fails.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # SCOPED TO WHAT THIS JOB ACTUALLY DOES (backend#2157). Without these
          # it minted the App's ENTIRE permission set -- contents:write,
          # issues:write, administration:read and the rest -- across every repo
          # the installation covers, on every PR event in the fleet. Of the four
          # mints backend#2157 left, this one has the largest exposure purely
          # because of how often it runs.
          #
          # DERIVED FROM THE CALLS BELOW rather than copied from a template:
          #   organization.projectV2 { fields }     -> projects, read
          #   repository.pullRequest.projectItems   -> pull-requests, read
          #   updateProjectV2ItemFieldValue         -> projects, WRITE
          #
          # NO `issues` SCOPE: this job is PR-only (`github.event.pull_request`).
          # The second mint in this file already carries `permission-issues:
          # read` because the closing-ref job reads the linked ISSUE -- the two
          # differ because their calls differ, not by oversight.
          #
          # A PASSING MINT IS NOT THE PROOF. `release-train/add-to-kanban.yml`
          # records why: "a mint can succeed with a scope the board write then
          # needs and lacks". The evidence is a card that actually moves.
          permission-pull-requests: read
          permission-organization-projects: write

      - name: Update PR Status on project
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ inputs.org }}
          PROJECT_NUMBER: ${{ inputs.project-number }}
          STATUS_NAME: ${{ steps.target.outputs.status_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO_NAME="${REPO_FULL#*/}"

          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          PROJ=$(gh api graphql -f query='
            query($org: String!, $num: Int!) {
              organization(login: $org) {
                projectV2(number: $num) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2SingleSelectField { id name options { id name } }
                    }
                  }
                }
              }
            }' -F org="$ORG" -F num="$PROJECT_NUMBER")

          PROJECT_ID=$(echo "$PROJ" | jq -r '.data.organization.projectV2.id')
          STATUS_FIELD=$(echo "$PROJ" | jq -r '.data.organization.projectV2.fields.nodes[]
            | select(.name=="Status") | .id')
          STATUS_OPT=$(echo "$PROJ" | jq -r --arg s "$STATUS_NAME" '.data.organization.projectV2.fields.nodes[]
            | select(.name=="Status") | .options[] | select(.name==$s) | .id')

          # Wait briefly for the kanban auto-add workflow to register the PR on the project
          for i in 1 2 3 4 5; do
            # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
            ITEM_ID=$(gh api graphql -f query='
              query($org: String!, $repo: String!, $num: Int!) {
                repository(owner: $org, name: $repo) {
                  pullRequest(number: $num) {
                    projectItems(first: 10) { nodes { id project { number } } }
                  }
                }
              }' -F org="$ORG" -F repo="$REPO_NAME" -F num="$PR_NUMBER" \
              | jq -r --arg n "$PROJECT_NUMBER" '.data.repository.pullRequest.projectItems.nodes[]?
                  | select(.project.number == ($n | tonumber)) | .id' | head -1)
            if [ -n "$ITEM_ID" ] && [ "$ITEM_ID" != "null" ]; then break; fi
            echo "PR not yet on project, waiting ($i/5)…"
            sleep 5
          done

          # FAIL CLOSED (backend#2037). This used to log the miss and `exit 0`, so a
          # PR that lost the add-to-kanban race stayed at No Status behind a GREEN
          # check -- nothing surfaced it, and the board's "no card sits at No Status"
          # invariant was broken by the workflow that reports it upheld. backend#1950
          # lost that race by four seconds and sat unnoticed.
          #
          # THE MEASUREMENT THAT BUDGET WAS HELD OPEN FOR HAS ARRIVED (backend#2731).
          # The previous note kept the retry budget at 5 x 5s on purpose -- "widening
          # it would hide how often the race is actually lost, and the point of
          # failing closed is to find that out." The answer came back on 2026-08-27:
          # `.github#361` and `#362` both lost it within seconds, and on `#362` the
          # board ended in the exact state this job would have written. So the job's
          # PURPOSE was achieved and only its VERDICT was wrong -- the worst shape a
          # check can fail in, because nothing is broken and the habit it teaches is
          # to merge past red.
          #
          # So END the race rather than widen the window. A bigger number would still
          # be a guess, and a longer wait is still a wait on a sibling workflow that
          # may simply never have run. This job already holds a token with
          # `organization-projects: write`, and `addProjectV2ItemById` is IDEMPOTENT
          # -- adding an item already on the board returns the existing item id -- so
          # there is nothing here that add-to-kanban would duplicate. That workflow
          # does exactly one thing (an `actions/add-to-project` step and nothing
          # else), which is what makes taking it over in the missing case safe.
          #
          # STILL FAIL-CLOSED. "The card is missing" stays a real finding when it is
          # real: if the PR cannot be resolved to a node, or the add does not come
          # back with an item id, this goes RED exactly as before. What changed is
          # only that "not yet" no longer reports as "missing".
          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
            echo "card absent after 5 retries - adding it here rather than waiting on add-to-kanban"
            # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
            PR_NODE_ID=$(gh api graphql -f query='
              query($org: String!, $repo: String!, $num: Int!) {
                repository(owner: $org, name: $repo) { pullRequest(number: $num) { id } }
              }' -F org="$ORG" -F repo="$REPO_NAME" -F num="$PR_NUMBER" \
              | jq -r '.data.repository.pullRequest.id // empty')
            if [ -z "$PR_NODE_ID" ]; then
              echo "::error::PR #$PR_NUMBER could not be resolved to a node id, so its card" \
                   "cannot be added. Refusing to report a status nobody wrote."
              exit 1
            fi
            # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
            ITEM_ID=$(gh api graphql -f query='
              mutation($p: ID!, $c: ID!) {
                addProjectV2ItemById(input: {projectId: $p, contentId: $c}) { item { id } }
              }' -F p="$PROJECT_ID" -F c="$PR_NODE_ID" \
              | jq -r '.data.addProjectV2ItemById.item.id // empty')
          fi

          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
            echo "::error::PR #$PR_NUMBER is not on project $PROJECT_NUMBER and could not be" \
                 "added to it. The board write cannot proceed; this is not a race."
            exit 1
          fi

          # Pass the option ID with -f (raw string), NOT -F: ProjectV2 option IDs can
          # be all-numeric, and -F coerces all-digit values to an integer, which the
          # $o: String! variable rejects. -f forces a string. (Some option IDs contain
          # letters today, but don't rely on that — IDs regenerate if recreated.)
          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          gh api graphql -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $p, itemId: $i, fieldId: $f,
                value: {singleSelectOptionId: $o}
              }) { projectV2Item { id } }
            }' -F p="$PROJECT_ID" -F i="$ITEM_ID" -F f="$STATUS_FIELD" -f o="$STATUS_OPT" > /dev/null

          echo "→ PR #$PR_NUMBER → Status=$STATUS_NAME"

  # ------------------------------------------------------------------------
  # A PR whose TITLE names a ticket must LINK it (tracebloc/backend#2364).
  #
  # Measured 2026-08-23: `closingIssuesReferences` was 0 on 7 of 7 epic-relevant
  # merged PRs. The house convention puts the ticket in the TITLE; GitHub creates
  # a closing link ONLY from a keyword in the BODY. So the title reference is
  # inert, `kanban-closure-router.yml` finds no linked issue, and correctly does
  # nothing -- every kanban workflow green, every card unmoved. The board has
  # been wrong for weeks behind a green pipeline.
  #
  # This job is a SEPARATE job from `set-status` deliberately, the same reason
  # code-quality.yml keeps six: a finding here must not stop the card being
  # written, and a failed board write must not hide the finding. Steps inside one
  # job short-circuit; jobs do not.
  #
  # NOTHING FROM THE PR IS INTERPOLATED INTO A `run:` BLOCK. The title is read
  # from the API by the checker itself, so a title containing shell or an
  # expression is data, never code. The only expressions below are the repo name
  # and the PR number.
  # ------------------------------------------------------------------------
  closing-ref:
    name: closing-ref
    # Open PRs only, for the same reason as `set-status` above but a smaller
    # consequence: on a merged PR this would be advice about a merge that already
    # happened, and a red X arriving on a shipped PR hours later is noise that
    # teaches people to ignore the check (rule 4). The case `edited` exists to
    # catch -- a retitle -- happens while the PR is open, which is exactly when
    # this still runs.
    if: ${{ inputs.closing-ref-check && github.event.pull_request.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The checker lives here, not in the calling repo, so the reusable fetches
      # it -- same shape as code-quality.yml, blocked-gate.yml and
      # bugbot-gate.yml. `.github` is public, so this needs no token.
      - name: Check out the shared checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/.github
          ref: ${{ inputs.quality-ref }}
          path: .closing-ref-tools
          persist-credentials: false

      # WHY AN APP TOKEN AND NOT `github.token`. The link this reads points at an
      # issue in ANOTHER repo -- `tracebloc/backend` for most of the fleet -- and
      # a repo-scoped GITHUB_TOKEN cannot see it. A node the token cannot read
      # comes back missing from `nodes` while `totalCount` still counts it, which
      # the checker reports as "cannot tell" rather than "not linked". That is the
      # right refusal, but it would be EVERY cross-repo PR's verdict, so the
      # token has to be the org-scoped one.
      #
      # SCOPED, unlike the mint in `set-status` above (backend#2157): this job
      # reads two things and needs nothing else. `set-pr-status.yml` keeps its
      # `mint-scope` exemption for the unscoped board-write mint above; this mint
      # does not use it.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-pull-requests: read
          permission-issues: read

      - name: The title names a ticket, so the PR must link it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOFT_FAIL: ${{ inputs.closing-ref-soft-fail && 'true' || 'false' }}
        run: python3 .closing-ref-tools/scripts/closing-ref-gate.py
